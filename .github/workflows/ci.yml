name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web 构建 + 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 内联构建 + 4 道门禁(glass 覆盖/内容一致/对比度/recipe 消费方)
      - name: Build (inline + audits)
        run: node web-src/build.js

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # debug 不需要签名密钥；gradlew 与 wrapper jar 已在仓库
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
