    IP Address     Physical Protocol\nVlanif10      192.168.10.1   up       up","j":["redirect: 强制重定向下一跳","classifier 用 if-match acl 3000 匹配流量 → behavior 执行 redirect，缺匹配条件则策略不生效"],"u":["核心交换机做全网网关","双出口源地址分流"],"w":["Vlanif双UP前提是该VLAN下有活动物理口"],"v":"display ip interface brief 查状态","l":["起Vlanif10和20配IP","跨VLAN电脑互ping"]},{"id":"A3","t":"A3. OSPF 多区域与 LSA 1-5分析","lab":false,"y":"动态路由。分多区域减小路由表。\nArea0(骨干)、Stub(无外部路由)、NSSA(允许Type7)。\nLSA: T1(路由器)、T2(网络)、T3(汇总)、T4(ASBR位置)、T5(外部)、T7(NSSA 外部 LSA，由 NSSA 内 ASBR 产生，经 ABR 转换为 T5 注入骨干)。\n网络类型：Broadcast(以太网，需选 DR/BDR)；P2P(串口/子接口，不选 DR，收敛快)；NBMA(Frame-Relay 等，需手工指邻居)；P2MP(模拟 NBMA 为多点，不选 DR)。","dg":{"k":"flow","n":[{"t":"Area 1"},{"t":"ABR"},{"t":"Area 0"},{"t":"ASBR"},{"t":"外网"}],"l":["","","",""]},"c":"[Huawei] ospf 1 router-id 1.1.1.1\n[Huawei-ospf-1-area-0.0.0.0] network 10.0.0.0 0.0.0.255","o":"Area Id    Interface    Neighbor id    State\n0.0.0.0    GE0/0/0      2.2.2.2        Full","j":["router-id: 身份证","0.0.0.255: 反掩码"],"u":["中大型园区网路由自动学习"],"w":["MTU不一致卡ExStart","网段宣告错反掩码","NBMA 必须手工 neighbor 指邻居，P2P 无 DR 选举","参考标准：RFC 2328(OSPFv2)"],"v":"display ospf peer 查Full状态","l":["两台路由器跑OSPF","互相宣告直连网段","查路由表看'O'路由"]},{"id":"A4","t":"A4. BGP 跨域动态路由基本","lab":false,"y":"互联网骨干路由协议。EBGP(跨AS)，IBGP(同AS)。靠丰富的路径属性(Local_Pref, MED)控制选路。\nIBGP 全网状防环但不可扩展：路由反射器(RR) 允许客户机反射路由，规模大时配 RR 或联盟(Confederation，把大 AS 拆成子 AS 配成联盟)缓解。","dg":{"k":"flow","n":[{"t":"AS 100"},{"t":"AS 200"}],"l":["EBGP"]},"c":"[Huawei] bgp 100\n[Huawei-bgp] peer 10.0.0.2 as-number 200\n[Huawei-bgp] network 192.168.1.0 24\n[Huawei-bgp] reflector cluster-id 1.1.1.1\n[Huawei-bgp] peer 10.0.0.2 reflect-client","o":"BGP Local AS: 100\nNetwork        NextHop   MED  LocPrf Path\n*> 192.168.1.0 0.0.0.0   0    100    i","j":["peer: 建立对等体","network: 宣告进BGP","reflect-client: 将对端设为 RR 客户，RR 反射其路由"],"u":["企业多出口双线冗余","运营商互联"],"w":["EBGP默认TTL为1不能多跳","IBGP需全互联防环","参考标准：RFC 4271(BGP-4)"],"v":"display bgp peer 查Established","l":["配置EBGP邻居","宣告网段并用抓包看Update报文"]},{"id":"A5","t":"A5. BGP 属性控制与选路原则 },{"t":"Target Pod"}],"l":["",""]},"c":"kubectl apply -f network-delay.yaml","o":"networkchaos.chaos-mesh.org/delay-test created","j":["基于 Linux netem 机制在内核层模拟异常"],"u":["故障演练","高可用架构 Resilience 断言"],"w":["切忌直接在生产环境全量注入，必须设置限制范围"],"v":"在目标 Pod 内 ping 对端观察延迟增加","l":["编写 NetworkChaos YAML","执行 kubectl apply 触发演练"]},{"id":"Y2","t":"Y2. 韧性工程: 自动断路器 (Circuit Breaker)","lab":false,"y":"当网络出现高延迟或丢包时，自动熔断异常节点，避免雪崩效应。结合 Service Mesh 实现降级。","dg":{"k":"flow","n":[{"t":"Client"},{"t":"熔断器触发"},{"t":"X"},{"t":"Overloaded Server"}],"l":["异常率>50%","",""]},"c":"apiVersion: networking.istio.io/v1alpha3\nkind: DestinationRule\nspec:\n  trafficPolicy:\n    outlierDetection:\n      consecutive5xxErrors: 3","o":"OutlierDetection: 3 consecutive errors, host ejected for 30s","j":["主动剔除不健康节点"],"u":["网络闪断与服务降级防护"],"w":["熔断阈值设置过敏会导致正常节点被误剔除"],"v":"并发压测触发熔断查看错误返回","l":["配置 Istio DestinationRule","模拟网络丢包观察 Pod 被踢出"]},{"id":"Z2_1","t":"Z2.1. SRE 核心实践: SLI / SLO / SLA 指标体系","lab":false,"y":"SLI (服务质量指标)：如 P99 延迟 < 50ms。\nSLO (服务质量目标)：如 99.9% 概率满足 SLI。\nSLA (服务级别协议)：违约赔偿合同。","dg":{"k":"stack","n":[{"t":"SLI 实际测量值 <= SLO …"}]},"c":"histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))","o":"0.042 (42ms < 50ms SLO)","j":["量化网络与系统的稳定性指标"],"u":["SRE 架构演进与稳定性保障"],"w":["不要把 100% 可用性设为 SLO，这极具破坏性且昂贵"],"v":"查看 Grafana SLO 仪表盘","l":["定义网络延迟 SLI","在 Prometheus 编写 SLO 报警规则"]},{"id":"Z2_2","t":"Z2.2. SRE 核心实践: Error Budget 错误预算","lab":false,"y":"错误预算 = 100% - SLO。例如 99.9% SLO 意味着每月只有 43 分钟可用预算。预算耗尽则冻结变更。","dg":{"k":"multi","rows":[{"n":[{"t":"错误预算充足"},{"t":"允许发布新功能"}],"l":[""]},{"n":[{"t":"错误预算消耗殆尽"},{"t":"冻结发布，全员修复稳定性"}],"l":[""]}]},"c":"1 - (sum(rate(http_requests_total{status=~'5..'}[30d])) / sum(rate(http_requests_total[30d])))","o":"Error Budget Remaining: 22%","j":["平衡创新发布速度与系统稳定性的利器"],"u":["研发与运维团队发布冲突仲裁"],"w":["没有惩罚和冻结约束机制的 Error Budget 只是摆设"],"v":"通过监控面板查看剩余 Budget 比例","l":["计算 99.9% SLO 对应的故障时间","设置预算预警钩子自动锁 CI/CD"]},{"id":"LAB4","t":"🎯 阶段四综合实验：云数据中心与可观测性","lab":true,"y":"**实验目标**：完成物理网络到云原生架构的穿透。\n**拓扑**：Spine-Leaf EVPN --- K8s Nodes --- Cilium CNI","dg":{"k":"ha","n":[{"t":"Spine"},{"t":"K8s Nodes Cilium+…"}],"mid":""},"c":"hubble observe --from-pod web --to-pod db","o":"web -> db TCP 80 (latency: 1ms)","j":["Hubble 必须依赖 eBPF 内核底座","VTEP 需要自动发现避免手工配置隧道"],"u":["私有云数据中心建设","容器底层网络排障训练"],"w":["VXLAN 的 UDP 4789 端口不要被主机防火墙拦截"],"v":"通过 Grafana 看板看到 K8s 内部的服务调用延迟","l":["搭建 Spine-Leaf BGP EVPN","部署 K8s 和 Cilium","开启 Hubble 观测跨节点 Pod 流量"]}]}],"faults":[{"id":"G1","t":"Trunk 接口未放行 VLAN 导致跨楼层不通","sym":"同一 VLAN 下，不同楼层的终端无法互通，但同楼层正常。","cause":"汇聚/核心交换机间 Trunk 端口未放行该 VLAN。","c":"[Huawei-GigabitEthernet0/0/24] port trunk allow-pass vlan 100","o":"Port      Link Type    PVID  Trunk VLAN List\nGE0/0/24  trunk        1     1 100","j":["检查是否有 VLAN 被过滤"],"u":["园区网终端跨楼层互通"],"w":["别用 port trunk allow-pass vlan all 带来安全隐患"],"v":"从源端 PC ping 对端网关，观察连通性恢复。","l":["在源端交换机查看 VLAN 成员","在互联 Trunk 口查看允许的 VLAN"],"cat":"二层"},{"id":"G2","t":"MTU 不一致导致 OSPF 卡在 ExStart","sym":"OSPF 邻居状态停滞在 ExStart，无法达到 Full。","cause":"链路两端接口 MTU 不一致，导致 DBD 报文被丢弃。","c":"[Huawei-GigabitEthernet0/0/0] mtu 1500\n[Huawei-GigabitEthernet0/0/0] restart","o":"OSPF Process 1 with Router ID 1.1.1.1\nState: Full","j":["MTU 必须完全一致才能交换 DBD"],"u":["不同厂商设备对接","云网络隧道封装场景"],"w":["有时候隧道封装会隐式改变 MTU，需排查底层"],"v":"display ospf peer 查看状态变为 Full","l":["查看接口 MTU","抓包确认 DBD 报文是否被分片"],"cat":"三层"},{"id":"G3","t":"接入层环路引发 MAC 漂移与风暴","sym":"交换机 CPU 飙升，网络瘫痪，大量 MAC 漂移告警。","cause":"接入层存在物理环路（如私接Hub且未开STP）。","c":"[Huawei] interface GigabitEthernet 0/0/1\n[Huawei-GigabitEthernet0/0/1] shutdown","o":"MAC 5489.. in GE0/1 and GE0/2 flapping","j":["flapping: 在俩口之间反复横跳(环路实锤)"],"u":["大面积断网急救"],"w":["必须先拔线/断口保核心，再去查凶手","shutdown 是急救断口(物理 down 等价拔线,立刻破环)；stp disable 只关 STP 计算不断链路,环路场景反而放大故障"],"v":"看告警不再增量，CPU 利用率下降","l":["查 MAC 地址表是否频繁变化","看 STP 状态"],"cat":"二层"},{"id":"G4","t":"IBGP 邻居传递路由下一跳不可达","sym":"IBGP 学习到路由，但下一跳地址不可达，路由不加表。","cause":"EBGP 邻居传递路由时未修改下一跳，IBGP 邻居无法递归查询。","c":"[Huawei-bgp] peer 10.0.0.2 next-hop-local","o":"*> 192.168.1.0  10.0.0.2   0     100    i","j":["强制把传给 IBGP 的路由下一跳改成自己"],"u":["多出口边缘路由器分发路由给内网核心"],"w":["忘记敲这句是 BGP 新手第一大坑"],"v":"display bgp routing-table 看 *> 标志出现","l":["查看 BGP 路由表关注 NextHop","检查 IGP 路由表"],"cat":"三层"},{"id":"G5","t":"出口 NAT 导致 FTP 被动模式失败","sym":"FTP 能登录，但无法列出目录或上传文件。","cause":"被动模式使用 1024 以上随机端口，NAT 未开启 ALG 探测。","c":"[Huawei] nat alg ftp enable","o":"Info: FTP ALG is enabled.","j":["ALG: 应用层网关，能修改 Payload 里的 IP/端口"],"u":["发布内网老旧服务"],"w":["NAT Server 端口映射不够，必须靠 ALG 动态开洞"],"v":"FTP 客户端正常列出目录","l":["抓包看数据端口是否被转换","开启 ALG 后再测"],"cat":"安全"},{"id":"G6","t":"交换机 CPU 利用率爆高 (ARP攻击)","sym":"CPU 持续高位(>90%)，网络时延增加。","cause":"大量 ARP 扫描/泛洪请求导致 CPU 中断过多。","c":"[Huawei] arp anti-attack rate-limit enable\n[Huawei] arp anti-attack rate-limit 100","o":"ARP rate-limit enabled. Limit 100 pps.","j":["限制 CPU 处理 ARP 的速率"],"u":["网吧/校园网防攻击","中毒主机隔离"],"w":["限速太严会误杀正常新上线的终端"],"v":"display cpu-usage 确认下降，ARP 表稳定","l":["用镜像抓包分析 ARP 流量源","开启限速配置"],"cat":"综合"},{"id":"G7","t":"无线 AP 频繁掉线 (Option43 错误)","sym":"AP 上线后反复掉线，无法稳定工作。","cause":"DHCP Option 43 未下发或配错 AC IP，AP 找不到“组织”。","c":"[Huawei-ip-pool-1] option 43 sub-option 2 ip-address 192.168.10.10","o":"AP ID 1  State: Online","j":["Option 43 专门用于通告 AC 控制器地址"],"u":["大型园区跨网段部署 AP"],"w":["不同厂商的 Option43 HEX 编码可能不同，需查手册"],"v":"display ap all 看 AP 状态变 Online","l":["查看 DHCP 服务器分配状态","测试 AC 的可达性"],"cat":"无线"},{"id":"G8","t":"K8s Pod 跨节点不通 (Calico BGP 断开)","sym":"同集群不同 Node 的 Pod 无法 ping 通。","cause":"Calico 节点间的 BGP 邻居断开（可能是防火墙拦截了 179 端口）。","c":"[root@master ~]# calicoctl node status\n[root@master ~]# calicoctl patch ippool default-ipv4-ippool -p '{\"spec\":{\"ipipMode\":\"Always\"}}'","o":"IPv4 BGP status: Peer 192.168.1.2 down","j":["跨子网强行跑纯 BGP 会失败，需回退到 IPIP 或 VXLAN 隧道（公有云如 AWS/Azure 常不支持 BGP，VXLAN 模式更稳妥）"],"u":["公有云自建 K8s 集群"],"w":["切换 IPIP 模式瞬间会引起网络闪断"],"v":"跨节点 Pod 互 ping 成功","l":["检查 Calico Node 状态","检查 179 端口","切换模式测试"],"cat":"云原生"},{"id":"G9","t":"VRRP 双主脑裂 (抢占延时不当)","sym":"VRRP 两台都是 Master，导致 MAC 表翻摆，网关冲突。","cause":"心跳链路故障，或主设备刚重启完接口一 UP 就立刻抢占，而底层路由还没收敛。","c":"[Huawei-Vlanif10] vrrp vrid 1 preempt-mode timer delay 30","o":"VRID 1  State: Backup","j":["delay 30: 等 30 秒网络彻底稳了再抢回老大"],"u":["核心双机热备架构调优"],"w":["永远不要用 0 秒(立即抢占)"],"v":"display vrrp 显示只有一台 Master","l":["检查心跳口状态","调整抢占延时验证主备关系"],"cat":"二层"},{"id":"G10","t":"防火墙策略误阻断业务 (Zone 划错)","sym":"写了放行策略，但流量依然被阻断。","cause":"流量出入的物理接口，没有正确划入策略指定的 Trust/Untrust 区域。","c":"[Huawei] firewall zone trust\n[Huawei-zone-trust] add interface GigabitEthernet0/0/1","o":"Interface GE0/0/1 added to zone trust.","j":["接口默认不在任何区域，必须手工划入"],"u":["防火墙开局初装","新增出口链路"],"w":["查策略前先查 display zone"],"v":"流量通过，display security-policy 命中计数增加","l":["查看接口所属 Zone","检查策略源/目的区域"],"cat":"安全"},{"id":"G11","t":"OSPF 路由不优选 (Bandwidth 偏差)","sym":"10G 核心链路闲置，OSPF 偏偏选了 1G 的备用链路。","cause":"OSPF Cost 靠接口参考带宽计算，由于参考带宽默认是 100M，导致 1G 和 10G 算出来 Cost 都是 1，无法区分。","c":"[Huawei-ospf-1] bandwidth-reference 100000","o":"Reference bandwidth changed to 100000 Mbits","j":["全局调高参考带宽基准，让高带宽链路 Cost 变小"],"u":["骨干网链路扩容后调优"],"w":["全网 OSPF 设备的参考带宽必须改成一样，否则环路"],"v":"display ospf routing 查看选路变化","l":["查看接口实际带宽","修改 reference"],"cat":"三层"},{"id":"G12","t":"端口安全导致合法终端被阻断","sym":"员工换了个扩展坞/USB网卡，突然无法上网，端口 Error-Down。","cause":"Port-Security 限制了最多 1 个 MAC，换网卡后触发违规阻断。","c":"[Huawei-GigabitEthernet0/0/1] undo shutdown\n[Huawei-GigabitEthernet0/0/1] port-security max-mac-num 2","o":"Port Security: Enable  Max MAC: 2","j":["必须手工 undo shutdown 才能救活端口"],"u":["严格的涉密办公区接入管理"],"w":["用 Protect 模式代替 Shutdown 可以避免人工去捞端口"],"v":"终端恢复在线","l":["查看端口安全配置","解禁并放大限制数目"],"cat":"二层"},{"id":"G13","t":"SD-WAN 丢包震荡与 MTU 异常","sym":"隧道间歇丢包，大文件传不过去，小包 ping 则通。","cause":"Underlay 加了 IPSec 等多层头部，导致超大包被丢弃。\nSD-WAN 架构：Edge(CPE 接入) / Controller(集中控制面) / Orchestrator(业务编排)。TCP 优化：FEC(前向纠错，冗余包抗丢包) 与 ACK 压缩(本地代理回 ACK 提速)。","c":"[Huawei-Tunnel0] mtu 1400\n[Huawei-Tunnel0] tcp adjust-mss 1360","o":"Interface Tunnel0 MTU is 1400","j":["tcp adjust-mss 强制告诉对端别发超过 1360 字节的 TCP 包（部分老版本简写为 tcp mss，新版本为 adjust-mss）"],"u":["分支互联","云专线对接"],"w":["只改 MTU 不改 MSS，TCP 照样会卡死"],"v":"ping -f -l 1300 验证不分片通过","l":["测试 Path MTU","调整 MTU 和 MSS"],"cat":"overlay"},{"id":"G14","t":"K8s NetworkPolicy 阻断跨 NS 通信","sym":"Frontend(NS-A) 连不上 Backend(NS-B)。","cause":"NetworkPolicy 默认只匹配同 namespace，漏写了 namespaceSelector。","c":"ingress:\n- from:\n  - namespaceSelector:\n      matchLabels: { ns: ns-a }","o":"Policy updated, traffic allowed.","j":["必须显式放行指定 namespace 的流量"],"u":["多租户 K8s 零信任微隔离"],"w":["Flannel CNI 原生不支持 NetworkPolicy，写了也没用"],"v":"跨 NS 通信恢复","l":["kubectl get networkpolicy -A","修改 yaml 并 apply"],"cat":"云原生"},{"id":"G15","t":"Wi-Fi 6 漫游粘滞 (死抱远端AP)","sym":"人走到会议室了，手机还连着工位的 AP，信号一格卡顿。","cause":"终端不主动切，AC 也没有开启强制剔除（智能漫游阈值太低）。","c":"[Huawei-wlan-rrm-default] smart-roam enable\n[Huawei-wlan-rrm-default] smart-roam roam-threshold snr 20","o":"Smart-roam enabled, SNR threshold 20dB","j":["低于 20dB 信号，AC 强行把终端踢掉逼它重连近的 AP"],"u":["密集办公区无线网调优"],"w":["踢得太频繁会导致语音通话断续，阈值要慢慢调"],"v":"拿着手机走动，查 display station roaming","l":["检查 AP 漫游配置","开启智能漫游与 802.11k/v"],"cat":"无线"},{"id":"G16","t":"VXLAN 隧道震荡与 Underlay 抖动","sym":"Overlay VM 疯狂断网，VXLAN 隧道频繁 UP/DOWN。","cause":"底层物理网的 OSPF 路由在抖，导致 VTEP 的源 Loopback 忽隐忽现。","c":"[Huawei] ospf 1\n[Huawei-ospf-1] bfd all-interfaces enable","o":"BFD session created, OSPF stable.","j":["必须先稳住底盘 (Underlay)，再去查上层 (Overlay)"],"u":["云数据中心大规模虚拟化网络"],"w":["查故障永远遵循自下而上：先看物理口，再看 OSPF，最后看 BGP EVPN"],"v":"display vxlan tunnel 状态稳定","l":["检查 Underlay IGP 邻居","排查物理链路抖动"],"cat":"三层"},{"id":"G17","t":"防火墙策略永远不命中 (被遮蔽)","sym":"写了针对特定 IP 的阻断，但这台机子还是能上网。","cause":"前面有一条 Rule 是 `permit any`，直接放行了，轮不到这条细粒度规则。","c":"[Huawei-security-policy] rule move 20 before 10","o":"Rule 20 is moved before rule 10.","j":["防火墙匹配是自上而下，命中即刻停止！"],"u":["防火墙策略长期堆积后的重构"],"w":["定期清理没人用的历史策略（僵尸规则）"],"v":"目标策略命中计数开始增加","l":["display security-policy rule all","检查重叠与包含关系"],"cat":"安全"},{"id":"G18","t":"BGP 路由震荡 (Route Flapping) 与 Dampening","sym":"BGP 路由反复 UP/DOWN，导致全网 CPU 升高与路由收敛震荡。","cause":"不稳定物理链路引发 BGP 频繁 Withdrawal，触发 Dampening 惩罚机制。","c":"[Huawei-bgp] dampening 15 750 2000 10000","o":"BGP route dampening enabled. Route suppressed.","j":["对频繁抖动的路由强制惩罚抑制"],"u":["运营商与企业多出口 BGP 防震荡"],"w":["抑制惩罚时间过长可能导致链路恢复后业务仍不可达"],"v":"display bgp routing-table dampened","l":["排查抖动物理接口","配置 BGP dampening 阀值"],"cat":"三层"},{"id":"G19","t":"ECMP 哈希不均导致单物理链路拥塞","sym":"多条等价链路中，某一根网线流量爆满(100%)，其余网线闲置。","cause":"ECMP 默认哈希因子(如仅源IP)导致集中大流量(Elephant Flow)命中同条链路。","c":"[Huawei] ip load-balance hash-mode src-dst-ip src-dst-port","o":"Load balance hash mode set to L4 5-tuple.","j":["改为基于五元组做 Hash 拆分大流量"],"u":["数据中心 Spine-Leaf 高并发转发"],"w":["逐包(Per-Packet)哈希会导致报文乱序，必须使用逐流(Per-Flow)"],"v":"display interface brief 观察各成员口流量均分","l":["查看各接口 Outbound 速率","修改 Hash 算法为 5-tuple"],"cat":"三层"},{"id":"G20","t":"K8s Service 会话亲和性配置错误","sym":"客户端请求访问 K8s Web 服务时，登录状态不断丢失、反复重新登录。","cause":"Service 轮询分发到不同 Pod，未开启 ClientIP 会话亲和性 (SessionAffinity)。","c":"spec:\n  sessionAffinity: ClientIP\n  sessionAffinityConfig:\n    clientIP:\n      timeoutSeconds: 10800","o":"sessionAffinity set to ClientIP (10800s)","j":["让同一客户端 IP 在 3 小时内固定访问同一 Pod"],"u":["有状态 Web 应用微服务暴露"],"w":["SNAT 网关访问会导致所有外部流量命中同一个后端 Pod"],"v":"使用 curl 连续请求观察回应的 Pod IP 保持一致","l":["编辑 Service YAML 增加 sessionAffinity","kubectl apply -f svc.yaml"],"cat":"云原生"},{"id":"G21","t":"Cilium 策略误伤导致 DNS 解析超时","sym":"应用 Pod 提示 `Could not resolve host`，内部通信全部断开。","cause":"CiliumNetworkPolicy 开启了严格白名单，但漏写了对 kube-dns (53端口) 的放行规则。","c":"egress:\n- toEndpoints:\n  - matchLabels:\n      k8s-app: kube-dns\n  toPorts:\n  - ports:\n    - port: '53'\n      protocol: UDP","o":"Policy updated. DNS egress allowed.","j":["零信任策略下必须显式放行 53 端口 UDP 流量"],"u":["Cilium CNI 零信任微隔离部署"],"w":["不要忽略 UDP 53 端口，否则整个 Pod 变‘瞎子’"],"v":"kubectl exec -it pod -- nslookup kubernetes.default","l":["hubble observe 过滤 DROP 流量","补充 DNS 放行规则"],"cat":"云原生"},{"id":"G22","t":"SRv6 隧道头端封装源地址缺失","sym":"SRv6 Policy 无法建立，报文无法完成 End.X/End.DT4 动作。","cause":"头端设备没有配置 `encapsulation source-address`，导致外层 IPv6 头无合法源地址。","c":"[Huawei-segment-routing-ipv6] encapsulation source-address 2001:db8:1::1","o":"SRv6 Encapsulation Source-Address: 2001:db8:1::1","j":["必须指定源 IPv6 用于封装外层 IPv6 报头","参考标准：RFC 8986 (SRv6 Network Programming)"],"u":["5G 承载网 SRv6 Policy 部署"],"w":["源 IPv6 必须在 Underlay 中全局可达"],"v":"display segment-routing ipv6 te-policy 状态变 UP","l":["查看 SRv6 全局配置","补全 encap 源地址"],"cat":"三层"},{"id":"G23","t":"eBPF 程序加载失败 (BTF 版本不匹配)","sym":"Cilium 或 Hubble 启动失败，报 `failed to load bpf program: vmlinux BTF mismatch`。","cause":"Linux 内核版本太低，或者缺少内核 BTF (BPF Type Format) 类型信息。","c":"[root@node ~]# uname -r\n[root@node ~]# ls /sys/kernel/btf/vmlinux","o":"/sys/kernel/btf/vmlinux","j":["eBPF CO-RE (一次编译随处运行) 强依赖 BTF 支撑"],"u":["云原生 eBPF 内核网络演进"],"w":["内核版本低于 5.4 需手动编译 BTF 或升级内核"],"v":"重新启动 cilium-agent 无 error 告警","l":["检查 /sys/kernel/btf/vmlinux","升级 Linux 内核至 5.15 LTS"],"cat":"云原生"},{"id":"G24","t":"Prometheus SNMP Exporter 采集超时","sym":"Grafana 看板大面积断层(No Data)，监控指标中断。","cause":"交换机 OID 树太庞大，SNMP Exporter 默认 5s 超时，网络设备 CPU 被拉满。","c":"scrape_configs:\n  - job_name: 'snmp'\n    scrape_timeout: 15s\n    scrape_interval: 30s","o":"Prometheus config reloaded. Timeout 15s applied.","j":["调大超时时间并降低采集频率"],"u":["大型网络设备监控排障"],"w":["不要盲目调高频率(如1秒1次)，会拖垮交换机 CPU"],"v":"Prometheus Targets 页面变 UP","l":["修改 prometheus.yml 中的 scrape_timeout","热加载配置"],"cat":"云原生"},{"id":"G25","t":"混沌实验后未恢复导致的残余丢包","sym":"演进结束后很久，某台 Node 上的 Pod 丢包率依然高达 20%。","cause":"Chaos Mesh 异常退出或取消实验时，网络 tc/netem 规则在 Linux 接口残留。","c":"[root@node ~]# tc qdisc show dev eth0\n[root@node ~]# tc qdisc del dev eth0 root","o":"qdisc netem 10: root refcnt 2 limit 1000 loss 20%","j":["手动清理 Linux 协议栈残留的 netem 规则"],"u":["混沌工程演练后应急止血"],"w":["清理 tc 规则前确认没有其他合法流量控制在用"],"v":"tc qdisc show 确认 netem 规则已清空","l":["登录问题 Node 节点","执行 tc qdisc del 彻底清理"],"cat":"云原生"}],"interview":[{"id":"IVQ1","t":"大专/非科班出身优势？","point":"抗压能力、跨界学习力、逻辑思维。","star":"不要纠结学历劣势，重点讲“我是怎么快速补齐短板的”。","answer":"非科班不等于能力不足。我的优势在于跨领域视角和更强的学习驱动力。比如我原来做开发，转网工后能更快理解自动化脚本和 API 交互，Python 写得比一些老网工还溜。而且我动手能力很强，Lab 里踩过的坑都是真金白银的经验。","fb":"面试官反馈：态度诚恳，具备程序员思维，是个可塑之才。","j":["强调自驱力","结合自动化脚本展示优势"],"u":["破冰提问","压力测试"],"w":["切忌自卑","切忌长篇大论偏离技术"],"cat":"HR软技能"},{"id":"IVQ2","t":"K8s Pod 跨节点无法通信？","point":"云原生网络底座排障逻辑，是否懂 CNI。","star":"","answer":"我会分三步走：首先确认 CNI 状态，在 Node 上 kubectl get pods 看 Pod 是否正常；然后 calicoctl node status 检查 BGP 邻居。如果 BGP 断开，就去排查 Underlay 物理网。如果网络通但拒绝访问，我会查 NetworkPolicy 规则。","fb":"逻辑清晰，不盲目重启组件。","j":["体现分层分段思路"],"u":["容器网络排障必问题"],"w":["不要只说查日志，要说查哪个日志"],"cat":"云原生"},{"id":"IVQ3","t":"你的最大缺点是什么？","point":"自我认知，以及解决自身问题的方法。","star":"","answer":"我有时候太追求完美，做一个方案喜欢反复推敲导致效率不够高。但现在我会给自己设时间盒，先快速出原型再迭代。遇到难题先给 80% 靠谱的方案，而不是等 100% 才动手。","fb":"巧妙将缺点转化为追求质量，并给出了实操解法。","j":["真实且有改进动作"],"u":["HR面","性格测试"],"w":["别说‘我太拼命工作’这种虚假的缺点"],"cat":"HR软技能"},{"id":"IVQ4","t":"OSPF 和 BGP 区别及场景？","point":"对动态路由协议核心机制的理解。","star":"","answer":"OSPF 是内部网关协议，算链路状态，收敛极快，适合园区内部。BGP 是外部网关协议，算路径矢量，靠几十种属性灵活选路，扛得住百万级路由，所以互联网骨干和跨数据中心都用 BGP。","fb":"一句话切中要害：OSPF 算路，BGP 选路。","j":["强调‘属性控制’是 BGP 的灵魂"],"u":["高级网工必问"],"w":["别背书式地背各种 LSA"],"cat":"数通架构"},{"id":"IVQ5","t":"客户反映网络卡怎么排查？","point":"处理模糊故障的体系化思维。","star":"","answer":"先要定界：是有线卡还是无线卡？所有网站卡还是个别卡？然后 1. Ping 网关看内网；2. Ping 8.8.8.8 看外网丢包；3. 用 MTR 看哪一跳卡住了；4. 查核心设备 CPU 和流量监控；5. 看是不是被 QoS 限速了。","fb":"有章法，懂定界。","j":["定界是排障第一步"],"u":["桌面运维/Helpdesk 进阶题"],"w":["一上来就抓包是大忌，太重了"],"cat":"排障思路"},{"id":"IVQ6","t":"印象最深的故障经历 (STAR)？","point":"真实项目经验，解决复杂问题的能力。","star":"","answer":"S(情境): 核心交换机 Trunk 震荡导致全公司断网。T(任务): 紧急止血并抓根因。A(行动): 我先 shutdown 问题链路恢复冗余路径，查日志发现光功率衰减导致 STP 疯狂重算，替换光模块。R(结果): 10分钟恢复，我还补充了光功率监控脚本。","fb":"有止血、有根因、有复盘预防。","j":["强调止血第一"],"u":["综合能力考核"],"w":["避免编造自己无法自圆其说的神级故障"],"cat":"排障思路"},{"id":"IVQ7","t":"怎么看待网络自动化 (Python)？","point":"是否有 NetDevOps 意识。","star":"","answer":"纯手工敲 CLI 已经跟不上云时代了。我常用 Python + Netmiko 批量下发 VLAN，或者用 Ansible 巡检配置合规性。这不仅是提效，更是通过代码把网络基线固定下来，避免人为低级失误。","fb":"展示了进阶思维。","j":["提效与防错并重"],"u":["加分项考核"],"w":["自动化不是万能的，底层原理仍是核心"],"cat":"自动化"},{"id":"IVQ8","t":"未来三年职业规划？","point":"稳定性与上进心。","star":"","answer":"第一年吃透现网架构并推进 Ansible 自动化；第二年深入云原生网络如 Cilium 和 SRv6；第三年希望能主导设计高可用架构，带团队解决复杂问题。往 NetDevOps 和 SRE 方向走。","fb":"踏实且目标明确。","j":["分阶段，有递进"],"u":["团队契合度评估"],"w":["切忌假大空"],"cat":"HR软技能"},{"id":"IVQ9","t":"与同事有技术分歧怎么处理？","point":"团队协作与沟通能力。","star":"","answer":"先对事不对人，把各自观点摆出来用数据说话——比如用抓包或测试对比。如果还争不下，提议搭个小范围 PoC (概念验证) 测试跑一下，让结果说话。实在不行交由主管仲裁，目标是解决问题。","fb":"成熟的职场沟通方式。","j":["数据导向，PoC验证"],"u":["情商与协作面"],"w":["别说‘谁对听谁的’这种废话"],"cat":"HR软技能"},{"id":"IVQ10","t":"期望薪资是多少？为什么？","point":"自我估值与底气。","star":"","answer":"期望 25K 左右。因为我能独立负责核心网演进、主导自动化项目、并且懂 K8s 网络，市面上兼具数通和云原生能力的人正是这个价位。当然我也看重平台的技术氛围。","fb":"有理有据，不卑不亢。","j":["锚定自己的核心价值"],"u":["HR / 终面"],"w":["不要畏缩，也不要漫天要价"],"cat":"HR软技能"},{"id":"IVQ11","t":"GitOps 在网工领域怎么落地？","point":"对前沿运维理念的实践认知。","star":"","answer":"把设备配置(如 ACL, VLAN) 用 YAML 写进 Git 仓库。走 PR 审核，CI 用 Ansible --check 做 Dry-run 预检；合并后 CD 流水线自动推送至设备。一切变更皆可追溯、可回滚。","fb":"非常标准的 IaC/GitOps 流程。","j":["配置即代码 (IaC)"],"u":["大厂 / DevOps 岗"],"w":["别和软件代码的 CI/CD 完全混为一谈"],"cat":"自动化"},{"id":"IVQ12","t":"可观测性与传统 SNMP 监控区别？","point":"运维理念是否升级。","star":"","answer":"传统 SNMP 是‘已知的未知’，设了阈值才知道报警。可观测性是‘未知的未知’，通过采集日志、链路 eBPF 数据，在没设告警的情况下也能主动发现问题（如某个 Pod 延迟突增），方便事后根因下钻。","fb":"降维打击，视角宏大。","j":["传统 SNMP vs 可观测性"],"u":["架构师面"],"w":["不要贬低 SNMP，它们是互补的"],"cat":"自动化"},{"id":"IVQ13","t":"Cilium 为什么能替代 kube-proxy？","point":"对 K8s 底层网络的深度。","star":"","answer":"kube-proxy 依赖 iptables/IPVS，Service 多了遍历链条很长、性能下降。Cilium 直接用 eBPF 在内核态把包重定向，甚至绕过 TCP/IP 协议栈，延迟极低，还能做 L7 过滤。","fb":"精准点出 eBPF 内核态加速的核心。","j":["eBPF vs iptables"],"u":["云原生岗核心题"],"w":[],"cat":"云原生"},{"id":"IVQ14","t":"引入 Service Mesh 网工要注意啥？","point":"跨边界排障能力。","star":"","answer":"关注 Envoy Sidecar 引入的延迟；注意 MTLS 双向认证导致的证书过期中断；另外 Mesh 的 VirtualService 可能会覆盖原有的 Ingress 规则，排障必须会查 Envoy 访问日志。","fb":"有实战经验才说得出这些坑。","j":["Sidecar 开销与路由接管"],"u":["高阶运维题"],"w":[],"cat":"云原生"},{"id":"IVQ15","t":"NetDevOps 现网“静默丢包”怎么破？","point":"自动化落地的安全兜底意识。","star":"","answer":"代码没错不代表环境没错。我会：1. 做金丝雀发布，先下发 10% 设备；2. 部署时配合 Ping/MTR 端到端连通性监控；3. 设置错误率阈值，一旦触发积分自动 Revert 回滚。","fb":"极其稳健的生产环境操作风格。","j":["灰度发布与监控断言"],"u":["自动化终极拷问"],"w":["绝对不能迷信代码，现网永远有意外"],"cat":"自动化"},{"id":"IVQ16","t":"构建 GitOps 自动化交付闭环","point":"端到端 NetDevOps 架构落地能力。","star":"","answer":"使用 NetBox 作真理源，代码库存 Jinja2 模板。PR 触发 GitHub Actions/GitLab CI，拉取 Batfish 离线校验断言通断；合并后通过 Nornir 并发推送现网，配合 Prometheus 监控灰度，异常即触发 Git Revert 自动回滚。","fb":"极其完整的工程落地实践逻辑。","j":["Single Source of Truth","Batfish 离线验证"],"u":["NetDevOps 架构师"],"w":["切忌把配置密码明文硬编码在 Git 仓库中"],"cat":"自动化"},{"id":"IVQ17","t":"可观测性三支柱在网络排障中联动？","point":"故障定位的效率与方法论。","star":"","answer":"Metrics 负责‘告警’（如 Prometheus 监控到网关 P99 延迟突增）；通过 TraceID 定位到特定的微服务调用 Span；最后提取该的时间戳检索日志 (Loki/ELK)，直接抓出具体的底层 Socket 超时报错。","fb":"逻辑严密，融会贯通。","j":["告警(Metrics)->定位(Traces)->根因(Logs)"],"u":["云原生网络/SRE 岗"],"w":[],"cat":"云原生"},{"id":"IVQ18","t":"eBPF 原理及其相比 iptables 的优势？","point":"对 Linux 内核级包处理的认知。","star":"","answer":"eBPF 允许在内核安全运行沙箱程序。iptables 是顺序遍历链表，规则一多延迟随规则数线性增加（O(n)），性能显著下降；而 eBPF 直接在网卡驱动 (XDP) 或 TC 层用 Map 查表重定向，时间复杂度 O(1)，性能提升数量级。","fb":"准确点出 O(1) 查表与内核沙箱的本质。","j":["O(1) 复杂度","XDP 网卡驱动层丢包"],"u":["高阶 CNI / 云网络岗"],"w":[],"cat":"HR软技能"},{"id":"IVQ19","t":"Sidecar 模式 vs Ambient Mesh (无Sidecar)？","point":"Service Mesh 最新演进方向。","star":"","answer":"Sidecar 模式需要在每个 Pod 注入 Envoy 容器，内存开销大、延迟增加明显；Ambient Mesh (如 Istio Ambient) 将 L4 代理下沉到节点级 ztunnel (用 eBPF 加速)，L7 集中在 zproxy，架构更轻、损耗更低。","fb":"了解最前沿 Mesh 架构架构演进。","j":["ztunnel 节点级代理","资源开销对比"],"u":["微服务网格专家"],"w":[],"cat":"云原生"},{"id":"IVQ20","t":"如何用 Error Budget 约束网络变更？","point":"SRE 稳定性治理理念。","star":"","answer":"若 SLO 为 99.9%，每月允许故障预算为 43 分钟。若本月网络震荡已消耗 30 分钟，预算充足，正常允许研发和网工发布变更；一旦预算耗尽，CI/CD 自动锁定，全员禁止变更，强制去修稳定性漏洞。","fb":"懂机制，懂治理。","j":["错误预算与发布锁定联动"],"u":["SRE 负责人 / 运维主管"],"w":[],"cat":"云原生"},{"id":"IVQ21","t":"什么是“静默丢包”？如何诊断？","point":"复杂隐蔽故障的定位排查。","star":"","answer":"静默丢包指设备没报 Down，但报文在芯片队列或 Linux 内核被悄悄 drop。我会：1. 查硬件 ASIC 丢包计数 (`display qos queue-drop`)；2. 在 Linux 节点用 eBPF pwru (`packet-where-are-you`) 追查内核丢包函数。","fb":"展现了利用 eBPF 深入内核底层的能力。","j":["pwru 追查内核丢包","ASIC Drop 计数"],"u":["数据中心高级网工"],"w":[],"cat":"排障思路"},{"id":"IVQ22","t":"对 SRv6 核心设计理念的理解？","point":"下一代 IPv6 骨干网协议栈理解。","star":"","answer":"SRv6 将‘网络即服务’直接编码到 128 位 IPv6 地址中。把 Segment 塞进 IPv6 SRH 扩展头，利用现有的纯 IPv6 Underlay 转发，完全摒弃了复杂的大套协议 (如 RSVP-TE、LDP)，天生支持应用级编程与切片。","fb":"言简意赅，抓住 SRv6 灵魂。","j":["IPv6 地址即指令","简化协议栈"],"u":["运营商 / 骨干网网工"],"w":[],"cat":"数通架构"},{"id":"IVQ23","t":"生产环境开展混沌工程的红线？","point":"生产环境高可用风险把控。","star":"","answer":"三条红线：1. 严禁未经演练直接在生产开启；2. 必须具备自动化爆炸半径控制与熔断线 (如错误率>5% 瞬间终止实验)；3. 演练必须伴随完整的可观测性看板，确保随时能一键完全清理残留 tc 规则。","fb":"极其稳健的生产敬畏之心。","j":["爆炸半径控制","自动熔断与恢复机制"],"u":["混沌工程 / 架构师"],"w":[],"cat":"数通架构"},{"id":"IVQ24","t":"BGP EVPN 控制面 Type-2/3/5 路由区别？","point":"VXLAN 叠加网控制面深度。","star":"","answer":"Type-2 是 MAC/IP 路由，用于分发主机 MAC 地址与 ARP 抑制；Type-3 是 inclusive 组播路由，用于自动发现 VTEP 并建立 BUM 泛洪隧道；Type-5 是 IP 前缀路由，用于跨 overlay 的三层子网路由互通。","fb":"熟练掌握 BGP EVPN 核心逻辑。","j":["Type-2 MAC/IP","Type-3 BUM隧道","Type-5 IP前缀"],"u":["SDN / 数据中心专家"],"w":[],"cat":"数通架构"},{"id":"IVQ25","t":"如何设计 99.999% 可用性跨数据中心网络？","point":"顶级高可用架构设计能力。","star":"","answer":"多维度消除单点：1. 物理层双路双缆独立管道；2. 架构层 Spine-Leaf 无阻塞 CLOS + ECMP 多路径；3. 边缘层 BFD 毫秒联动 BGP 快速收敛；4. 控制面部署异地多活 NCE 集群；5. 自动化变更引入 GitOps+Batfish 预检。","fb":"具备系统级架构师视野。","j":["多维消除单点","BFD 毫秒收敛","GitOps 预检"],"u":["首席网络架构师"],"w":[],"cat":"数通架构"},{"id":"IVQ26","t":"Cilium 如何用 eBPF 实现免 NAT 重定向？","point":"内核级网络优化原理。","star":"","answer":"传统 kube-proxy 依赖 IPVS/iptables 在 DNAT 和 SNAT 来回折腾，浪费 CPU。Cilium 在 cgroup sock_ops 挂载 eBPF 程序，检测到同节点 Pod 通信时，直接把 Socket 的 TX Queue 映射到 RX Queue，绕过整个 TCP/IP 协议栈！","fb":"讲清了 SockOps 重定向的底层原理。","j":["SockOps 映射","绕过 TCP/IP 协议栈"],"u":["云原生网络专家"],"w":[],"cat":"云原生"},{"id":"IVQ27","t":"什么是配置漂移？如何治理？","point":"网络合规与基线治理。","star":"","answer":"配置漂移指设备现网配置与 Git 仓库基线不一致。治理策略：1. 权限收回，关闭个人 SSH 写入权限，只留 Ansible 账号；2. 部署 Nornir 每日定时抓取 current-config 与 Git 比对生成 Diff 报告；3. 发现漂移强制触发自动化覆盖恢复。","fb":"闭环管理，落地性强。","j":["每日自动化 Diff","权限收紧与基线覆盖"],"u":["NetDevOps 运维经理"],"w":[],"cat":"自动化"},{"id":"IVQ28","t":"DNS 延迟突增对微服务的放大效应？","point":"微服务架构下的网络连锁反应。","star":"","answer":"微服务调用链很长，如果一个请求触发 10 次跨服务调用，每次 CoreDNS 解析增加 10ms，总延迟就增加 100ms。更惨的是如果超时触发重试，并发流量会瞬间冲垮 CoreDNS，引发雪崩。解法是 Pod 开启 NodeLocal DNSCache 节点级缓存。","fb":"有深度的微服务架构视角。","j":["调用链延迟叠加","NodeLocal DNSCache"],"u":["SRE 架构师"],"w":[],"cat":"云原生"},{"id":"IVQ29","t":"异构网络环境(华为/Cisco/Linux)统一监控？","point":"混合云/万国牌机房运维监控落地。","star":"","answer":"采用 Prometheus + SNMP Exporter 架构。利用 YAML 针对各厂商 OID 树做标准化映射，把华为 display 和 Cisco show 的差异抽象为统一的 `network_interface_throughput_bytes` 格式时序指标，在 Grafana 统一看板呈现。","fb":"抽象能力极强。","j":["SNMP Exporter 抽象 OID","Prometheus 标准指标"],"u":["高级监控运维岗"],"w":[],"cat":"自动化"},{"id":"IVQ30","t":"如何主持一次重大生产事故复盘？","point":"领导力、复盘文化与责任担当。","star":"","answer":"原则是‘对事不对人’。复盘四步走：1. 还原时间线 (5W1H 精确到秒)；2. 根因分析 (用 5-Whys 法推导，比如为什么没发现光功率衰减？)；3. 评估止血效率；4. 制定改进 To-Do 责任到人 (如增加光功率告警脚本，一周内上线)。","fb":"非常专业的复盘管理流程。","j":["5-Whys 根因分析","改进 To-Do 责任落人"],"u":["运维总监 / 团队 Leader"],"w":[],"cat":"HR软技能"}],"dict":{"cols":[{"k":"hw","n":"华为 / H3C"},{"k":"cs","n":"Cisco"},{"k":"zte","n":"中兴"},{"k":"lx","n":"Linux / 云原生"}],"rows":[{"i":1,"fn":"查看版本","hw":"display version","cs":"show version","zte":"show version","lx":"uname -a","cat":"运维"},{"i":2,"fn":"运行配置","hw":"display cur","cs":"show run","zte":"show run","lx":"cat /etc/network/interfaces","cat":"运维"},{"i":3,"fn":"保存配置","hw":"save","cs":"write memory","zte":"save config","lx":"netplan apply","cat":"无线"},{"i":4,"fn":"日志缓存","hw":"display logbuffer","cs":"show logging","zte":"show log","lx":"journalctl -xe","cat":"运维"},{"i":5,"fn":"NTP 同步","hw":"ntp-service enable","cs":"ntp server","zte":"ntp server","lx":"timedatectl set-ntp true","cat":"运维"},{"i":6,"fn":"接口状态","hw":"dis ip int br","cs":"show ip int br","zte":"show interface br","lx":"ip -br link show","cat":"通用"},{"i":7,"fn":"配置 IP","hw":"ip address x.x.x.x m","cs":"ip address x.x.x.x m","zte":"ip address x.x.x.x m","lx":"ip addr add x.x.x.x/m dev eth0","cat":"运维"},{"i":8,"fn":"流量统计","hw":"display interface","cs":"show interfaces","zte":"show interface","lx":"ifconfig -a","cat":"运维"},{"i":9,"fn":"速率双工","hw":"speed 1000 / duplex full","cs":"speed 1000 /
