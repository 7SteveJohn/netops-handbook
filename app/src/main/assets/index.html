否则环路"],"v":"display ospf routing 查看选路变化","l":["查看接口实际带宽","修改 reference"],"cat":"三层"},{"id":"G12","t":"端口安全导致合法终端被阻断","sym":"员工换了个扩展坞/USB网卡，突然无法上网，端口 Error-Down。","cause":"Port-Security 限制了最多 1 个 MAC，换网卡后触发违规阻断。","c":"[Huawei-GigabitEthernet0/0/1] undo shutdown\n[Huawei-GigabitEthernet0/0/1] port-security max-mac-num 2","o":"Port Security: Enable  Max MAC: 2","j":["必须手工 undo shutdown 才能救活端口"],"u":["严格的涉密办公区接入管理"],"w":["用 Protect 模式代替 Shutdown 可以避免人工去捞端口"],"v":"终端恢复在线","l":["查看端口安全配置","解禁并放大限制数目"],"cat":"二层"},{"id":"G13","t":"SD-WAN 丢包震荡与 MTU 异常","sym":"隧道间歇丢包，大文件传不过去，小包 ping 则通。","cause":"Underlay 加了 IPSec 等多层头部，导致超大包被丢弃。\nSD-WAN 架构：Edge(CPE 接入) / Controller(集中控制面) / Orchestrator(业务编排)。TCP 优化：FEC(前向纠错，冗余包抗丢包) 与 ACK 压缩(本地代理回 ACK 提速)。","c":"[Huawei-Tunnel0] mtu 1400\n[Huawei-Tunnel0] tcp adjust-mss 1360","o":"Interface Tunnel0 MTU is 1400","j":["tcp adjust-mss 1360 把 SYN 里的 MSS 上限压到 1360，加 IP 头 20 + TCP 头 20 后整包约 1400 字节，不超隧道 MTU（命令名存在版本差异，以本机可敲形式为准）"],"u":["分支互联","云专线对接"],"w":["只改 MTU 不改 MSS，TCP 照样会卡死"],"v":"ping -f -l 1300 验证不分片通过","l":["测试 Path MTU","调整 MTU 和 MSS"],"cat":"overlay"},{"id":"G14","t":"K8s NetworkPolicy 阻断跨 NS 通信","sym":"Frontend(NS-A) 连不上 Backend(NS-B)。","cause":"NetworkPolicy 默认只匹配同 namespace，漏写了 namespaceSelector。","c":"ingress:\n- from:\n  - namespaceSelector:\n      matchLabels: { ns: ns-a }","o":"Policy updated, traffic allowed.","j":["必须显式放行指定 namespace 的流量"],"u":["多租户 K8s 零信任微隔离"],"w":["Flannel CNI 原生不支持 NetworkPolicy，写了也没用"],"v":"跨 NS 通信恢复","l":["kubectl get networkpolicy -A","修改 yaml 并 apply"],"cat":"云原生"},{"id":"G15","t":"Wi-Fi 6 漫游粘滞 (死抱远端AP)","sym":"人走到会议室了，手机还连着工位的 AP，信号一格卡顿。","cause":"终端不主动切，AC 也没有开启强制剔除（智能漫游阈值太低）。","c":"[Huawei-wlan-rrm-default] smart-roam enable\n[Huawei-wlan-rrm-default] smart-roam roam-threshold snr 20","o":"Smart-roam enabled, SNR threshold 20dB","j":["低于 20dB 信号，AC 强行把终端踢掉逼它重连近的 AP"],"u":["密集办公区无线网调优"],"w":["踢得太频繁会导致语音通话断续，阈值要慢慢调"],"v":"拿着手机走动，查 display station roaming","l":["检查 AP 漫游配置","开启智能漫游与 802.11k/v"],"cat":"无线"},{"id":"G16","t":"VXLAN 隧道震荡与 Underlay 抖动","sym":"Overlay VM 疯狂断网，VXLAN 隧道频繁 UP/DOWN。","cause":"底层物理网的 OSPF 路由在抖，导致 VTEP 的源 Loopback 忽隐忽现。","c":"[Huawei] ospf 1\n[Huawei-ospf-1] bfd all-interfaces enable","o":"BFD session created, OSPF stable.","j":["必须先稳住底盘 (Underlay)，再去查上层 (Overlay)"],"u":["云数据中心大规模虚拟化网络"],"w":["查故障永远遵循自下而上：先看物理口，再看 OSPF，最后看 BGP EVPN"],"v":"display vxlan tunnel 状态稳定","l":["检查 Underlay IGP 邻居","排查物理链路抖动"],"cat":"三层"},{"id":"G17","t":"防火墙策略永远不命中 (被遮蔽)","sym":"写了针对特定 IP 的阻断，但这台机子还是能上网。","cause":"前面有一条 Rule 是 `permit any`，直接放行了，轮不到这条细粒度规则。","c":"[Huawei-security-policy] rule move 20 before 10","o":"Rule 20 is moved before rule 10.","j":["防火墙匹配是自上而下，命中即刻停止！"],"u":["防火墙策略长期堆积后的重构"],"w":["定期清理没人用的历史策略（僵尸规则）"],"v":"目标策略命中计数开始增加","l":["display security-policy rule all","检查重叠与包含关系"],"cat":"安全"},{"id":"G18","t":"BGP 路由震荡 (Route Flapping) 与 Dampening","sym":"BGP 路由反复 UP/DOWN，导致全网 CPU 升高与路由收敛震荡。","cause":"不稳定物理链路引发 BGP 频繁 Withdrawal，触发 Dampening 惩罚机制。","c":"[Huawei-bgp] dampening 15 750 2000 10000","o":"BGP route dampening enabled. Route suppressed.","j":["对频繁抖动的路由强制惩罚抑制"],"u":["运营商与企业多出口 BGP 防震荡"],"w":["抑制惩罚时间过长可能导致链路恢复后业务仍不可达"],"v":"display bgp routing-table dampened","l":["排查抖动物理接口","配置 BGP dampening 阀值"],"cat":"三层"},{"id":"G19","t":"ECMP 哈希不均导致单物理链路拥塞","sym":"多条等价链路中，某一根网线流量爆满(100%)，其余网线闲置。","cause":"ECMP 默认哈希因子(如仅源IP)导致集中大流量(Elephant Flow)命中同条链路。","c":"[Huawei] ip load-balance hash-mode src-dst-ip src-dst-port","o":"Load balance hash mode set to L4 5-tuple.","j":["改为基于五元组做 Hash 拆分大流量"],"u":["数据中心 Spine-Leaf 高并发转发"],"w":["逐包(Per-Packet)哈希会导致报文乱序，必须使用逐流(Per-Flow)"],"v":"display interface brief 观察各成员口流量均分","l":["查看各接口 Outbound 速率","修改 Hash 算法为 5-tuple"],"cat":"三层"},{"id":"G20","t":"K8s Service 会话亲和性配置错误","sym":"客户端请求访问 K8s Web 服务时，登录状态不断丢失、反复重新登录。","cause":"Service 轮询分发到不同 Pod，未开启 ClientIP 会话亲和性 (SessionAffinity)。","c":"spec:\n  sessionAffinity: ClientIP\n  sessionAffinityConfig:\n    clientIP:\n      timeoutSeconds: 10800","o":"sessionAffinity set to ClientIP (10800s)","j":["让同一客户端 IP 在 3 小时内固定访问同一 Pod"],"u":["有状态 Web 应用微服务暴露"],"w":["SNAT 网关访问会导致所有外部流量命中同一个后端 Pod"],"v":"使用 curl 连续请求观察回应的 Pod IP 保持一致","l":["编辑 Service YAML 增加 sessionAffinity","kubectl apply -f svc.yaml"],"cat":"云原生"},{"id":"G21","t":"Cilium 策略误伤导致 DNS 解析超时","sym":"应用 Pod 提示 `Could not resolve host`，内部通信全部断开。","cause":"CiliumNetworkPolicy 开启了严格白名单，但漏写了对 kube-dns (53端口) 的放行规则。","c":"egress:\n- toEndpoints:\n  - matchLabels:\n      k8s-app: kube-dns\n  toPorts:\n  - ports:\n    - port: '53'\n      protocol: UDP","o":"Policy updated. DNS egress allowed.","j":["零信任策略下必须显式放行 53 端口 UDP 流量"],"u":["Cilium CNI 零信任微隔离部署"],"w":["不要忽略 UDP 53 端口，否则整个 Pod 变‘瞎子’"],"v":"kubectl exec -it pod -- nslookup kubernetes.default","l":["hubble observe 过滤 DROP 流量","补充 DNS 放行规则"],"cat":"云原生"},{"id":"G22","t":"SRv6 隧道头端封装源地址缺失","sym":"SRv6 Policy 无法建立，报文无法完成 End.X/End.DT4 动作。","cause":"头端设备没有配置 `encapsulation source-address`，导致外层 IPv6 头无合法源地址。","c":"[Huawei-segment-routing-ipv6] encapsulation source-address 2001:db8:1::1","o":"SRv6 Encapsulation Source-Address: 2001:db8:1::1","j":["必须指定源 IPv6 用于封装外层 IPv6 报头","参考标准：RFC 8986 (SRv6 Network Programming)"],"u":["5G 承载网 SRv6 Policy 部署"],"w":["源 IPv6 必须在 Underlay 中全局可达"],"v":"display segment-routing ipv6 te-policy 状态变 UP","l":["查看 SRv6 全局配置","补全 encap 源地址"],"cat":"三层"},{"id":"G23","t":"eBPF 程序加载失败 (BTF 版本不匹配)","sym":"Cilium 或 Hubble 启动失败，报 `failed to load bpf program: vmlinux BTF mismatch`。","cause":"Linux 内核版本太低，或者缺少内核 BTF (BPF Type Format) 类型信息。","c":"[root@node ~]# uname -r\n[root@node ~]# ls /sys/kernel/btf/vmlinux","o":"/sys/kernel/btf/vmlinux","j":["eBPF CO-RE (一次编译随处运行) 强依赖 BTF 支撑"],"u":["云原生 eBPF 内核网络演进"],"w":["需要内核开启 BTF（5.2 起由 CONFIG_DEBUG_INFO_BTF 提供）","缺失时换内核或由发行版打开该选项，而不是自己编译 BTF 文件"],"v":"重新启动 cilium-agent 无 error 告警","l":["检查 /sys/kernel/btf/vmlinux","升级 Linux 内核至 5.15 LTS"],"cat":"云原生"},{"id":"G24","t":"Prometheus SNMP Exporter 采集超时","sym":"Grafana 看板大面积断层(No Data)，监控指标中断。","cause":"交换机 OID 树太庞大，SNMP Exporter 默认 5s 超时，网络设备 CPU 被拉满。","c":"scrape_configs:\n  - job_name: 'snmp'\n    scrape_timeout: 15s\n    scrape_interval: 30s","o":"Prometheus config reloaded. Timeout 15s applied.","j":["调大超时时间并降低采集频率"],"u":["大型网络设备监控排障"],"w":["不要盲目调高频率(如1秒1次)，会拖垮交换机 CPU"],"v":"Prometheus Targets 页面变 UP","l":["修改 prometheus.yml 中的 scrape_timeout","热加载配置"],"cat":"云原生"},{"id":"G25","t":"混沌实验后未恢复导致的残余丢包","sym":"演进结束后很久，某台 Node 上的 Pod 丢包率依然高达 20%。","cause":"Chaos Mesh 异常退出或取消实验时，网络 tc/netem 规则在 Linux 接口残留。","c":"[root@node ~]# tc qdisc show dev eth0\n[root@node ~]# tc qdisc del dev eth0 root","o":"qdisc netem 10: root refcnt 2 limit 1000 loss 20%","j":["手动清理 Linux 协议栈残留的 netem 规则"],"u":["混沌工程演练后应急止血"],"w":["清理 tc 规则前确认没有其他合法流量控制在用"],"v":"tc qdisc show 确认 netem 规则已清空","l":["登录问题 Node 节点","执行 tc qdisc del 彻底清理"],"cat":"云原生"},{"id":"G26","t":"拿到 IP 却上不了网（网关指向已下线设备）","sym":"","cause":"","c":"ip address\nip route show\ndisplay dhcp server ip-in-use all\ndisplay ip routing-table","o":"（示意，非逐字回显）终端默认路由存在、下一跳可达性探测失败；交换机 ARP 表里网关 MAC 与上联口对不上","j":["先确认「拿到地址」不等于「地址池内容是对的」","下一跳是否真的活着，比路由表有没有条目更关键"],"u":["开局后批量终端异常","设备退役后的收尾"],"w":["只看终端 ipconfig 会误判为链路问题：网关错误与链路故障的症状完全不同 —— 前者同段通、跨段全不通","改完地址池不重启租期，老终端还会拿着旧网关很久"],"v":"在终端上依次 ping 网关、上联三层口、公网 IP：第一跳不通而第二跳通，就指向网关项配错","l":["查终端拿到的网关与 DNS 是否与规划一致","在交换机上确认该网关 MAC 与实际设备端口对应","核对地址池下发项，改掉网关","让终端释放重取地址并复测"],"dg":{"k":"flow","n":[{"t":"终端"},{"t":"交换机"},{"t":"旧网关"}],"l":["",""]},"cat":"综合"},{"id":"G27","t":"双出口改造后部分业务时通时不通（非对称路由）","sym":"","cause":"","c":"tracert <目的>\ndisplay firewall session table\ndisplay ip routing-table","o":"（示意）两条路径的正反向探测经过不同设备；会话表里只有去向、没有对应回程","j":["「时通时不通」优先怀疑非对称，而不是链路抖动","状态型设备一旦进路径，就必须同时管住去与回"],"u":["双出口/双核心改造验收","策略路由引流动之后"],"w":["只 ping 通一次就判定正常，会漏掉间歇性丢包","在出口设备上加放行不等于解决了回程：回程路径本身没变"],"v":"同一条业务连接连续发起十次并抓包，比对去程与回程经过的设备是否成对","l":["画出这条业务去回两向的真实路径","确认路径上哪些设备带会话状态","调整路由或策略让去回同设备（必要时同向也做等价）","改完再连续测十次并核对会话表"],"dg":{"k":"multi","n":[{"t":"去向：出口 A"},{"t":"回程：出口 B"}],"l":[""]},"cat":"三层"},{"id":"G28","t":"隧道通但大包不通（封装吃掉 MTU 余量）","sym":"","cause":"","c":"ping -s 1472 -M do <对端 VTEP>\nping -s 1400 -M do <对端 VTEP>\ndisplay interface <接口名>","o":"（示意）接近满尺寸不分片的探测失败、调小后成功，差值落在封装开销的量级","j":["「小包通大包不通」几乎就是 MTU 黑洞的形状","不分片的探测比 ping 大小包更能定位"],"u":["Overlay 上线前验证","跨机房扩容"],"w":["只测 ping 通不通会漏判：必须测满尺寸且不分片","放大了接口 MTU 却忘了同步 TCP MSS，应用层还是会卡"],"v":"从 1472 起逐档调小做不分片探测，找出开始成功的尺寸并反推需要预留的开销","l":["确认两端 VTEP 间裸容量（不分片最大尺寸）","按封装开销算出虚接口应有的 MTU","同步调整接口 MTU 与 TCP MSS","重跑大文件传输确认不再卡"],"dg":{"k":"flow","n":[{"t":"VTEP A"},{"t":"underlay"},{"t":"VTEP B"}],"l":["",""]},"cat":"overlay"},{"id":"G29","t":"EVPN 路由收到了却不进表（导入导出不匹配）","sym":"","cause":"","c":"display bgp l2vpn evpn route\ndisplay bgp l2vpn evpn route\ndisplay routing-table vpn-instance <实例名>","o":"（示意）路由存在但带「未安装」类提示，verbose 里团体属性与本地实例的导入配置对不上","j":["「收到」和「可用」之间还有一层导入筛选","两端属性要成镜像：一头导出、另一头必须导入"],"u":["多租户 Overlay 开局","新增站点接不进既有网络"],"w":["只对齐 VNI 不对齐团体是最常见的半配置","改完团体不清缓存，收敛可能拖很久"],"v":"对照两端实例的导入/导出配置，确认至少有一个共同团体，再查是否已安装进转发表","l":["确认邻居与路由收发正常","打印路由的详细属性","比对本地实例的导入配置","补齐对称配置后确认条目进表"],"dg":{"k":"flow","n":[{"t":"PE A 导出"},{"t":"骨干"},{"t":"PE B 导入"}],"l":["",""]},"cat":"三层"},{"id":"G30","t":"AP 在线，连上的用户却出不去","sym":"","cause":"","c":"display ap all\ndisplay wlan client\ndisplay vlan","o":"（示意）AP 在线、vap 已建立，但用户 VLAN 在出口设备上不可达","j":["先把「管理面在线」与「用户面可达」当成两件事","转发模式决定用户流量绕不绕控制器"],"u":["无线开局","把集中转发改本地转发之后"],"w":["只看 AP 状态会误判：AP 上线只证明控制隧道建立","改转发模式要连带检查出口放行与地址池，否则症状会从「连不上」变成「连上不通」"],"v":"在用户侧确认拿到的地址属于哪个 VLAN，再顺着该 VLAN 追到出口设备是否放行","l":["确认当前是集中转发还是本地转发","在出口设备上核对用户 VLAN 的放行与网关","打通后从终端做端到端测试","把两种模式各测一次，记录差异"],"dg":{"k":"flow","n":[{"t":"终端"},{"t":"AP"},{"t":"AC"},{"t":"出口"}],"l":["","",""]},"cat":"无线"},{"id":"G31","t":"个别位置频繁掉线并在两台 AP 间来回摆","sym":"","cause":"","c":"display wlan client\ndisplay ap all\n（空口侧：信道与功率规划表）","o":"（示意）同一无线客户端在两台 AP 间短时间内多次关联，信号强度都处在临界区间","j":["「来回摆」是门限与覆盖设计问题，不是终端坏了","先固定一个位置复现，再谈调参"],"u":["办公区扩点后","会议室这类边缘覆盖"],"w":["直接调高切换强度差容易把终端留在远端 AP 上，制造另一个方向的粘滞","没做同信道复核就加功率，重叠干扰会更严重"],"v":"在同一位置定点长测，并把终端拿到两台 AP 下分别对比表现","l":["导出相邻 AP 的信道与功率规划","在问题位置定点测丢包与切换次数","按门限与信道两处分别做一次小调整","每次调整后定点复测，确认没有换一种坏法"],"dg":{"k":"multi","n":[{"t":"AP-A"},{"t":"重叠区"},{"t":"AP-B"}],"l":[""]},"cat":"无线"},{"id":"G32","t":"认证通过但权限没变（授权下发失败）","sym":"","cause":"","c":"display arp\ndisplay mac-address\n（在线认证用户的表项各版本子命令不同，用 ? 定位；服务器侧看授权属性与变更通知日志）","o":"（示意）会话状态为已认证，但下发的 VLAN/ACL 属性为空或与预期不一致","j":["认证与授权是两个动作，失败点常在第二个","属性对不对要看服务器实际下发了什么"],"u":["准入上线","按角色划网的改造"],"w":["只调认证方式解决不了授权下发失败","把问题归结为「终端不支持」前，先确认通知是否到达设备"],"v":"换一个已知正确的账号做对照，比对两次下发的属性差异","l":["确认会话已认证并记录其属性","在服务器侧查授权属性与通知发送结果","修正属性映射后重连","用两类账号各测一次确认稳定"],"dg":{"k":"flow","n":[{"t":"终端"},{"t":"接入设备"},{"t":"认证服务器"}],"l":["",""]},"cat":"综合"},{"id":"G33","t":"策略挂在出方向，回程把自己拦了","sym":"","cause":"","c":"display acl <编号>\n（两个方向分别看命中计数：先清计数再触发一次业务）","o":"（示意）命中计数集中在一条拒绝项上，且方向与预期相反","j":["先确定「报文此刻正从哪个接口出去」，再谈挂哪个方向","命中计数落在哪条比配置文本更可靠"],"u":["新增访问控制后","方向改造与割接"],"w":["以为有状态设备会自动放行回程：并非所有中间设备都带会话状态","两个方向都放开图省事，会把隔离彻底抹掉"],"v":"单向 traceroute/探测加计数器清零，逐方向确认命中落在哪条","l":["画出这条流量的双向实际路径","在两个方向各清一次计数并触发业务","按命中位置修正方向或规则顺序","双向各测一次确认无残留拦截"],"dg":{"k":"flow","n":[{"t":"去向"},{"t":"出方向策略"},{"t":"回程"}],"l":["",""]},"cat":"安全"},{"id":"G34","t":"原生 VLAN 与缺省 VLAN 不一致，管理网段泄漏","sym":"","cause":"","c":"display port vlan\ndisplay vlan","o":"（示意）Trunk 口的缺省 VLAN 与放行列表含管理网段，未标签流量沿该 VLAN 扩散","j":["放行列表与「不打标签的帧归谁」是两个独立设置","管理 VLAN 不应出现在任何面向终端的口上"],"u":["接入端口模板下发后","堆叠/替换设备之后"],"w":["只删放行 VLAN 不改端口缺省 VLAN，问题仍在","把 native/缺省 VLAN 当成「随便选一个」是常见误区：它就是未标签流量的归属"],"v":"在接入口发一个不带标签的帧，看它在哪台设备的哪个 VLAN 出现","l":["列出所有接入与上联口的缺省/原生 VLAN","把管理 VLAN 从面向终端的口上摘掉","上联口显式指定一个「死 VLAN」承接未标签帧","重做一次未标签验证并留档"],"dg":{"k":"stack","n":[{"t":"未标签帧"},{"t":"缺省 VLAN"},{"t":"管理网段"}],"l":[""]},"cat":"二层"},{"id":"G35","t":"端口明明放行了，应用还是连不上外部","sym":"","cause":"","c":"kubectl get networkpolicy -o yaml\n（集群内）nslookup <外部域名>","o":"（示意）直接按 IP 访问成功、按名字访问超时；解析查询无响应","j":["连通性要分「能不能解析」和「能不能连上」两层","出向策略最容易漏的就是解析流量"],"u":["微隔离上线后","把入向策略扩到出向时"],"w":["以为放行了 DNS 就够：解析走 UDP，且大包还可能走 TCP，两者都要留","把全部出向放开换取省事，等于放弃隔离"],"v":"同一目标分别用 IP 与域名各测一次，比对失败发生在哪一层","l":["导出该 Pod 的出向策略并核对协议与端口","先只放行解析流量再测业务","按需要补目的网段而非全放开","IP 与域名各回归一次"],"dg":{"k":"flow","n":[{"t":"Pod"},{"t":"解析组件"},{"t":"外部服务"}],"l":["",""]},"cat":"综合"}],"interview":[{"id":"IVQ1","t":"非科班出身优势？","point":"抗压能力、跨界学习力、逻辑思维。","star":"不要纠结学历劣势，重点讲“我是怎么快速补齐短板的”。","answer":"非科班不等于能力不足。我的优势在于跨领域视角和更强的学习驱动力。比如我原来做开发，转网工后能更快理解自动化脚本和 API 交互，Python 写得比一些老网工还溜。而且我动手能力很强，Lab 里踩过的坑都是真金白银的经验。","fb":"面试官反馈：态度诚恳，具备程序员思维，是个可塑之才。","j":["强调自驱力","结合自动化脚本展示优势"],"u":["破冰提问","压力测试"],"w":["切忌自卑","切忌长篇大论偏离技术"],"rel":[],"cat":"HR软技能"},{"id":"IVQ2","t":"K8s Pod 跨节点无法通信？","point":"云原生网络底座排障逻辑，是否懂 CNI。","star":"S 生产集群跨节点 Pod 间歇不通；T 限时恢复并给出根因；A 按 Pod→veth/CNI 路由→隧道→Underlay→NetworkPolicy 五层收敛，两端同时抓包做二分；R 定位到隧道 MTU 与 BGP 会话，修完补基线和告警。落点在“分层收敛、可复现证据”，不是运气。","answer":"我会分三步走：首先确认 CNI 状态，在 Node 上 kubectl get pods 看 Pod 是否正常；然后 calicoctl node status 检查 BGP 邻居。如果 BGP 断开，就去排查 Underlay 物理网。如果网络通但拒绝访问，我会查 NetworkPolicy 规则。","fb":"逻辑清晰，不盲目重启组件。","j":["体现分层分段思路"],"u":["容器网络排障必问题"],"w":["不要只说查日志，要说查哪个日志"],"rel":["J1","J2"],"cat":"云原生"},{"id":"IVQ3","t":"你的最大缺点是什么？","point":"自我认知，以及解决自身问题的方法。","star":"挑一个真实且正在改的短板，重点在 T/A：你为它建立了什么机制来补偿（checklist、自动校验、找人 review），R 给一个可验证的阶段结果。别用“追求完美”这类假缺点，面试官一听就知道。","answer":"我有时候太追求完美，做一个方案喜欢反复推敲导致效率不够高。但现在我会给自己设时间盒，先快速出原型再迭代。遇到难题先给 80% 靠谱的方案，而不是等 100% 才动手。","fb":"巧妙将缺点转化为追求质量，并给出了实操解法。","j":["真实且有改进动作"],"u":["HR面","性格测试"],"w":["别说‘我太拼命工作’这种虚假的缺点"],"rel":[],"cat":"HR软技能"},{"id":"IVQ4","t":"OSPF 和 BGP 区别及场景？","point":"对动态路由协议核心机制的理解。","star":"用一次真实选型讲：S 园区 + 跨域出口；T 决定内外协议边界；A 内部 OSPF 多区域收缩故障域、边界 BGP 用属性控路，并说清为什么不让 IGP 背全量外部路由；R 收敛时间与故障隔离的改善。落点是边界和规模，不是背概念差异。","answer":"OSPF 是内部网关协议，算链路状态，收敛极快，适合园区内部。BGP 是外部网关协议，算路径矢量，靠几十种属性灵活选路，扛得住百万级路由，所以互联网骨干和跨数据中心都用 BGP。","fb":"一句话切中要害：OSPF 算路，BGP 选路。","j":["强调‘属性控制’是 BGP 的灵魂"],"u":["高级网工必问"],"w":["别背书式地背各种 LSA"],"rel":["A3","A4"],"cat":"数通架构"},{"id":"IVQ5","t":"客户反映网络卡怎么排查？","point":"处理模糊故障的体系化思维。","star":"S 只有“卡”这一个字，没有任何指标；T 把主观投诉变成可测量问题；A 先定义卡是时延、抖动、丢包还是带宽，再分层取证（端到端拨测 + 接口计数 + 应用侧对照基线）；R 定位到具体链路或策略，给出改善前后的数字。考的是拆解模糊问题的能力。","answer":"先要定界：是有线卡还是无线卡？所有网站卡还是个别卡？然后 1. Ping 网关看内网；2. Ping 8.8.8.8 看外网丢包；3. 用 MTR 看哪一跳卡住了；4. 查核心设备 CPU 和流量监控；5. 看是不是被 QoS 限速了。","fb":"有章法，懂定界。","j":["定界是排障第一步"],"u":["桌面运维/Helpdesk 进阶题"],"w":["一上来就抓包是大忌，太重了"],"rel":["X1","I3"],"cat":"排障思路"},{"id":"IVQ6","t":"印象最深的故障经历 (STAR)？","point":"真实项目经验，解决复杂问题的能力。","star":"这题就是标准 STAR，但要留出“判断”：S 讲业务影响面和时间压力，T 讲你的职责边界，A 按止血→定位→根因→加固四步，说清每步的关键判断和放弃的方案，R 给量化结果加沉淀（预案、告警、演练）。只讲结果不讲判断，会被追问到空。","answer":"S(情境): 核心交换机 Trunk 震荡导致全公司断网。T(任务): 紧急止血并抓根因。A(行动): 我先 shutdown 问题链路恢复冗余路径，查日志发现光功率衰减导致 STP 疯狂重算，替换光模块。R(结果): 10分钟恢复，我还补充了光功率监控脚本。","fb":"有止血、有根因、有复盘预防。","j":["强调止血第一"],"u":["综合能力考核"],"w":["避免编造自己无法自圆其说的神级故障"],"rel":["X1","I3","G5"],"cat":"排障思路"},{"id":"IVQ7","t":"怎么看待网络自动化 (Python)？","point":"是否有 NetDevOps 意识。","star":"S 手工配置出过一次事故；T 证明自动化在你们的现网能落地；A 从只读巡检和合规校验起步，再推进到变更 + 回滚，讲清灰度批次和失败兜底；R 出错率或交付时长的具体变化。核心信号是“我先做风险最低的那一段”。","answer":"纯手工敲 CLI 已经跟不上云时代了。我常用 Python + Netmiko 批量下发 VLAN，或者用 Ansible 巡检配置合规性。这不仅是提效，更是通过代码把网络基线固定下来，避免人为低级失误。","fb":"展示了进阶思维。","j":["提效与防错并重"],"u":["加分项考核"],"w":["自动化不是万能的，底层原理仍是核心"],"rel":["D1"],"cat":"自动化"},{"id":"IVQ8","t":"未来三年职业规划？","point":"*：稳定性与上进心。","star":"T 要落在公司能给的路径上，A 分三层：第一年把手上的域做扎实（可举证），第二年扩到相邻域（云原生或自动化），第三年开始承担方案与带人；R 用可验证的里程碑表达，不要用职级和薪水当目标。","answer":"第一年吃透现网架构并推进 Ansible 自动化；第二年深入云原生网络如 Cilium 和 SRv6；第三年希望能主导设计高可用架构，带团队解决复杂问题。往 NetDevOps 和 SRE 方向走。","fb":"踏实且目标明确。","j":["分阶段，有递进"],"u":["团队契合度评估"],"w":["切忌假大空"],"rel":[],"cat":"HR软技能"},{"id":"IVQ9","t":"与同事有技术分歧怎么处理？","point":"团队协作与沟通能力。","star":"S 一次真实分歧（比如出口冗余怎么做）；T 不拖进度的前提下收敛；A 用数据、POC 或现网回放代替争论，明确决策人、记录结论和试错窗口；R 方案落地且关系没坏。展示“对事可验证、对人留余地”。","answer":"先对事不对人，把各自观点摆出来用数据说话——比如用抓包或测试对比。如果还争不下，提议搭个小范围 PoC (概念验证) 测试跑一下，让结果说话。实在不行交由主管仲裁，目标是解决问题。","fb":"成熟的职场沟通方式。","j":["数据导向，PoC验证"],"u":["情商与协作面"],"w":["别说‘谁对听谁的’这种废话"],"rel":[],"cat":"HR软技能"},{"id":"IVQ10","t":"期望薪资是多少？为什么？","point":"*：自我估值与底气。","star":"这题不用讲故事，要用证据：S 你查到的同城同岗区间和依据，T 你自己的约束，A 你能量化的能力（项目、证书、独立值班范围），R 报区间并说明哪些可谈判（级别、股票、试用期）。底气来自参照系，不是喊价。","answer":"期望 25K 左右。因为我能独立负责核心网演进、主导自动化项目、并且懂 K8s 网络，市面上兼具数通和云原生能力的人正是这个价位。当然我也看重平台的技术氛围。","fb":"有理有据，不卑不亢。","j":["锚定自己的核心价值"],"u":["HR / 终面"],"w":["不要畏缩，也不要漫天要价"],"rel":[],"cat":"HR软技能"},{"id":"IVQ11","t":"GitOps 在网工领域怎么落地？","point":"对前沿运维理念的实践认知。","star":"S 现网变更靠人盯、无审计；T 把变更纳入声明式闭环；A 期望态入库→MR 评审→CI 校验（语法 + Batfish 策略仿真）→Agent 下发→漂移回扫；R 变更可回滚、审计可追溯。主动承认你一次只迁一个业务域，比说全量落地更可信。","answer":"把设备配置(如 ACL, VLAN) 用 YAML 写进 Git 仓库。走 PR 审核，CI 用 Ansible --check 做 Dry-run 预检；合并后 CD 流水线自动推送至设备。一切变更皆可追溯、可回滚。","fb":"非常标准的 IaC/GitOps 流程。","j":["配置即代码 (IaC)"],"u":["大厂 / DevOps 岗"],"w":["别和软件代码的 CI/CD 完全混为一谈"],"rel":["W1","D3"],"cat":"自动化"},{"id":"IVQ12","t":"可观测性与传统 SNMP 监控区别？","point":"：运维理念是否升级。","star":"S 只有 SNMP 轮询，故障事后还原不出过程；T 升级监控体系；A SNMP 留作趋势与资产发现，指标走 Prometheus 拉取，日志和追踪按标签关联，给一次同故障两种体系的定位对比；R MTTR 或误报率变化。落点是“事件时序能否还原”，不是换工具。","answer":"传统 SNMP 是‘已知的未知’，设了阈值才知道报警。可观测性是‘未知的未知’，通过采集日志、链路 eBPF 数据，在没设告警的情况下也能主动发现问题（如某个 Pod 延迟突增），方便事后根因下钻。","fb":"降维打击，视角宏大。","j":["传统 SNMP vs 可观测性"],"u":["架构师面"],"w":["不要贬低 SNMP，它们是互补的"],"rel":["I1","I2"],"cat":"自动化"},{"id":"IVQ13","t":"Cilium 为什么能替代 kube-proxy？","point":"对 K8s 底层网络的深度。","star":"S Service 数量上来后 iptables 规则膨胀、变更变慢；T 评估 eBPF 方案；A 讲清机制差别（iptables 模式要为每个 Service/Endpoint 生成规则、Service 上万后重下发极慢；eBPF 用 Map 查表 + 增量更新，并把后端选择挪到 socket/TC 层），并说明灰度和与 iptables 共存期怎么切；R 规则数与更新耗时的实测对比。","answer":"kube-proxy 依赖 iptables/IPVS，Service 多了遍历链条很长、性能下降。Cilium 用 eBPF 在 TC/socket 层直接做 Service 转发决策，绕开的是 iptables 规则链而不是协议栈 —— 正常连接仍要过 TCP/IP 栈，只有 XDP、sockmap 这类更早或更贴近 socket 的钩子才跳过部分栈处理。附带还能做 L7 策略。","fb":"精准点出 eBPF 内核态加速的核心。","j":["eBPF vs iptables"],"u":["云原生岗核心题"],"w":[],"rel":["J1","X2"],"cat":"云原生"},{"id":"IVQ14","t":"引入 Service Mesh 网工要注意啥？","point":"*：跨边界排障能力。","star":"S 业务要上 Mesh；T 网工在新架构里的边界；A 讲你实际划清的一段：L4 归谁、mTLS 证书谁管、Sidecar 引入的时延和资源、排障分层怎么改；R 一次真实故障按新边界定位成功。忌泛谈理念。","answer":"关注 Envoy Sidecar 引入的延迟；注意 MTLS 双向认证导致的证书过期中断；另外 Mesh 的 VirtualService 可能会覆盖原有的 Ingress 规则，排障必须会查 Envoy 访问日志。","fb":"有实战经验才说得出这些坑。","j":["Sidecar 开销与路由接管"],"u":["高阶运维题"],"w":[],"rel":["Y2"],"cat":"云原生"},{"id":"IVQ15","t":"NetDevOps 现网“静默丢包”怎么破？","point":"自动化落地的安全兜底意识。","star":"S 无任何告警但业务报错；T 找出丢包点；A 逐层比对计数（接口 discard/error、ACL 命中、策略路由、MTU、防火墙会话表），两端同时抓包做二分；R 定位到一条具体策略并把检查固化进巡检。强调方法可复制、不靠灵感。","answer":"代码没错不代表环境没错。我会：1. 做金丝雀发布，先下发 10% 设备；2. 部署时配合 Ping/MTR 端到端连通性监控；3. 设置错误率阈值，一旦触发积分自动 Revert 回滚。","fb":"极其稳健的生产环境操作风格。","j":["灰度发布与监控断言"],"u":["自动化终极拷问"],"w":["绝对不能迷信代码，现网永远有意外"],"rel":["X2","I2"],"cat":"自动化"},{"id":"IVQ16","t":"构建 GitOps 自动化交付闭环","point":"端到端 NetDevOps 架构落地能力。","star":"S 多厂商现网变更风险高、交付慢；T 做出可审计的自动化交付；A 讲端到端五段：单一可信源→校验（语法 + 策略仿真）→审批→下发→回归与漂移检测，重点说失败如何回退；R 上线周期与变更事故数的变化。","answer":"使用 NetBox 作真理源，代码库存 Jinja2 模板。PR 触发 GitHub Actions/GitLab CI，拉取 Batfish 离线校验断言通断；合并后通过 Nornir 并发推送现网，配合 Prometheus 监控灰度，异常即触发 Git Revert 自动回滚。","fb":"极其完整的工程落地实践逻辑。","j":["Single Source of Truth","Batfish 离线验证"],"u":["NetDevOps 架构师"],"w":["切忌把配置密码明文硬编码在 Git 仓库中"],"rel":["W1","W2"],"cat":"自动化"},{"id":"IVQ17","t":"可观测性三支柱在网络排障中联动？","point":"故障定位的效率与方法论。","star":"S 一次只有指标告警的故障；T 定位；A 用指标圈定时间窗与实例→日志找异常实体→追踪看跨服务调用链，讲清三者靠什么对齐（统一标签、traceID）；R MTTR 与误报改善。考的是串联能力，不是三个名词。","answer":"Metrics 负责‘告警’（如 Prometheus 监控到网关 P99 延迟突增）；通过 TraceID 定位到特定的微服务调用 Span；最后提取该的时间戳检索日志 (Loki/ELK)，直接抓出具体的底层 Socket 超时报错。","fb":"逻辑严密，融会贯通。","j":["告警(Metrics)->定位(Traces)->根因(Logs)"],"u":["云原生网络/SRE 岗"],"w":[],"rel":["X1"],"cat":"云原生"},{"id":"IVQ18","t":"eBPF 原理及其相比 iptables 的优势？","point":"对 Linux 内核级包处理的认知。","star":"S 规则上千后可维护性和性能同时下降；T 论证 eBPF 的价值；A 讲机制：链式规则线性遍历 vs 映射表查找，以及 attach 点带来的可见性；R 给对比数据。只说“更快”会被立刻追问为什么。","answer":"eBPF 允许在内核安全运行沙箱程序。iptables 按规则链顺序匹配，规则数增长后匹配与重下发开销都明显上升；IPVS 其实也是哈希表（当年就是为绕开 iptables 才引入），但它已被官方列入弃用（v1.35 弃用 / v1.40 默认关闭 / v1.43 移除），官方指定的替代是 nftables 数据面。eBPF 的真正收益是把查表放到 TC/socket 层 + Map 增量更新，并顺带获得 L7 策略与可观测性。","fb":"准确点出 O(1) 查表与内核沙箱的本质。","j":["O(1) 复杂度","XDP 网卡驱动层丢包"],"u":["高阶 CNI / 云网络岗"],"w":[],"rel":["X2"],"cat":"HR软技能"},{"id":"IVQ19","t":"Sidecar 模式 vs Ambient Mesh (无Sidecar)？","point":"Service Mesh 最新演进方向。","star":"S 落地时资源或时延代价明显；T 选型；A 讲清 Sidecar 全量代理与 Ambient（节点级代理 + 按需 L7）的分层取舍，说明什么场景值得哪种；R 用一次实际部署的开销与收益收口。","answer":"Sidecar 模式需要在每个 Pod 注入 Envoy 容器，内存开销大、延迟增加明显；Ambient Mesh (如 Istio Ambient) 将 L4 代理下沉到节点级 ztunnel (用 eBPF 加速)，L7 交给按需部署的 waypoint proxy（ztunnel 的 L4 隧道用 HBONE，eBPF 只用于流量重定向，由 istio-cni 负责），架构更轻、损耗更低。","fb":"了解最前沿 Mesh 架构架构演进。","j":["ztunnel 节点级代理","资源开销对比"],"u":["微服务网格专家"],"w":[],"rel":["Y2"],"cat":"云原生"},{"id":"IVQ20","t":"如何用 Error Budget 约束网络变更？","point":"SRE 稳定性治理理念。","star":"S 变更反复引发故障；T 把稳定性变成可支配预算；A 定义 SLI/SLO→算错误预算→预算耗尽冻结常规变更并保留紧急通道，说清你如何跟业务方谈判；R 故障数与变更吞吐同时改善。关键是敢用预算说不。","answer":"若 SLO 为 99.9%，每月允许故障预算为 43 分钟。若本月网络震荡已消耗 30 分钟，预算充足，正常允许研发和网工发布变更；一旦预算耗尽，CI/CD 自动锁定，全员禁止变更，强制去修稳定性漏洞。","fb":"懂机制，懂治理。","j":["错误预算与发布锁定联动"],"u":["SRE 负责人 / 运维主管"],"w":[],"rel":["Z2_2","Z2_1"],"cat":"云原生"},{"id":"IVQ21","t":"什么是“静默丢包”？如何诊断？","point":"复杂隐蔽故障的定位排查。","star":"前半答概念（有去无回、计数不涨、无告警的丢包），后半必须挂一个你的真实案例；诊断手段讲“两端同时抓包 + 逐跳计数比对 + 计数器基线”，说明为什么靠单点 ping 永远抓不到。","answer":"静默丢包指设备没报 Down，但报文在芯片队列或 Linux 内核被悄悄 drop。我会：1. 查接口与队列的丢弃计数（`display qos statistics` / `display interface` 的 out discard，具体命令以型号文档为准）；2. 在 Linux 节点用 eBPF pwru (`packet-where-are-you`) 追查内核丢包函数。","fb":"展现了利用 eBPF 深入内核底层的能力。","j":["pwru 追查内核丢包","ASIC Drop 计数"],"u":["数据中心高级网工"],"w":[],"rel":["X2","Z11"],"cat":"排障思路"},{"id":"IVQ22","t":"对 SRv6 核心设计理念的理解？","point":"下一代 IPv6 骨干网协议栈理解。","star":"S 骨干或 DC 需要替代 SR-MPLS 的方案；T 讲设计哲学而非报缩写；A 说明 SID 即显式路径、源路由让中间节点不保流状态、因此不必再逐跳用 RSVP-TE 建立和维护 LSP（SID 仍要靠 IGP/BGP 分发）；R 讲收益也要讲迁移风险（终端兼容、路径编排、可观测）。","answer":"SRv6 将‘网络即服务’直接编码到 128 位 IPv6 地址中。把 Segment 塞进 IPv6 SRH 扩展头，利用现有的纯 IPv6 Underlay 转发，完全摒弃了复杂的大套协议 (如 RSVP-TE、LDP)，天生支持应用级编程与切片。","fb":"言简意赅，抓住 SRv6 灵魂。","j":["IPv6 地址即指令","简化协议栈"],"u":["运营商 / 骨干网网工"],"w":[],"rel":["A4","H3"],"cat":"数通架构"},{"id":"IVQ23","t":"生产环境开展混沌工程的红线？","point":"生产环境高可用风险把控。","star":"S 想在生产做演练；T 在不打扰业务的前提下拿到信任；A 讲你的红线：可观测先行、爆炸半径受控、随时中止开关、窗口与审批、先在预发和非核心跑通；R 演练暴露的真实缺陷及闭环。这题答“稳”不答“勇”。","answer":"三条红线：1. 严禁未经演练直接在生产开启；2. 必须具备自动化爆炸半径控制与熔断线 (如错误率>5% 瞬间终止实验)；3. 演练必须伴随完整的可观测性看板，确保随时能一键完全清理残留 tc 规则。","fb":"极其稳健的生产敬畏之心。","j":["爆炸半径控制","自动熔断与恢复机制"],"u":["混沌工程 / 架构师"],"w":[],"rel":["Y1","Y2"],"cat":"数通架构"},{"id":"IVQ24","t":"BGP EVPN 控制面 Type-2/3/5 路由区别？","point":"VXLAN 叠加网控制面深度。","star":"用一次多归属或跨子网互访需求引出：A 讲三类路由分别承载什么（Type-2 MAC/IP 可达与移动性、Type-3 IM 以太网自动发现支撑多活、Type-5 前缀路由做互访），以及为什么 Type-3 是双活的关键；R 收敛与广播域行为符合预期。","answer":"Type-2 是 MAC/IP 路由，用于分发主机 MAC 地址与 ARP 抑制；Type-3 是 inclusive 组播路由，用于自动发现 VTEP 并建立 BUM 泛洪隧道；Type-5 是 IP 前缀路由，用于跨 overlay 的三层子网路由互通。","fb":"熟练掌握 BGP EVPN 核心逻辑。","j":["Type-2 MAC/IP","Type-3 BUM隧道","Type-5 IP前缀"],"u":["SDN / 数据中心专家"],"w":[],"rel":["F1"],"cat":"数通架构"},{"id":"IVQ25","t":"如何设计 99.999% 可用性跨数据中心网络？","point":"顶级高可用架构设计能力。","star":"S 业务提出 99.999%；T 你的角色；A 分层给：双活 DC、任意单点可失效、仲裁与脑裂防护、异步复制的数据代价、变更与故障隔离域、定期演练验证；R 用“哪类故障不影响哪类业务”的矩阵收口。别只报可用性数字。","answer":"多维度消除单点：1. 物理层双路双缆独立管道；2. 架构层 Spine-Leaf 无阻塞 CLOS + ECMP 多路径；3. 边缘层 BFD 毫秒联动 BGP 快速收敛；4. 控制面部署异地多活 NCE 集群；5. 自动化变更引入 GitOps+Batfish 预检。","fb":"具备系统级架构师视野。","j":["多维消除单点","BFD 毫秒收敛","GitOps 预检"],"u":["首席网络架构师"],"w":[],"rel":["B3","B2","K1"],"cat":"数通架构"},{"id":"IVQ26","t":"Cilium 如何用 eBPF 实现免 NAT 重定向？","point":"内核级网络优化原理。","star":"S Service 做 SNAT 导致源地址丢失、排障困难；T 说明机制；A socket-LB 与 sockmap 在连接建立阶段就选定后端、转发不再改写，所以能免 NAT；R 源地址保留与链路开销下降。主动说清边界（非 socket 路径、UDP 场景）。","answer":"传统 kube-proxy 依赖 IPVS/iptables 在 DNAT 和 SNAT 来回折腾，浪费 CPU。Cilium 在 cgroup sock_ops 挂载 eBPF 程序，在 connect()/sendmsg() 阶段就把该 socket 直接连到后端地址，因此下层不再需要 NAT——报文仍然走协议栈，省掉的是改写与多一跳；真正把数据面短路的是 sockmap/sk_msg 重定向。官方也写明边界：Istio sidecar、KubeVirt 等场景会自动回落到 veth 上的 tc LB。","fb":"讲清了 SockOps 重定向的底层原理。","j":["SockOps 映射","省掉 NAT 改写，不省协议栈"],"u":["云原生网络专家"],"w":[],"rel":["X2","J1"],"cat":"云原生"},{"id":"IVQ27","t":"什么是配置漂移？如何治理？","point":"网络合规与基线治理。","star":"S 现网与配置库悄悄不一致；T 建基线；A 定时采集与期望态 diff→告警→受控自动纠偏，配豁免清单和灰度窗口；R 漂移条目下降、审计通过。强调“先能发现，再谈自动修”，上来就自动改会被否。","answer":"配置漂移指设备现网配置与 Git 仓库基线不一致。治理策略：1. 权限收回，关闭个人 SSH 写入权限，只留 Ansible 账号；2. 部署 Nornir 每日定时抓取 current-config 与 Git 比对生成 Diff 报告；3. 发现漂移强制触发自动化覆盖恢复。","fb":"闭环管理，落地性强。","j":["每日自动化 Diff","权限收紧与基线覆盖"],"u":["NetDevOps 运维经理"],"w":[],"rel":["D3","W3"],"cat":"自动化"},{"id":"IVQ28","t":"DNS 延迟突增对微服务的放大效应？","point":"微服务架构下的网络连锁反应。","star":"S DNS 抖动；T 说明放大机制；A 讲连锁：解析超时→客户端重试→上游排队→连接与线程池被占满→看起来像服务挂了，给出超时/重试/连接数的具体参数怎么定；R 修复后尾延迟变化。考的是对链式失败的敏感度。","answer":"微服务调用链很长，如果一个请求触发 10 次跨服务调用，每次 CoreDNS 解析增加 10ms，总延迟就增加 100ms。更惨的是如果超时触发重试，并发流量会瞬间冲垮 CoreDNS，引发雪崩。解法是 Pod 开启 NodeLocal DNSCache 节点级缓存。","fb":"有深度的微服务架构视角。","j":["调用链延迟叠加","NodeLocal DNSCache"],"u":["SRE 架构师"],"w":[],"rel":["P1","P2","P3"],"cat":"云原生"},{"id":"IVQ29","t":"异构网络环境(华为/Cisco/Linux)统一监控？","point":"混合云/万国牌机房运维监控落地。","star":"S 华为/Cisco/Linux 混牌；T 一块值班看板；A 按能力分层：多协议采集（SNMP/gNMI/CLI 兜底）→统一标签与指标模型→Prometheus + Grafana 出图，强调数据建模比选工具更重要；R 值班定位时间变化。只报工具名会被认为没做过。","answer":"采用 Prometheus + SNMP Exporter 架构。利用 YAML 针对各厂商 OID 树做标准化映射，把华为 display 和 Cisco show 的差异抽象为统一的 `network_interface_throughput_bytes` 格式时序指标，在 Grafana 统一看板呈现。","fb":"抽象能力极强。","j":["SNMP Exporter 抽象 OID","Prometheus 标准指标"],"u":["高级监控运维岗"],"w":[],"rel":["I1","I2","I3"],"cat":"自动化"},{"id":"IVQ30","t":"如何主持一次重大生产事故复盘？","point":"领导力、复盘文化与责任担当。","star":"S 你主持的一次重大复盘；T 找到根因并防复发；A 无责复盘、先事实时间线再判断、区分根因/诱因/改进项、改进项指派到人到期跟踪；R 同类故障未复发并有机制沉淀（预案、告警、演练）。责任担当体现在“我把改进项跟完了”。","answer":"原则是‘对事不对人’。复盘四步走：1. 还原时间线 (5W1H 精确到秒)；2. 根因分析 (用 5-Whys 法推导，比如为什么没发现光功率衰减？)；3. 评估止血效率；4. 制定改进 To-Do 责任到人 (如增加光功率告警脚本，一周内上线)。","fb":"非常专业的复盘管理流程。","j":["5-Whys 根因分析","改进 To-Do 责任落人"],"u":["运维总监 / 团队 Leader"],"w":[],"rel":["X1"],"cat":"HR软技能"},{"id":"IVQ31","t":"哑终端没有认证客户端，802.1X 怎么落地？","point":"准入控制的现实约束与兜底设计，而不是背协议。","star":"先承认矛盾（打印机/摄像头没有 supplicant），再给分层方案：能装的装、装不了的用 MAC 认证兜底、都不行的进受限 VLAN；最后必须说风险边界 —— MAC 可伪造，MAB 只能当兜底而不是安全边界。","answer":"我会把终端分成三类：办公终端走证书认证；打印机、门禁这类哑终端用 MAC 认证兜底，同时把它们隔离到独立 VLAN 并限制可访问范围；确实不能识别的放访客网段只给必需的服务。关键是要写清楚：MAC 认证是可达性控制不是身份认证，所以必须配合 VLAN 隔离和出向限制，否则等于没做。","fb":"能讲清兜底方案的边界，比只会说「都上 802.1X」可信得多。","j":["分类对待：证书 / MAC 兜底 / 受限网段","MAB 不是身份认证，要配隔离"],"u":["园区网与安全岗","甲方运维"],"w":["忘记把上行口设为信任，合法终端也拿不到地址"],"rel":["K2","B4"],"cat":"安全与零信任"},{"id":"IVQ32","t":"零信任在你们网络里是怎么落地的，难在哪？","point":"概念到工程落地的距离感，是否只会说口号。","star":"给出可执行的最小闭环 —— 身份 + 设备状态决定能不能连，而不是靠内网默认信任；再说难点在资产与身份的准确率、灰度期间的绕行通道、以及和既有 VPN/防火墙策略的共存；最后给一个可衡量指标（未授权访问被拒数、绕行工单数）。","answer":"我不讲「拆掉边界」这种口号。落地顺序是：先把访问关系看清楚（谁在什么时候连了谁），再把最敏感的一段改成按身份放行，灰度期只观测不阻断，确认误判可控才切强制。真正的难点是数据质量：CMDB 和身份源不准，零信任就会变成随机阻断；以及老系统的兼容口子怎么限时收口。","fb":"承认数据质量与灰度成本的人，通常真的做过。","j":["先观测后强制，误判可控才收口","身份与资产准确率是前提","给可衡量的收口指标"],"u":["安全与云原生岗","乙方方案岗"],"w":["一上来就全量强制，业务中断会把项目直接打死"],"rel":["J3","E2","Y2"],"cat":"安全与零信任"},{"id":"IVQ33","t":"网络设备的运维通道和口令，你们怎么管？","point":"日常操作是否留有审计与最小权限意识。","star":"讲清三件事 —— 人走堡垒机/跳板不直连设备、设备侧账号分角色且只开必需协议、口令不进脚本与仓库（一旦进了历史就当作已泄露并轮换）；补一句审计闭环：谁在什么时间改了哪台，能从记录里回溯。","answer":"原则是设备不暴露给办公网直连，管理面走跳板并留审计；设备上按角色建账号，只开加密协议并把来源限制死。脚本和模板里的凭据一律从外部注入，不进仓库；口令一旦出现在历史提交里，我不会去「清理历史」了事，而是轮换。配置仓库里只放配置，不放密钥。","fb":"「进历史就当泄露处理」这句话比任何流程名词都值钱。","j":["管理面不直连 + 来源限制","凭据外置，进历史即轮换","操作可回溯到人和时间"],"u":["所有运维岗","等保/审计相关"],"w":["把只读账号和写账号混用，审计就失去意义"],"rel":["Z5","D3"],"cat":"安全与零信任"},{"id":"IVQ34","t":"要下线一批老旧加密算法，你怎么在不捅故障的前提下推下去？","point":"兼容性债务的推进方式，安全与稳定的取舍能力。","star":"先度量再动手 —— 抓一段时间的实际协商结果，看谁还在用老算法；按「客户端-设备-隧道」分类找责任人；先灰度到非核心与办公网，保留可回退的开关与时间窗；最后把「谁在用」变成收口依据，而不是靠公告。","answer":"我会先把兼容矩阵跑出来：这段时间哪些终端、哪些对端在协商弱算法。然后按所有者去推替换，而不是直接关。关停放在灰度窗口里做，并且留一个明确时间点和回退开关 —— 安全整改失败最常见的原因是没人知道还剩谁在用。","fb":"能说出「先度量谁在用」的人，踩过只管关的坑。","j":["先测协商结果，再决定关停顺序","灰度 + 可回退 + 明确期限"],"u":["安全合规","运营商与金融"],"w":["只看协议版本不看实际终端，收不了口"],"rel":["I1","K1","L2"],"cat":"安全与零信任"},{"id":"IVQ35","t":"高密会场无线怎么保证体验，你关注哪些指标？","point":"从「覆盖」到「容量」的思维切换，是否只懂家里那种部署。","star":"高密的关键不是信号强，而是同频干扰、单格负载与漫游行为；讲清信道与功率的折中、低速率终端对空口的拖累、认证与上线风暴的削峰、以及验收口径（每格并发、时延与丢包、边界切换是否顺畅），最后补一句：现场要实测，仿真出来的图不代表体验。","answer":"家里那套「越响越好」在高密会场是反的：功率开太大，终端死抱远的 AP 不漫游，反而把一格挤爆。我会按目标并发倒推格数和信道复用，先压低不必要的功率与低速率接入，再处理认证侧的集中上线。验收时看的不是信号强度，是每格承载多少终端、丢包与切换是否来回摆。","fb":"能把「信号强反而差」讲清楚，说明真做过高密。","j":["容量优先于覆盖，先算并发","功率与速率门限是双向工具","验收看时延/丢包/漫游行为"],"u":["园区与无线岗","集成商交付"],"w":["只测信号强度就交付，活动当天必然翻车"],"rel":["L2","L3","G31"],"cat":"园区与无线"},{"id":"IVQ36","t":"堆叠、跨设备聚合和 VRRP，你会怎么选？","point":"高可用方案的取舍依据，而不是背名词。","star":"按「控制面是否合并、故障域是否变大、跨机房是否可行、运维心智」四个维度比较；点明堆叠把两台变一台所以省掉网关与防环复杂度，但同时把双设备的故障域合并；跨机房要谨慎；VRRP 更松散、故障域小但切换与配置面复杂。结论要挂在规模和连续性要求上。","answer":"同机房、要简化配置和防环，我会用堆叠加跨设备聚合；但要说清代价 —— 两台控制面合成一台，堆叠侧异常会一起受影响，所以链路和仲裁要冗余。跨城或要求完全独立的场景，我宁可保留 VRRP 加各自独立的控制面，配置多付一点，换故障隔离。选型不是谁先进，是故障域能不能接受。","fb":"主动讲代价的选型比讲「新技术」的更可信。","j":["控制面合并 vs 故障域合并","跨机房慎用堆叠，需仲裁与双主检测","VRRP 要配链路监视才真切换"],"u":["园区核心网","架构面试"],"w":["把堆叠当两台独立设备做双平面，是常见误解"],"rel":["B3","B2","G34"],"cat":"园区与无线"},{"id":"IVQ37","t":"接入交换机的 PoE 预算怎么算，供电冗余怎么做？","point":"容易被忽略的物理层容量规划，是否只会配逻辑。","star":"先讲预算是「整机可用功率」而不是端口数；再讲单设备实际功耗与协商等级不一致的风险（AP 带云台/多射频更耗电）；冗余做法是分散供电点、关键口预留余量、以及改造时先量后扩；最后补一句运维角度：掉电重启顺序会决定谁先抢功率。","answer":"我按设备实际峰值功耗乘并发系数算，不按标称等级；AP 这类带多射频和云台的会顶满。然后整机留三成余量，关键接入点分散到不同交换机/不同供电回路。改造前我会在现场量一次真实功耗，因为很多「新 AP 装上就重启」的锅是预算不够，而不是无线问题。","fb":"会提到「先量再扩」的人，现场吃过亏也真解决了问题。","j":["按峰值与并发算，不按标称","整机留余量，关键口分散供电","掉电恢复顺序影响谁先抢到功率"],"u":["园区交付与运维","弱电集成"],"w":["只看端口数分功率，新装终端会周期性重启"],"rel":["Z4","A1"],"cat":"园区与无线"},{"id":"IVQ38","t":"SRv6 和传统 MPLS TE，什么场景值得换？","point":"对新技术的判断是否被厂商叙事带着走。","star":"从三个真实驱动力说：底层是否已跑 IPv6、路径编排是否需要编程能力、运维团队能不能看懂；明确「不换也能跑」的多数园区/城域场景，换的收益主要在大流量调度与自动化；再讲迁移风险：终端与中间设备支持度、可观测与故障定位手段是否跟上。","answer":"我的判断标准很朴素：如果你现在没有跨域流量工程和自动化编排的需求，只是为了技术新去换，收益抵不上定位能力下降的成本。值得换的信号是底层已经 v6、需要显式路径与按业务分流、并且有配套的可观测手段。迁移期一定要能同时跑老方案，双轨期故障要能一眼看出走的哪条。","fb":"会踩刹车的人，比会追热词的人更能负责生产。","j":["驱动力：v6 底层、编排需求、自动化","风险：定位手段与支持度是否跟上","迁移期双轨可回退"],"u":["骨干与数据中心网络","架构面试"],"w":["把厂商叙事当业务需求，先换再想解决什么问题"],"rel":["K1","C3"],"cat":"数通架构"},{"id":"IVQ39","t":"双出口怎么做进出向调度，最容易踩的坑是什么？","point":"策略与路由的联合思维，以及是否理解状态型设备。","star":"出向靠本地优先级/权重，入向靠路径属性与前缀宣告策略；重点讲坑：只调去程不改回程就会非对称，带会话状态的设备上表现为「时通时不通」；验收必须双向连测多次，而不是 ping 一次通。","answer":"先画清楚这条业务去和回各自走哪台设备，再谈策略。最常见的事故是去程被我引到新出口，回程仍从老设备回来 —— 有会话状态的设备上这条流不存在，症状就是第一次超时、重试就好，特别容易被误判成链路抖动。所以我的验收动作是同一业务连发十次并抓包看两向路径，而不是 ping 一次。","fb":"能把「非对称」和「时通时不通」对上号，是真做过多出口。","j":["出向本地优先级，入向路径属性","回程路径必须一起改","验收连测多次并看双向路径"],"u":["企业出口与运营商","运维面试"],"w":["只调一侧，把间歇性故障当成链路质量差"],"rel":["A5","A4","C1","G27"],"cat":"数通架构"},{"id":"IVQ40","t":"要把园区往 IPv6-only 走，你怎么排路线？","point":"演进路线的阶段性思维与对遗留兼容的处理。","star":"按「先双栈、再让 v6 成为主用、最后按需做 v6 到 v4 的翻译层」排序；强调每阶段的退出条件与度量（解析成功率、v6 可达性、仅 v4 的存量应用清单）；点出最容易忽略的是管理面与第三方设备不支持，需要预留 v4 管理通道到最后。","answer":"我不信一步到 v6-only。顺序是：全网双栈并把 v6 地址规划做对，然后让解析优先返回 v6、把 v6 侧监控做起来，等仅 v4 的存量清单收敛完，再对剩下的少量场景用翻译方案兜底。每阶段要有度量指标和回退方式，尤其管理面 —— 很多设备带外只支持 v4，这条得留到最后再拆。","fb":"主动谈退出条件和度量，说明是把演进当工程而非口号。","j":["双栈 → v6 主用 → 按需翻译","阶段有度量与回退，不只「装了就行」","管理面 v4 最后收口"],"u":["城域与园区演进","运营商"],"w":["只统计 v6 覆盖率，不看实际业务走哪一版"],"rel":["H1","H3","H2"],"cat":"数通架构"},{"id":"IVQ41","t":"MTU 黑洞这类问题，能不能在设计阶段就防住？","point":"是否只会事后排障，懂不懂设计侧留余量。","star":"讲清机制（需要分片的包被静默丢弃、控制报文能过而大包不行），再给设计动作：封装开销预留、underlay 直接放大帧、关键路径做不分片探测纳入交付项；最后强调「小包通」不能当验收结论，必须满尺寸探测。","answer":"这问题本质是余量没留：封装吃掉的字节没人算，再加上中间设备把「需分片」的报错丢掉。我的做法是 underlay 直接开大帧，Overlay 侧按封装开销算出应有的 MTU 与 MSS，交付验收里固定加一条满尺寸不分片探测，从源到目的逐跳找临界值。只看连通性一定测不出来，因为握手都是小包。","fb":"把验收动作说具体的人，比背术语的人可靠。","j":["封装开销按字节预留","TCP MSS 要一起调，不只接口 MTU","验收含满尺寸不分片探测"],"u":["数据中心与 Overlay","交付验收"],"w":["只 ping 一次就签字，上线后大文件才暴露"],"rel":["Z11","F1","C2","G28"],"cat":"数通架构"},{"id":"IVQ42","t":"一次网络变更的评审和回滚方案，你会写什么？","point":"工程纪律，以及是否把「可回滚」当真实能力。","star":"变更单四要素：影响面（谁会被打断、持续多久）、判定指标与阈值、执行与验证步骤、回滚步骤与触发条件；强调回滚必须演练过且是「一条命令能做完」而不是描述；再用离线推演或断言做前门禁，最后把结果写回基线。","answer":"我按四块写：影响面和窗口、用什么指标判断成功、每一步执行加验证、以及回滚的触发条件和动作。回滚我要求可执行 —— 具体到命令或模板版本，且演练过一次；写「恢复原配置」不算方案。前置门禁是变更前后跑一次可达性断言，把差异留档。真出过事的人会把验证写进步骤里，而不是写在结尾。","fb":"「回滚要能一条命令做完」这种细节，装不出来。","j":["影响面 + 判定指标 + 步骤 + 回滚触发条件","回滚要演练过、可执行","前后断言差异留档"],"u":["所有运维岗","SRE 面试"],"w":["把回滚写成「改回原样」，出问题时现场重新想"],"rel":["D3","W2","Z2_2"],"cat":"稳定性工程"},{"id":"IVQ43","t":"告警怎么分级，夜里该叫醒人的是哪几条？","point":"对「可观测 ≠ 全监控」的理解，值班可持续性。","star":"叫醒标准挂在用户受损与预算燃尽上，而不是设备指标；其余分级到工单/日报；讲清收敛与关联（同源风暴合并、上下游依赖抑制）；再给一条治理动作：定期统计误报与无人响应的告警，该删就删。","answer":"只有两类该半夜打电话：用户已经受损且没有自动兜底，以及按当前燃尽速度今晚必然受损。其它进队列白天处理。然后把告警做关联 —— 一台核心挂了不该同时叫醒五个人，要看上下游抑制关系。我还会定期看两个数：哪条告警从没被人处理过，哪条误报率最高，这类就直接删掉，噪声会吃掉真正的响应能力。","fb":"愿意删告警的人，通常在值班上真的被噪声伤过。","j":["叫醒标准=用户受损或预算将燃尽","关联与抑制，避免同源风暴","定期清理零响应与高误报"],"u":["SRE 与运维","大型园区"],"w":["把设备阈值当业务告警，阈值一多就没人看了"],"rel":["X1","Z2_1","Z2_2"],"cat":"稳定性工程"},{"id":"IVQ44","t":"网络容量水位怎么定，压测怎么做才有意义？","point":"能否把「还够不够」变成可执行的判断。","star":"先定义单位（峰值利用率、队列与丢弃、时延分布），再定水位阈值与扩容提前量；压测要贴近真实流量形态（并发、包长、连接数）而不是一把大带宽；讲清演练后的恢复与残留检查；给一个反例：只测吞吐不测会话表与新建速率，事故常出在后者。","answer":"水位不是利用率一个数：我会看峰值利用率、队列丢弃、时延分布和会话表余量四条，取最紧的那条定扩容提前量。压测要按业务形态打，很多网络不是被带宽打死，是被新建连接速率或会话数打死。演练完还要检查残留（限速规则、注入配置）有没有清干净，否则下次故障是演练造的。","fb":"提「会话数与新建速率」的人，踩过只有带宽思维的坑。","j":["多指标取最紧的一条定水位","按业务形态打：包长/并发/新建速率","演练后确认无残留规则"],"u":["数据中心与出口","容量规划"],"w":["只打带宽，事故出在表项与速率上"],"rel":["Y1","Y2","Z2_1"],"cat":"稳定性工程"},{"id":"IVQ45","t":"公有云上为什么 CNI 默认要封装，代价是什么？","point":"是否理解云平台的约束，而不是只会关功能。","star":"讲清两个真实原因 —— 平台不做 Pod 网段路由、以及虚拟网络的源目校验；再说关封装的前提条件（同子网、路由可控、云厂商集成）；最后给代价：MTU 余量、性能开销与排障复杂度，并强调跨子网场景关不掉。","answer":"不是云厂商不许跑 BGP，而是它不认识你的 Pod 网段，也不会替你把它写进路由表，加上虚拟网络的源目校验会丢掉陌生地址的包。所以默认套一层隧道。同子网、且能关掉校验时可以走无封装；跨子网或跨可用区要么继续封装，要么用云厂商的路由集成把 Pod 网段登记进去。关封装的收益是省开销和少一层 MTU 问题，代价是排障时要多问一句路由归谁管。","fb":"能说出「路由归谁管」的人，排查过云上不通。","j":["两因：平台不学 Pod 路由 + 源目校验","关闭有前提，跨子网常关不掉","代价含 MTU 与排障层次"],"u":["云原生网络","混合云运维"],"w":["在云上照搬机房那套「路由我全都能加」的假设"],"rel":["J2","J1","G8"],"cat":"云网络与成本"},{"id":"IVQ46","t":"网络成本能从哪些地方省，怎么证明省下来没变差？","point":"成本意识与用数据说话的习惯 —— 资深候选人和新人的分水岭。","star":"按「跨区/跨云出向流量、闲置带宽与预留、观测数据本身的存储成本」三类讲；再强调必须绑定不变量（时延、丢包、预算燃尽）来证明没有偷偷降级；给一条纪律：任何降配以「先量化谁在用」为前提。","answer":"我见过最大的浪费通常不在链路费，在跨可用区的东西向流量和全量采集的存储。做法是先按调用关系把流量找出来，把服务就近部署或收敛调用；观测侧把保留期和采样按重要性分级。但降配必须有不变量：时延分位、丢包、错误预算燃尽速度 —— 否则那叫降级不叫优化，出事时没人能证明当时是安全的。","fb":"「降配要留不变量」这个提法，通常来自真实复盘。","j":["大头常在跨区流量与采集存储","降配必须绑时延/丢包/预算指标","先量化谁在用，再动配置"],"u":["平台工程","成本与容量治理"],"w":["直接砍采集或降带宽，故障时失去判断依据"],"rel":["X1","Z2_1","I2"],"cat":"云网络与成本"},{"id":"IVQ47","t":"GPU 集群的网络和普通数据中心有什么不同？","point":"是否跟得上新一代负载，有没有概念级判断力。","star":"抓三个特征：东西向突发且同步（集合通信让短板链路决定整体速度）、丢包/重传的代价被放大所以追求无损、以及故障域与拓扑对齐（同一作业尽量同平面/同机柜）。再谈手段层次：拥塞控制与优先级、无损机制、路由与拓扑亲和；最后诚实说明边界：调参要配合应用侧 profiler，网络不能单独解决。","answer":"最大差别是它像一个整体而不是许多独立流：一个同步步骤里最慢的那条链路会拖住整批，所以链路均衡和热点比平均利用率更要紧。其次这类负载对丢包极敏感，追求近似无损，但要防住拥塞扩散和死锁那类副作用。再往下是拓扑对齐 —— 把同一作业放在同一平面内，跨层跳转就是额外时延。真要调优得和应用侧一起看，网络单看计数器调不出来。","fb":"承认「需要应用侧一起看」比吹能调参更专业。","j":["同步突发：短板链路定整体","近似无损，但要防拥塞扩散","拓扑与故障域对齐，跨层即额外开销"],"u":["算力与数据中心网络","AI 基础设施"],"w":["把无损理解成无限优先级队列，反而放大拥塞"],"rel":["F1","X2","Z11"],"cat":"算力与AI"},{"id":"IVQ48","t":"AI 会不会取代网络工程师？你在工作里怎么用它？","point":"对工具边界的判断，以及是否有自己的方法论 —— 现在几乎必问。","star":"不要站队。给出你用它的三个具体场景（把重复文本变成脚本骨架、读陌生配置/日志、生成变更前的检查清单），紧接着给出你不让它做的三件事（不直接下发现网、不采信未经核对的命令与回显、不把结论当证据），并说明你如何验证它的产出。最后落到判断：责任仍在人。","answer":"它帮我省时间的是重复劳动：把一堆接口说明变成脚本骨架、读陌生的日志格式、生成变更前的检查清单。我不用它的是：直接对现网下发、以及相信它给出的命令名和设备回显 —— 这类东西看着最像真的、错得最贵，所以必须回到官方文档或设备本机上核。我的做法是让它出草稿、我来定判据。判断和签字这件事目前没人替。","fb":"能清楚划出「不让它做什么」的人，通常已经真在用它。","j":["三个用途 + 三条边界，具体到动作","命令与回显必须回原文核对","草稿可交给工具，判据和签字在人"],"u":["所有岗位","现在大概率会被问"],"w":["把未核对的「设备回显」抄进文档或脚本"],"rel":["D1","W3","I3"],"cat":"算力与AI"},{"id":"IVQ49","t":"白板题：从浏览器敲回车到页面出来，讲一遍全链路。","point":"知识是否连得起来 —— 面试官最爱用来区分背题的人。","star":"按层推进但有主线：解析（本地缓存/转发策略）→ 建连（选路、是否命中已有连接池）→ 传输（握手与拥塞窗口）→ 服务端与回源 → 渲染；每步带一个排障抓手（解析失败、RST 与超时的区别、502/503/504 分别指谁）；最后主动补一句「生产上我会先看哪一段最可能出问题」。","answer":"我会边画边讲：名字先变地址，缓存没有就按搜索后缀逐个试；拿到地址后按路由表决定第一跳；建连走 TLS 就还有一次握手与证书校验；服务端侧可能有代理、负载均衡、容器网络，每多一跳就多一种失败方式；页面内容再回来才轮到渲染。关键是每一段我能说「不通时长什么样」：解析失败、拒连、超时、还是应用错误码。最后我会说一句：真实排障不是顺序走一遍，是先用一个指标把范围砍到一段。","fb":"能主动给出「先砍范围」的人，说明真排过而不是背过。","j":["每段配一个失败形态","状态码归属：谁的锅一眼分","收尾给出排障顺序而非名词表"],"u":["所有网络岗","校招与转岗常考"],"w":["名词堆到一半卡住，说明只是背链条不是懂因果"],"rel":["Z1","P1","N3","C1"],"cat":"面试形式"},{"id":"IVQ50","t":"没有任何告警，但用户说慢，你从哪儿开始？","point":"没有信号时的方法论 —— 区分「靠监控的人」和「能定位的人」。","star":"先定义「慢」并把它变可测（哪个用户、哪条业务、什么时候、从哪测）；再做基线对比（与平时、与同侧其它业务、与对端）；然后分层收敛：端到端分段计时（解析/建连/首字节/传输）把问题切到某一段；最后补一句：如果确实没数据，就把采集补上，这是产出而不是失败。","answer":"我会先把「慢」变成数字：具体到哪个用户访问哪条业务、什么时间开始、从哪个点测。然后看基线，昨天同样时段是什么样、同一时刻其它业务是否也慢。接着分段计时 —— 解析、建连、首字节、传输各花多少，一段一段砍掉一半范围。如果这段根本没埋点，那就先把这个观测补上再判断，而不是猜。没有告警往往意味着告警缺的不是设备侧，是业务侧视角。","fb":"「先把主观描述变成可测数字」这句话，是这类题的分水岭。","j":["定义并量化「慢」：人/业务/时间/测点","基线对比：与昨天、与邻居业务","分段计时二分范围，缺观测就先补"],"u":["高级运维与排障岗","甲方现场"],"w":["一上来查设备 CPU，通常白跑一趟"],"rel":["X1","I3","G26"],"cat":"排障思路"},{"id":"IVQ51","t":"上机题：给你一台空交换机和一台路由器，30 分钟让终端能出网，你怎么安排？","point":"现场工作法 —— 时间分配、验证习惯和在压力下是否还留回退余地。","star":"先花两三分钟问清拓扑与验收口径（哪个网段、网关在哪、要不要做地址转换），别一上来敲命令；按「二层通 → 三层通 → 出网 → 解析」四步推进，每步都有确认可用的检查点；留出最后五分钟保存配置并写清下次启动文件；说不清的地方当场标注为待确认，而不是蒙一个。","answer":"我会先确认三件事：终端要落在哪个网段、网关在哪台设备上、出网由谁做地址转换 —— 这三点决定后面所有配置。然后按二层通、三层通、能出网、能解析四步走，每步用一个具体检查确认（接口状态、MAC 表项、路由与邻居、会话表）。最后五分钟我一定留给保存和核对下次启动文件，很多现场事故不是配不出来，是配好了没存就重启了。中间遇到不确定的命令我会直接问或查手册，而不是猜一个看起来像的。","fb":"面试官在看你的顺序感和收尾习惯，命令生不熟是次要的。","j":["开头两三分钟问清验收口径，比多敲五条命令有用","每步配一个可确认的检查点","结尾留时间保存并核对启动文件"],"u":["现场交付岗","校招与转岗上机"],"w":["把时间花在炫命令上，最后没保存或没验证回程","不确定的命令凭印象编一个 —— 现场看不出来，割接时一定爆"],"rel":["Z6","Z7","Z3","A1"],"cat":"面试形式"},{"id":"IVQ52","t":"「你有什么想问我们的」，这个问题该怎么用？","point":"提问质量暴露判断力 —— 你关心什么，就说明你做过什么、在意什么风险。","star":"给出三类有价值的问题：现状与规模（网络规模、变更频率、故障与值班节奏）、流程与工具（配置怎么管、变更怎么走、有没有观测与告警分级）、以及最近一次线上事故与之后的改进；再用得到的信息判断这团队值不值得去，而不是把它当礼节性环节。","answer":"我会问三个具体的：一是你们现在多大体量、变更频率和值班节奏如何，我想知道自己在什么压力下工作；二是配置和变更怎么走流程 —— 是否有版本库、能不能回滚、有没有变更前的断言；三是最近一次让我印象深刻的线上故障是什么、后来改了什么。这三个问题的答案基本能判断这个团队是把运维当工程还是当救火。我不太会问薪资福利之外能被 HR 回答的技术细节，那说明前面没问够。","fb":"能问出「最近一次故障改了什么」的候选人，通常自己有复盘习惯。","j":["问现状与节奏，判断工作强度是否可持续","问流程与工具，判断是否当工程做","问上一次事故与改进，判断复盘文化"],"u":["所有岗位","终面与管理面"],"w":["把它浪费成礼节性问题，或只问加班与薪资"],"rel":["W1","X1","D3"],"cat":"面试形式"},{"id":"IVQ53","t":"面试中被问到完全不会的问题，你怎么办？","point":"面对无知的诚实与推理能力 —— 网络领域没人什么都会，面试官在测的是这两样。","star":"先明确承认没做过/不掌握（不装懂是底线），再把问题拆成自己懂的部分做有依据的推理，并说清需要什么信息才能确认；最后展示补法（会后查什么、多久能上手）。切忌编造命令、回显或数字 —— 一被追问就全盘失信。","answer":"我会先说这个我没实际做过，然后把我知道的部分推一遍：这类现象通常分几段，我会先确认哪一段有证据、缺哪块信息，再说我会怎么查。比如被问到一个没碰过的厂商特性，我会先讲它在解决什么问题、我理解它的机制大概是什么、然后说清楚我不敢给你命令名 —— 因为编一个看起来对的命令，比我承认不知道代价大得多。会后我会去查官方文档，一般一两天能上手做基础运维。","fb":"承认边界 + 给出推理路径和补课计划，比硬答得分高得多。","j":["先划清「知道」和「不知道」的边界","用分层与分段做有依据的推理","绝不编命令名或设备回显"],"u":["所有岗位","技术面与交叉面"],"w":["硬编一个像模像样的答案：被追问第二个细节时整段可信度归零"],"rel":["Z1","X1","Z10"],"cat":"面试形式"}],"dict":{"cols":[{"k":"hw","n":"华为 / H3C"},{"k":"cs","n":"Cisco"},{"k":"zte","n":"中兴"},{"k":"lx","n":"Linux / 云原生"}],"rows":[{"i":1,"fn":"查看版本","hw":"display version","cs":"show version","zte":"show version","lx":"uname -a","cat":"运维"},{"i":2,"fn":"运行配置","hw":"display cur","cs":"show run","zte":"show run","lx":"cat /etc/network/int
