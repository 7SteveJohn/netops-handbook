建计数增长、前后 WAN 地址不同——发布服务配动态域名或换固定 IP，并排查是否误配按需拨号导致空闲断开"],"v":"display pppoe-client session summary","l":["接入侧起虚拟模板并配地址池与认证","客户端拨号，确认会话已建立","在客户端确认默认路由与获得的公网地址","把接口 MTU 调小一档，复现「小包通、大包卡」并对比 MSS"]},{"id":"C3","t":"C3. MPLS L3VPN (P/PE/CE & LDP)","lab":false,"y":"L3VPN 的要点是「客户路由只存在于 PE 的实例里」，运营商骨干不参与寻址。\n- PE 上每个客户一个转发与路由实例（VRF），互相隔离；CE 只跟自己直连的 PE 跑静态或动态路由\n- 两层标签：外层把包送到对端 PE（由 IGP 邻接或 LDP 分配），内层告诉对端 PE 该丢进哪个 VRF/出接口 —— 转发只看外层，P 路由器完全不感知客户路由\n- 客户可以随便用重叠私网地址：BGP 在 IPv4 前缀前加一个区分符（RD）形成全局唯一的 VPNv4 前缀，再用导入/导出目标（RT）决定哪条路由进哪个 VRF\n- 排障要分两段：标签通路通不通（外层、LDP/邻接、UDP 或 MTU）与客户路由有没有（VRF 表、RT 匹配、BGP 邻居与选路）\n- 常见断点是 RT 不对称和 VRF 里缺默认路由，而不是 MPLS 本身","dg":{"k":"stack","n":[{"t":"CE1","s":"- PE1 - P - PE2 - C…"}]},"c":"[Huawei] ip vpn-instance VPN_A\n[Huawei-vpn-instance-VPN_A] route-distinguisher 100:1\n[Huawei-vpn-instance-VPN_A] vpn-target 100:1 export-extcommunity\n[Huawei-vpn-instance-VPN_A] vpn-target 100:1 import-extcommunity\n[Huawei-GE0/0/1] ip binding vpn-instance VPN_A","o":"Routing Table: VPN_A\nDestinations : 5 Routes : 5","j":["route-distinguisher: 区分重叠路由","vpn-target: VPN路由导入/导出标识，两端PE需匹配才能交换路由(export/import 成对)","ip binding vpn-instance 把接口划入实例：绑定后接口原 IP 被清空需重配，CE 路由从此只进 VPN_A 实例表、全局表查不到——o 回显标题 Routing Table: VPN_A 正是实例视图而非全局表，排障别看错表"],"u":["大企业跨国跨城安全组网","多租户/托管中心的重叠地址隔离互访"],"w":["接口绑定 VPN 实例后配置突然掉线：现象是 binding 命令敲完接口 IP 立即消失、CE 中断；机制是 VRP 规定绑定实例会重置接口三层配置，属预期行为而非故障；判据是接口视图 display this 看到 IP 配置没了——先规划地址再绑定，或绑定后立即重配","对端 VRF 学不到本端路由：现象是本端实例表里有 CE 路由、对端 PE 实例表为空；机制是 vpn-target 的 export/import 任一侧缺失或取值不一致，VPNv4 路由过不了 RT 匹配被丢弃；判据是 display bgp vpnv4 all 里本端前缀已发布、对端收不到——逐端核对两个方向的 RT 是否成对","跨骨干小包通、大包丢：现象是 VRF 互 ping 小尺寸正常、接近 1500 的报文丢；机制是 MPLS 每压一层标签加 4 字节开销，临界报文加标签后超骨干接口 MTU 被丢；判据是同一目的小包通、大包断，且故障集中在骨干段——统一调大骨干接口 MTU 或提前规划标签层数"],"v":"display ip routing-table vpn-instance","l":["PE 上建转发实例并绑面向 CE 的接口","CE 与直连 PE 互 ping，确认本地接入正常","骨干上看标签与邻接是否建立（外层通路）","两个 PE 互 ping 对方 CE 的地址，验证跨骨干的 VPN 转发"]},{"id":"C4","t":"C4. GRE 隧道与 GRE over IPsec","lab":false,"y":"GRE 是最简单的三层隧道：给原报文套上 4 字节 GRE 头和 20 字节外层 IP 头，合计 24 字节封装开销，1500 链路上隧道内有效 MTU 只剩 1476。\n- 隧道里小包通、大包丢是 PMTUD 黑洞的经典现场（对应排障案例 G28）：超 MTU 报文被丢且 ICMP 不可达被中间设备吞掉；处置是隧道口降 ip mtu 并配 MSS clamp（纯 GRE 钳 1436，GRE over IPsec 常用 1360）\n- GRE 封得住组播/广播所以 OSPF 能在隧道上跑，但明文不加密；IPsec 加密强却只按单播五元组匹配感兴趣流，组播报文进不去——GRE over IPsec 让 GRE 包着路由协议、IPsec 加密 GRE 包，各取所长\n- 隧道口用独立互连网段（如 10.255.0.0/30），去对端内网的路由下一跳指 Tunnel 口；tunnel destination 的公网路由若被动态路由学回隧道自身，会递归震荡（Cisco 报 %TUN-5-RECURDOWN），公网段必须静态路由锁死\n- 排障分层走：display interface Tunnel 看协议层与 MTU → 小包、大包分开 ping 区分故障层 → GRE over IPsec 再看 display ike sa，SA 未建立是全断，MTU 问题是只断大包","dg":{"k":"stack","n":[{"t":"原报文 ≤1476","s":"隧道内有效 MTU 由这层定"},{"t":"GRE 头 4B","s":"协议号 47 告诉对端解 GRE"},{"t":"外层 IP 头 20B","s":"公网按这一层路由转发"},{"t":"ESP 头+尾（IPsec）","s":"GRE over IPsec 才有，有效 MTU 更小"}]},"c":"[Huawei] interface Tunnel0/0/1\n[Huawei-Tunnel0/0/1] ip address 10.255.0.1 255.255.255.252\n[Huawei-Tunnel0/0/1] tunnel-protocol gre\n[Huawei-Tunnel0/0/1] source GigabitEthernet0/0/0\n[Huawei-Tunnel0/0/1] destination 203.0.113.2\n# GRE over IPsec（VRP 常规思路）：ACL 命中本端发出的 GRE 报文，外网口挂 ipsec policy\n[Huawei] acl 3000\n[Huawei-acl-adv-3000] rule 5 permit gre source 203.0.113.1 0 destination 203.0.113.2 0\n[Huawei-GigabitEthernet0/0/0] ipsec policy policy1\n# Cisco：tunnel protection 直接给隧道口套 IPsec profile（PROF 为 crypto ipsec profile 定义），同时降 MTU、钳 MSS\nRouter(config)# interface Tunnel0\nRouter(config-if)# ip address 10.255.0.2 255.255.255.252\nRouter(config-if)# tunnel source GigabitEthernet0/0\nRouter(config-if)# tunnel destination 203.0.113.1\nRouter(config-if)# ip mtu 1400\nRouter(config-if)# ip tcp adjust-mss 1360\nRouter(config-if)# tunnel protection ipsec profile PROF\n# Linux：ip tunnel add gre1 mode gre local 198.51.100.1 remote 203.0.113.1 ttl 255，随后 ip addr add 10.255.0.2/30 dev gre1 + ip link set gre1 up","o":"[Huawei] display interface Tunnel 0/0/1\nTunnel0/0/1 current state : UP\nLine protocol current state : UP\nDescription:HUAWEI, AR Series, Tunnel0/0/1 Interface\nRoute Port,The Maximum Transmit Unit is 1476\nInternet Address is 10.255.0.1/30 Primary\nTunnel protocol/transport GRE/IP, gre key disabled\nChecksumming of GRE packets disabled\nSource 203.0.113.1 (GigabitEthernet0/0/0), Destination 203.0.113.2\nInput: 1236 packets, 154064 bytes\nOutput: 1290 packets, 161382 bytes","j":["Line protocol DOWN 而物理口 Up：先查去 tunnel destination 的公网路由与连通性，Tunnel 口参数本身往往不是根因","MTU 1476 = 1500 − 20 字节外层 IP 头 − 4 字节 GRE 头；隧道内再跑 IPsec 还要另降，ip mtu 1400 + tcp adjust-mss 1360 是常用组合","GRE over IPsec 要分两类故障看：小包通大包丢查 MTU/MSS，全部不通先看 display ike sa（Cisco 对应 show crypto isakmp sa）有没有 RD 状态条目"],"u":["分支—总部跨公网加密互通，跑动态路由","IPv6 过渡/非常规协议跨 IPv4 承载","割接/演练期两条内网之间的临时旁路通道"],"w":["小包通大包断就是 G28：降隧道 ip mtu 并配 MSS clamp，别乱放行分片","destination 公网路由被动态路由学进隧道会递归震荡（RECURDOWN），公网段静态路由锁死","IKE SA 协商失败时隧道口 UP 业务全断，GRE 与 IPsec 两层分开核"],"v":"两端 tunnel 地址互 ping 通后，带 DF 位测边界：ping -M do -s 1372 10.255.0.2 通、再加尺寸就不通（ip mtu 1400 生效），display ike sa 出现 RD 状态的 IKEv2 条目——三个现象齐了才算通。","l":["打通公网底座：确认两端都能访问对方 tunnel destination 的公网地址","建 Tunnel 口：互连 10.255.0.0/30，tunnel-protocol gre","source/destination 指两端公网口，对端内网路由下一跳指 Tunnel 口","互 ping 两端 tunnel 地址验证 GRE 通，再核去对端内网段的路由","ping -M do -s 从 1372 起探 MTU 边界，超限降 ip mtu 并配 MSS clamp","套 IPsec（华为 ACL + ipsec policy / Cisco tunnel protection）","display ike sa 复核，业务全量回归"]},{"id":"C5","t":"C5. SD-WAN 集中控制与智能选路","lab":false,"y":"SD-WAN 把「脑子」从每台设备收回到控制器：拓扑、隧道、策略在 iMaster NCE 上做成模板集中下发，站点 Edge（CPE）只保留转发面，开局注册即上线。\n- 控制面与转发面分离是和传统组网的分水岭：传统靠 OSPF/BGP 逐台学路、route-policy 逐台手敲；SD-WAN 由控制器算好 Overlay 拓扑与策略再推给 Edge，模板改一次全网生效——所以站点侧「配置不在本机」，排障先看控制器基线\n- Overlay 隧道（多为内建 IPsec 加密）跑在 MPLS/互联网组成的 Underlay 上，术语与词汇表一致：Underlay 是承载隧道的底层物理网只管可达，Overlay 是其上的逻辑网，业务、加密与选路都发生在这一层\n- 智能选路三要素：应用识别（DPI 特征库把流量分成视频会议/OA/上网等类别）+ SLA 探测（时延/丢包/抖动，常以 NQA 类探针实现）+ 策略模板（关键业务绑 MPLS、办公上网走互联网，探测超阈值自动切换）\n- 与 MPLS 专线是渐进替代而非一步到位：先混合组网（MPLS 保关键业务、互联网吃大流量降成本），再按各链路 SLA 达标情况逐步把业务往互联网 Overlay 迁移\n- 开源与各厂商实现（Cisco vManage 等）在协议细节上互不兼容，本模块口径以华为 iMaster NCE 为准；MTU 异常与丢包震荡的排障口径见 G13","dg":{"k":"flow","n":[{"t":"应用识别"},{"t":"SLA 探测"},{"t":"策略模板匹配"},{"t":"隧道转发"}],"l":["DPI 特征库分类","时延/丢包/抖动","关键业务绑 MPLS","超阈值自动切换"]},"c":"# 站点侧多数配置由 iMaster NCE 模板下发，现场主要做探测与查询验证\n[Huawei] nqa test-instance admin mpls-path\n[Huawei-nqa-admin-mpls-path] test-type icmpjitter\n[Huawei-nqa-admin-mpls-path] destination-address ipv4 10.9.9.2\n[Huawei-nqa-admin-mpls-path] start now\n[Huawei] display nqa results test-instance admin mpls-path\n[Huawei] display ike sa\n[Huawei-Tunnel0] mtu 1400\n[Huawei-Tunnel0] tcp adjust-mss 1360\n# TNP（Tunnel Next Hop）隧道属性与选路策略模板由控制器推送到 Edge，站点侧一般只查不改；探测常由控制器统一下发 NQA 实例，手工配法仅作离线验证，命令名随版本有差异，以本机文档为准","o":"current ike sa number: 2\n---------------------------------------------------------------\nconn-id    peer            flag          phase vnet\n---------------------------------------------------------------\n40109      203.0.113.2     RD|ST         v2:1  public\n40107      203.0.113.2     RD|ST         v2:2  public\nNQA entry(admin, mpls-path) : icmpjitter\n  Sent probe packets        : 100\n  Received response packets : 98\n  Packet loss ratio         : 2.0%\n  Min/Max/Average RTT       : 8/24/11 ms\n  Average jitter            : 3 ms","j":["display ike sa 里 RD|ST 表示 IKE SA 已协商完成且处于就绪状态，是 Overlay 隧道是否建立的快捷判据；SA 不在则先查 Underlay 可达性再看 IPsec 提议是否两端匹配","SLA 探测盯三个数：时延（RTT）、丢包率、抖动（Jitter）；策略模板按业务定义阈值，探测值越界即触发路径切换——所以「选路变了」先查探测数据再查策略命中，最后才怀疑链路本身","集中策略模板 vs 逐台配置：策略在控制器发布一次全网生效，这是 SD-WAN 效率的来源，也是坑——手工在站点改的配置会被下次模板下发覆盖，变更必须回控制器做","隧道 MTU：IPsec/GRE 等封装开销吃掉载荷空间，站点侧常将隧道口降为 1400 并钳 MSS 1360（与 G13 口径一致）；tcp adjust-mss 的命令名存在版本差异"],"u":["连锁/多分支企业统一开局（ZTP）与策略管理，新站点当天上线","关键业务（视频会议、ERP）走 MPLS，办公上网走互联网降成本","双运营商出口按 SLA 实时探测、自动切换，链路劣化无感迁移"],"w":["现象：业务忽通忽断、选路来回跳；机制：探测值在阈值附近来回穿越造成频繁切换（震荡）；判据：控制器上路径切换日志密集——把阈值加滞回或加切换抑制时间","现象：ping 小包通、大文件传输卡死且探测丢包为 0；机制：Underlay 加 IPsec 等多层头部后超大包被丢形成 PMTUD 黑洞（同 G13），而探针是小包看不出问题；判据：ping -f -l 1300 不分片探测不通","现象：站点上手工改好的配置过几天被「还原」；机制：站点配置由控制器模板托管，下次下发即覆盖手工改动；判据：变更记录与控制器版本比对——SD-WAN 的变更入口只有控制器"],"v":"控制器上站点与隧道全绿，display ike sa 能看到对端 SA；display nqa results 的时延/丢包/抖动满足策略模板阈值，关键业务命中 MPLS 隧道，ping -f -l 1300 不分片通过。","l":["控制器上建站点与隧道模板，CPE 开局注册（ZTP）上线","确认 Underlay（MPLS/互联网）可达，display ike sa 验证 Overlay 建立","启用 NQA 探测，display nqa results test-instance 核对时延/丢包/抖动","发布应用识别与选路策略模板，验证视频会议命中 MPLS、办公命中互联网","ping -f -l 1300 验证隧道 MTU，异常按 G13 降 MTU 并钳 MSS"]},{"id":"E1","t":"E1. ACL 基本与高级策略","lab":false,"y":"ACL 是「匹配条件」这个通用零件，防火墙只是它的一种用法。\n- 基本组只看源地址，适合粗粒度过滤；高级组看五元组（源/目的地址、协议、源/目的端口），才谈得上业务级控制；另有 IPv6 与二层类型\n- 末尾隐含拒绝所有：没匹配上的报文被丢弃，所以「先精确后兜底」的顺序必须自己保证；写反一条就整段失效\n- 缺省按配置顺序匹配、首条命中即停，所以顺序就是策略；被前面宽规则遮蔽的细规则永远不命中，命中计数是唯一可信的裁判。VRP 也可按最长前缀匹配的方式创建 ACL，那时位置不再是决定因素 —— 先确认这张 ACL 用的是哪种匹配顺序\n- 更多时候 ACL 被 PBR、QoS、NAT 感兴趣流、路由过滤引用 —— 改 ACL 会同时改变这些功能的行为，别当孤立对象\n- 判据：看计数递增是否发生在预期的那条上；不增说明前面的规则抢了或方向/接口没挂对\n- 双向流量只放一侧往往够用（会话类设备回程自动放行），但在无状态的中间设备上要显式配反方向","dg":{"k":"flow","n":[{"t":"Packet"},{"t":"Rule 5?","s":"-N"},{"t":"Rule 10?","s":"-Y"},{"t":"Action"}],"l":["","",""]},"c":"[Huawei] acl number 3000\n[Huawei-acl-adv-3000] rule 5 permit tcp source 192.168.1.0 0.0.0.255 destination 10.0.0.1 0 destination-port eq 80","o":"Rule 5 permit tcp ... (matches: 123 packets)","j":["0.0.0.255: 反掩码(0精确,255忽略)","rule 5 的 5 是规则编号：缺省步长 5，插入新规则自动取中间值（5/10/15…），要把某条排前面直接用更小编号重写即可——匹配顺序由编号决定，编号就是策略","matches: 123 packets 是命中计数：测试流量打进去后预期那条的计数应递增；计数恒为 0 说明被前面更宽的规则抢了匹配，或 ACL 没挂对接口/方向——计数是验证策略唯一可信的裁判"],"u":["封堵病毒端口","限制财务网段互访","作为 NAT 感兴趣流、QoS 流分类、PBR 的流量匹配条件"],"w":["细规则永远不命中：现象是计数停在宽规则、细规则恒为 0；机制是按配置顺序首条命中即停，宽规则在前把流量截走（若该 ACL 创建时指定按最长前缀/自动排序，位置则不再是决定因素）；判据是 display acl 各规则计数分布——把细规则编号挪到宽规则之前再验证计数迁移","新加的拒绝规则『不生效』：现象是流量照走；机制有两种——规则追加到了更宽的放行规则之后被截和，或 ACL 挂错了接口/方向、流量根本没进这张表；判据是看计数：全部规则都为 0 是挂错方向，仅新规则为 0 是顺序问题——先分清再对症","单向放行后回程被丢：现象是只出不进、ping 单通；机制是无状态设备上 ACL 不自动放行回程，回程报文反向五元组对不上；判据是同拓扑在状态化防火墙上单侧放行即通、在路由器 ACL 上必须显式写反向规则（或配合 aspf 状态检测）——按设备有无状态决定要不要配回程"],"v":"display acl 3000 看匹配计数","l":["先把要放行的五元组写清楚，别凭感觉配","配一条高级 ACL 只放行目标业务流量","触发流量后查该 ACL 的命中计数落在第几条","故意把宽放行放前面，复现「细规则永远不命中」再改回"]},{"id":"E2","t":"E2. USG 防火墙 Zone 策略","lab":false,"y":"区域是策略的作用边界，判据从「接口在哪」变成「从哪个区到哪个区」。\n- 缺省行为是分方向的：跨区流量默认拒绝，同区之间通常不查安全策略 —— 所以「配了策略还不通」先确认自己是不是在同区里绕\n- 防火墙自己发起的流量算 local 区：设备 ping 外网要走 local→untrust 的策略，与业务流量的 trust→untrust 是两条\n- 状态检测使首包建会话、回程自动放行：这意味着只需放行去向；但如果回程实际从另一台设备回来（非对称），本机无会话就丢，双出口改造后常见\n- 规则自上而下匹配，第一条命中即停 —— 兜底拒绝放太前会让后面的规则永远不生效；调试看命中计数是否递增比看配置快\n- 策略层之外还有独立开关：黑白名单、IPS、应用识别、URL 过滤，任一在更前面丢弃都不会体现在安全策略命中里，别只盯一张表","dg":{"k":"flow","n":[{"t":"Trust"},{"t":"Untrust"}],"l":["Security Policy 检查"]},"c":"[Huawei] security-policy\n[Huawei-policy-security] rule name Trust-Out\n[Huawei-policy-security-rule-Trust-Out] source-zone trust\n[Huawei-policy-security-rule-Trust-Out] destination-zone untrust\n[Huawei-policy-security-rule-Trust-Out] action permit\n# 规则视图按 rule 名字拼提示符，不是编号；本机自己发起的流量用 source-zone local","o":"rule name Trust-Out\n action permit","j":["source-zone: 流量发起方","rule name 用名字而非编号标识策略，匹配顺序可用 move 类命令调整：命名要能表达业务（Trust-Out 一眼看出 trust 出向）；本机自己发起的流量属 local 区，要单独写 source-zone local 的规则","规则条件里源/目地址、服务、应用、时间对象可叠加，条件全空等于匹配一切；验证生效看该规则的命中计数是否随测试流量递增，而不是看配置存在"],"u":["企业出口安全控制","办公区与服务器区（DMZ）间的横向访问控制"],"w":["内网用户通、防火墙自己 ping 外网不通：现象是业务正常、设备本机诊断不通；机制是设备自身发起的流量属 local 区，与业务流量 trust→untrust 是两条路径，业务策略不覆盖 local→untrust；判据是终端同目标能通、会话表里没有本机发起的会话——单独放行 local 到目标区","改完策略业务行为还是旧的：现象是规则顺序/动作改了、流量没变；机制是状态检测按既有会话放行，已建会话不回查新策略，只有新会话走新规则；判据是清掉该五元组会话（或等老化）后立即按新策略生效——验证变更要用新建会话，别拿长连接当测试流","接口流量完全不查策略或全断：现象是某接口流量要么直通要么全丢；机制是接口没划入安全区或划错区，没有区就没有策略语义，未划区流量多数版本直接丢弃；判据是 display zone 里接口归属与预期不符——先核区再查策略，顺序别反"],"v":"display firewall session table","l":["确认业务接口都划进了预期的安全域","配一条去向放行策略，源域/目的域别写反","发起业务流量，查会话表与命中的策略条目","从设备自身发起一次测试，体会本机流量属另一个域"]},{"id":"E3","t":"E3. USG 防火墙双机热备（HRP）","lab":false,"y":"HRP 双机热备解决的是状态检测防火墙「去回路径必须过同一台」的问题：回程报文要命中会话表才放行，会话表不在两台设备间同步，倒换瞬间所有已建连接断。\n- VGMP 是管理组协议：把上下行业务接口的 VRRP 组、监控对象捆成一组统一裁决主备，整组一起倒换——没有它就可能出现「上行走 A、下行走 B」的半倒换，流量被丢在两台墙之间\n- 主备模式一台转发一台热备；主主（负载分担）两台都转发、来回路径可能不对称，对会话互备要求更高\n- 心跳走专用口（HRP 报文含 VGMP Hello，缺省 1 秒一次、约 3 个报文判死）：接口 up 不等于心跳通，remote 地址写错、心跳经交换机 VLAN 未放行都会「口通心不通」→ 双主；HRP 心跳通道是华为双机热备专用设计，VRRP 协议本身没有独立心跳口，别把两者混为一谈\n- 会话同步缺省只备份 TCP，UDP/ICMP 要 hrp mirror session enable 开快速备份——「策略同步了、UDP 业务倒换即断」是第一坑；倒换验证看两端 display hrp state 角色互补、备机会话表增长，原主恢复是否回切看抢占（hrp preempt）配置","dg":{"k":"ha","n":[{"t":"FW_A 主（active）","s":"转发业务 + 会话表权威"},{"t":"FW_B 备（standby）","s":"只跑心跳（GE1/0/3）不转发"}],"mid":"上下行业务口 VRRP VIP（vrid 1/2）"},"c":"# 主机 FW_A：双机热备骨架（心跳接口 + 上下行业务口 VRRP）\n[FW_A] hrp enable\n[FW_A] hrp mirror session enable\n[FW_A] hrp interface GigabitEthernet1/0/3 remote 198.51.100.2\n[FW_A] interface GigabitEthernet1/0/1\n[FW_A-GigabitEthernet1/0/1] ip address 203.0.113.1 24\n[FW_A-GigabitEthernet1/0/1] vrrp vrid 1 virtual-ip 203.0.113.254 active\n[FW_A] interface GigabitEthernet1/0/2\n[FW_A-GigabitEthernet1/0/2] ip address 198.51.100.65 26\n[FW_A-GigabitEthernet1/0/2] vrrp vrid 2 virtual-ip 198.51.100.126 active\n# 备机 FW_B：角色反向，心跳 remote 指对端\n[FW_B] hrp enable\n[FW_B] hrp standby-device\n[FW_B] hrp interface GigabitEthernet1/0/3 remote 198.51.100.1\n[FW_B-GigabitEthernet1/0/1] vrrp vrid 1 virtual-ip 203.0.113.254 standby\n[FW_B-GigabitEthernet1/0/2] vrrp vrid 2 virtual-ip 198.51.100.126 standby\n# 监控上行口 + 验证\n[FW_A] hrp track interface GigabitEthernet1/0/1\n[FW_A] display hrp state\n[FW_B] display firewall session table\n# Cisco ASA 对应：failover lan unit primary / failover lan interface FAILOVER GE0/3 / failover link STATE GE0/2 / show failover state","o":"# 主机 FW_A：display hrp state\n Role: active, peer: standby\n# 备机 FW_B：display hrp state\n Role: standby, peer: active\n# 备机 FW_B：display firewall session table\n Current Total Sessions : 37\n icmp  VPN: public --> public  198.51.100.70:0 --> 203.0.113.10:2048\n tcp  VPN: public --> public  198.51.100.70:51234 --> 203.0.113.10:443","j":["Role 行两端必须互补：一台 active、一台 standby；两台都 active 是心跳断了的指纹——接口 up 只保证物理层，remote 地址写错、心跳经交换机 VLAN 未放行都表现为「口通心不通」","备机 session table 总数应接近主机（本例 37 条含 tcp/icmp 会话，icmp 能出现正是因为开了 hrp mirror session enable）；缺省只备份 TCP，UDP 业务倒换必断","心跳接口独立成小网段（/30 即可），不参与安全策略、不复用业务口，MGMT 管理口不能当心跳接口；hrp track / hrp preempt 的参数随版本略有差异，以对应版本官方命令参考为准"],"u":["出口/IDC 边界两台 USG 主备无感倒换","双运营商主主负载分担，带宽翻倍互备","等保高可用边界：策略主机下发自动同步"],"w":["接口 up 不等于心跳通：remote 写错、VLAN 未放行都会双主","缺省只备份 TCP：忘开快速备份则语音视频上线即断","VRRP 组漏配或监控对象缺失：倒换只切一半，流量丢在两墙之间"],"v":"主机 shutdown 上行口，两端 display hrp state 角色互换（对端翻 active），终端长 ping 网关丢 1~2 个包后恢复、SSH 会话不重连；备机 display firewall session table 的 Current Total Sessions 持续增长。","l":["两台墙专口 /30 互 ping 198.51.100.1/2 打通心跳","hrp enable 后 display hrp state 确认角色互补","主机配上下行 VRRP（active/standby）与 hrp mirror session enable","在主机下发安全策略，观察备机自动同步","备机 display firewall session table 核对会话数接近主机","对比开关快速备份时 UDP/ICMP 会话有无的差异","主机 shutdown 上行口（或拔线）触发 VGMP 整组倒换","观察两端角色互换，长 ping 网关仅丢 1~2 个包","恢复原链路，观察是否回切（抢占行为随版本/配置，以官方文档为准），确认业务会话全程不中断"]},{"id":"E4","t":"E4. SSL VPN 远程接入","lab":false,"y":"SSL VPN 把远程接入架在 TLS（TCP 443）上：出口不用额外开端口，NAT/只放网页的边界天然放行，浏览器或瘦客户端即可接入——这是它与 IPSec 的根本分工差异。\n- 选型口径：SSL VPN 面向「人」，按应用/端口授权，角色里勾什么用什么；IPSec 面向「网」，网络层封装、隧道起来整网可达，站点对站点和固定互联选 IPSec\n- 两种工作模式：全通（网络扩展，虚拟网卡接管流量，可全路由或按推送路由分流）；端口转发（控件把指定 TCP 端口代理到网关）与 Web 改写（只透出内网 Web 应用）——授权粒度依次从网段级到端口级再到单应用级\n- 认证走「账号 + MFA」：本地用户或对接 RADIUS（与 K2 同一套 radius-server template），口令之外再叠短信/令牌动态码\n- 与零信任准入的关系一句话：SSL VPN 的「账号 + 角色最小授权」只是起点，零信任还要叠加终端环境检查与持续动态鉴权（见 IVQ32）","dg":{"k":"flow","n":[{"t":"远程终端"},{"t":"TLS 443 建隧道"},{"t":"网关认证·MFA"},{"t":"角色授权"},{"t":"内网资源"}],"l":["发起接入","校验身份","定可用范围","放行到内网"]},"c":"# 开启 SSL VPN 并建网关（V500 口径：v-gateway 体系，骨架为示例形式）\n[FW] v-gateway gw1 interface GigabitEthernet1/0/2 port 443 private\n[FW-gw1] service enable\n# 网络扩展：地址池 + 分流路由（只把列表内网段指进隧道）\n[FW-gw1] network-extension ip-pool pool1 10.10.10.1 10.10.10.100 mask 255.255.255.0\n[FW-gw1] network-extension split-route 192.168.1.0 255.255.255.0\n# 角色：决定「谁上线后能用什么」，三类能力可叠加\n[FW-gw1] role default\n[FW-gw1-role-default] web-link enable\n[FW-gw1-role-default] network-extension enable\n[FW-gw1-role-default] network-extension ip-pool pool1\n[FW-gw1-role-default] port-forwarding enable\n[FW-gw1-role-default] port-forwarding resource rdp host-ip 192.168.1.10 3389\n[FW-gw1-role-default] quit\n[FW-gw1] quit\n# 本地用户挂入默认组（也可经 Web 管理界面批量建）\n[FW] user-manage user zhangsan domain default\n[FW-user-zhangsan] password Net@2026\n[FW-user-zhangsan] parent-group /default\n[FW-user-zhangsan] quit\n# 对接 RADIUS / 动态令牌（与 K2 呼应）：radius-server template + 认证策略\n# 把 SSL VPN 用户认证指到 RADIUS，口令之外叠加动态码；命令随版本差异大，以版本文档为准\n# 安全策略两条腿：放行 443 建隧道 + 放行虚地址池访问内网\n[FW] security-policy\n[FW-policy-security] rule name sslvpn-in\n[FW-policy-security-rule-sslvpn-in] source-zone untrust\n[FW-policy-security-rule-sslvpn-in] destination-zone local\n[FW-policy-security-rule-sslvpn-in] destination-address 203.0.113.1 32\n[FW-policy-security-rule-sslvpn-in] service https\n[FW-policy-security-rule-sslvpn-in] action permit\n[FW-policy-security-rule-sslvpn-in] quit\n[FW-policy-security] rule name vpn-to-lan\n[FW-policy-security-rule-vpn-to-lan] source-zone untrust\n[FW-policy-security-rule-vpn-to-lan] source-address 10.10.10.0 24\n[FW-policy-security-rule-vpn-to-lan] destination-zone trust\n[FW-policy-security-rule-vpn-to-lan] destination-address 192.168.1.0 24\n[FW-policy-security-rule-vpn-to-lan] action permit\n[FW-policy-security-rule-vpn-to-lan] quit\n[FW-policy-security] quit\n# 验证\n[FW] display v-gateway\n[FW] display v-gateway gw1\n# Cisco ASA 对应：AnyConnect/WebVPN——webvpn enable outside + tunnel-group ... webvpn-attributes；端口转发对应 port-forward","o":"# display v-gateway gw1（V500，示例口径：字段名随版本有差异，以真机为准）\n  VG Name               : gw1\n  State                 : enabled\n  Interface             : GigabitEthernet1/0/2\n  Port                  : 443\n  IP Pool               : pool1  10.10.10.1 ~ 10.10.10.100  Mask 255.255.255.0\n  Split Route           : 192.168.1.0 255.255.255.0\n  Role                  : default\n    Web Link            : enable\n    Network Extension   : enable  IP Pool: pool1\n    Port Forwarding     : enable  rdp -> 192.168.1.10:3389","j":["角色是授权的最小单位：web-link（Web 改写）、port-forwarding（把指定 TCP 端口代理到本地回环口）、network-extension（全通，虚拟网卡接管流量）可按角色叠加——外部合作/临时账号用端口转发做最小暴露，自家运维用全通 + 推送路由","SSL VPN 视图与参数随版本差异较大（V100/V500 命名体系不同，V500 为 v-gateway 命令族），本骨架按 V500 口径给出，下发前以对应版本命令参考为准","回显字段随版本略有差异（示例口径），关注点是网关 State=enabled、地址池与分流路由是否下发成功；在线用户的 Virtual-IP 是否落在地址池内，用对应版本的在线用户查询复核","推送路由（分流）只把列表内网段指进隧道，列表外流量走本地网卡出公网；分流列表漏了 DNS 服务器网段最隐蔽——内网域名解析失败，看起来像「VPN 没通」","Web 改写/端口转发依赖浏览器控件（旧版用 ActiveX/NPAPI 插件），现代浏览器默认禁用，表现为登录后点应用无反应——换官方瘦客户端或改走全通模式，不要在浏览器兼容性上死磕","与零信任准入的关系：账号 + 角色最小授权只是起点，零信任还要叠加终端环境检查与每次访问的动态鉴权（IVQ32 呼应）"],"u":["出差/居家员工经浏览器或瘦客户端接入 OA、邮件、运维跳板（443 直通免穿透）","第三方驻场/外包限时账号：只开指定服务器指定端口，用完回收","分支机构无 IPSec 设备时的兜底远程运维通道，手机/平板经 Web 改写也能应急查看"],"w":["MTU/分片：现象——能登录、ping 通、小请求正常，内网大页面/大附件打不开或传输卡死；机制——TLS 封装再叠加 IP 头使有效 MTU 缩水，超 MTU 且带 DF 位的报文被中间设备丢弃，小包通大包不通；判据——同一目标小包通、大包（1400 字节以上）不通，调低虚拟网卡 MTU/MSS 后立即恢复","分流列表不全：现象——部分业务打不开而授权应用正常；机制——推送路由只下发列表内网段，列表外流量走本地网卡出公网，根本没进隧道；判据——终端 route print（Windows）比对打不开业务的目标网段是否命中虚拟网卡，补进推送路由后恢复","双网卡路由冲突：现象——同时连本地有线/无线和 VPN 时内网业务全不通，断开本地网卡就好；机制——本地默认路由与 VPN 推送路由重叠，跃点数更小的本地路由把流量拽出隧道；判据——route print 看 VPN 网段下一跳接口是物理还是虚拟网卡，改跃点/禁本地网卡后恢复即坐实"],"v":"终端登录网关能打开授权 Web 应用；全通模式下 route print 可见推送路由指向虚拟网卡、ping 虚网关通；在角色里去掉一项授权后重新登录，该应用立即不可达——授权粒度闭环验证。","l":["v-gateway gw1 建网关绑外网口 443，service enable 出登录页","角色下叠加 web-link/端口转发/网络扩展，推送路由只写业务网段并带上 DNS 网段","建用户挂角色，配两条安全策略（443 建隧道 + 虚地址池到内网），需要则接 RADIUS 叠动态码","终端实测：登录、打开授权应用、route print 核对分流与 DNS，再用大 ping 包复核 MTU","display v-gateway gw1 核对网关状态与地址池；故意收回一项授权，验证最小授权确实生效"]},{"id":"E5","t":"E5. 上网行为管理与审计","lab":false,"y":"上网行为管理部署在出口，回答三个问题：谁在上网、在用什么、要不要管——形态决定能力：旁路镜像只能审计，串接才能阻断与流控。\n- 识别三板斧：DPI 应用特征（特征库）、SNI/证书嗅探（HTTPS 握手的明文外壳）、账号-IP 归一（对接认证后流量归到人）\n- 认证与 K2 同源：LDAP/AD 拉组织架构并做认证，RADIUS 集中鉴权（同 K2 的模板参数），Portal 兜底匿名终端\n- HTTPS 时代的天花板：正文加密后只剩 SNI 与流量特征；ESNI/ECH 把 SNI 也加密，识别进一步退化到目的 IP 与流量画像\n- 绕过治理与 Z14 呼应：自带代理、DoH/DoT 把域名解析藏进加密流，靠「封已知出口 + 强制内网 DNS + TLS 指纹」两头堵\n- 合规口径：上网日志留存不少于六个月（工程上按 180 天起配），审计范围须书面告知并限定办公终端——能审计不等于可越界","dg":{"k":"flow","n":[{"t":"终端出口流量","s":"出口必经点"},{"t":"旁路镜像 / 串接接入","s":"旁路=只看，串接=可断"},{"t":"DPI + SNI 识别","s":"特征库 + 证书嗅探"},{"t":"认证比对归人","s":"AD/LDAP/RADIUS→IP 归一"},{"t":"审计落库 / 策略执行","s":"留存合规·阻断/流控"}],"l":["形态决定能力：旁路只审计，串接才能阻断流控","HTTPS 正文加密，识别退到 SNI 与流量特征，ECH 再拿走 SNI","匿名 IP 只有对接认证后才能归一到人","留存合规 + 按策略处置：审计、限速、阻断"]},"c":"# 形态一：旁路镜像（只审计，在交换机侧把出口流量复制给行为设备）\n[SW] observe-port 1 interface GigabitEthernet0/0/24\n[SW] interface GigabitEthernet0/0/3\n[SW-GigabitEthernet0/0/3] port-mirroring to observe-port 1 both\n# 形态二：串接网桥（可阻断/流控，行为设备两臂串进出口链路）\n[ACG] interface GigabitEthernet0/0/1\n[ACG-GigabitEthernet0/0/1] bridge 1\n[ACG] interface GigabitEthernet0/0/2\n[ACG-GigabitEthernet0/0/2] bridge 1\n# 认证对接（与 K2 同源参数）：LDAP 连 AD 拉组织架构，RADIUS 做集中鉴权\n[ACG] ldap-server template corp-ad\n[ACG-ldap-corp-ad] ldap-server authentication 10.1.1.10 389\n[ACG-ldap-corp-ad] ldap-server base-dn dc=corp,dc=local\n# radius-server template 写法同 K2；Portal 兜底匿名终端\n# 识别与审计：开 DPI 特征库 + SNI/证书嗅探，审计策略命中即记日志\n[ACG] dpi enable\n[ACG] audit-policy\n[ACG-audit-policy] rule name web-audit\n[ACG-audit-policy-rule-web-audit] user-group /default\n[ACG-audit-policy-rule-web-audit] action audit\n# 流控与保障（思路同 A7 的 QoS）：限 P2P，保障视频会议\n[ACG] traffic-policy\n[ACG-traffic-policy] rule name p2p-limit\n[ACG-traffic-policy-rule-p2p-limit] application BitTorrent\n[ACG-traffic-policy-rule-p2p-limit] action limit bandwidth 50\n[ACG-traffic-policy] rule name conf-guarantee\n[ACG-traffic-policy-rule-conf-guarantee] application video-conference\n[ACG-traffic-policy-rule-conf-guarantee] action guarantee bandwidth 100\n# 查询\n[ACG] display user online\n[ACG] display application statistics top 10\n[ACG] display audit-policy all\n# 旁路阻断的补救形式：伪造 TCP RST / 联动交换机下发 ACL（效果看时机，长连接常打不断）\n# Cisco 系对应：SPAN/ERSPAN 采集 + Firepower/Umbrella（DNS 层治理）；DoT 走 853 可直接封端口，DoH 藏在 443 只能按 IP/SNI 名单治理\n# audit-policy 与 traffic-policy 两段为跨厂商伪码（USG6000 V500 审计口径是 audit-profile + 安全策略规则内 audit 引用）；其余行为管理命令随厂商与版本差异大，下发前以对应版本文档为准","o":"[ACG] display user online\n User      IP             Auth-Type  Online-Time  Group\n zhangsan  192.168.10.23  LDAP       02:15:36     /corp/sales\n wangwu    192.168.10.41  Portal     00:41:02     /corp/rd\n Total: 2  (LDAP:1  Portal:1)\n[ACG] display application statistics top 10\n No. Application     Up(KB)     Down(KB)    Sessions  Action\n 1   video-conf      1,204,331  8,921,774   3,412     guarantee\n 2   https-browsing    512,033  4,102,998  12,873     audit\n 3   BitTorrent          9,332 10,772,411   8,905     limit-50M\n 4   unknown-tls       208,911    901,234   2,317     audit","j":["部署形态是第一决策：只出报表与合规留痕选旁路镜像（交换机 SPAN/分光进设备），要阻断、重定向、流控必须串接网桥或路由模式；旁路阻断只能伪造 RST 或联动交换机 ACL，效果依赖时机，长连接常打不断","HTTPS 后识别靠两层：DPI 特征库（SNI/证书嗅探补位）识别应用与域名；正文加密看不到，报表里保留 unknown-tls 属正常现象，ECH/ESNI 普及后该占比还会上升——向管理层汇报识别覆盖率时要说清这个天花板","审计合规两条线：日志留存按「不少于六个月」的法定口径配置（工程常设 180 天以上并做导出演练）；隐私边界是审计范围书面告知、只审办公终端与工作相关流量，私人内容不碰——制度先行，设备后上（本卡 audit-policy/traffic-policy 命令段为伪码，口径待真机验证）","账号-IP 归一是审计有意义的根：只有对接 AD/LDAP/RADIUS（与 K2 同源）后，流量报表才能从「哪个 IP」升维到「哪个人」，DHCP 环境下尤其要靠认证会话保活维持映射","DoH/DoT 与自带代理的绕过和 Z14 同源：DoT 走 853 端口可直接封，DoH 藏在 443 加密流里只能按已知提供商 IP/SNI 名单封堵并强制 DNS 走内网；代理类靠 TLS 指纹与非标端口治理，单靠封端口封不全"],"u":["办公网出口统一审计：谁、何时、用了什么应用/URL，出事件能倒查到人","合规留痕：等保/行业检查的上网日志留存与导出举证","带宽治理：限 P2P/网盘下载，保障视频会议与核心业务出口（对齐 A7 的 QoS 思路）"],"w":["旁路部署点了阻断不生效：现象——策略勾了「禁止 P2P」，用户照常下载；机制——旁路镜像只复制报文，设备不在转发路径上，丢弃动作无从执行，伪造 RST/联动 ACL 也常被重传盖过；判据——查部署形态，旁路=只能审计，要阻断必须串接或联动策略","报表一半流量是 unknown-https：现象——HTTPS 流量识别不出应用与域名；机制——特征库过旧或没开 SNI/证书嗅探，正文加密后本就只能靠握手明文与流量特征，ECH/ESNI 场景连 SNI 都拿不到；判据——升级特征库并开启嗅探后占比骤降为正常，抓包看 ClientHello 是否带 encrypted_client_hello 扩展，有则属协议级无解，只能按目的 IP 粗分","审计日志张冠李戴：现象——日志里全是 IP，或访问记录挂到别人头上；机制——DHCP 租期短、认证会话超时后终端掉回匿名态，IP-账号映射失效；判据——display user online 在线数与实际人数对不上、掉线集中在租期边界，调长会话保活并与 DHCP 租期对齐、叠加 AD 单点登录后恢复对应关系"],"v":"串接设备配一条「禁止 BitTorrent」后终端立即断流而审计照常记录；注销账号后该 IP 流量在报表里落回匿名组；导出一段审计日志核对时间戳与账号-IP 对应——阻断、归因、留存三件套各验一次。","l":["先定形态：只要报表选旁路镜像（交换机 SPAN 进设备）；要阻断/流控选串接网桥，排好割接窗口","LDAP/RADIUS 连 AD 认证，display user online 核对","升级特征库、开 DPI+SNI/证书嗅探，观察一周应用 Top10 与 unknown-tls 占比","配策略：审计日志按不少于六个月留存并做一次导出演练；限 P2P、保障会议（对齐 A7 的队列口径）","闭环验证：故意触发一条阻断看是否立即生效；抽查日志能否把一次访问倒查到人"]},{"id":"K1","t":"K1. IPsec VPN 站点互联","lab":false,"y":"IPsec 是两件事：IKE 负责谈出 SA（算法、密钥、生命周期），ESP/AH 负责按 SA 处理数据面 —— 排障就是分别确认这两层。\n- IKE 分阶段交换（v1 有主模式与野蛮模式，v2 交换更简洁），谈完再为每段感兴趣流创建子 SA；阶段一正常而阶段二失败，多半是感兴趣流 ACL 两端不镜像或选择集不重叠\n- ESP（协议号 50）既加密又可选认证，隧道模式下连内层原始 IP 头一起藏；AH（51）只做完整性且把 IP 头算进校验，遇到 NAT 必失效，现网基本不用\n- NAT 环境必须走 NAT-T：ESP 没有端口概念，NAT 改写地址会破坏校验，所以把 ESP 包进 UDP 4500 才能过中间设备；只放行协议号 50 的「防火墙全开」在 NAT 后照样不通\n- 密钥重协商时若两端不同步会出现「通了十几分钟后规律性中断」，这是生命周期不一致的典型味道；DPD 负责发现对端已消失并清理死 SA\n- 判据顺序：IKE SA 是否建立 → 子 SA 是否建立且两端一致 → 感兴趣流是否命中（计数）→ 中间是否被 NAT/策略改掉","dg":{"k":"flow","n":[{"t":"分支内网"},{"t":"总部内网"}],"l":["IPsec VPN隧道 跨公网"]},"c":"[Huawei] ipsec proposal ipsec_pro\n[Huawei] ike peer branch\n[Huawei-ike-peer-branch] pre-shared-key cipher pass123","o":"IPsec SA:\n State: active\n Encryption: AES-256","j":["pre-shared-key: 两端密钥必须一致","o 回显 State: active 只说明数据面子 SA 可用：完整验证要两段一起看——第一阶段 IKE SA（display ike sa）与第二阶段 IPsec SA 都建立且两端一致；阶段一通而阶段二缺，多半是感兴趣流 ACL 两端不镜像或选择集无交集","ipsec proposal 定义加密/认证算法与封装模式（隧道/传输），ike peer 定义对端地址、身份与预共享密钥：名字只在本地有意义，两端名字可以不同、参数必须能协商出交集"],"u":["分公司和总部安全内网互通","云上 VPC 与本地机房的混合云打通"],"w":["SA 反复协商不起来：现象是 display ike sa 里没有条目或只看到反复发起；机制是两端 IKE 提议（版本、算法、DH 组、身份方式）或阶段二 proposal 无交集，协商被拒；判据是协商调试里拒绝发生在哪个阶段、差在哪个参数——两端按同一张参数表逐项对齐，差一个算法都建不起来","穿 NAT 的站点隧道全断、点对点直连却正常：现象是中间有 NAT 设备时 ESP 有去无回；机制是 ESP（协议号 50）没有端口概念，NAT 改写地址破坏完整性校验也无法为其建映射；判据是中间链路抓包只见 ESP 出、不见回——启用 NAT-T 把 ESP 封进 UDP 4500，中间防火墙放行 UDP 500/4500 而非只放协议 50","隧道通十几分钟后规律性中断几十秒再自愈：现象是断流有周期；机制是两端 SA 生命周期不一致，短寿命一侧先到期重协商、对端状态不同步出现短暂断流；判据是中断周期与 display ike sa 剩余 lifetime 的差值吻合——两端生命周期对齐，并确认 DPD 开启以及时清理死 SA"],"v":"display ike sa 看是否Established","l":["两端 IKE 提议与身份凭据配成一致","配感兴趣流并保证两端地址互为镜像","查第一阶段与子 SA 是否都建立","中间加一层 NAT 复现 ESP 失败，改走 NAT-T 后再验证"]},{"id":"K2","t":"K2. 802.1X 准入与 RADIUS","lab":false,"y":"802.1X 把端口切成两半：未认证前只允许认证报文通过，其余全部受控 —— 不是「不准上网」，而是这条链路在认证完成前根本不通。\n- 三方角色要分清：终端里的 supplicant、交换机是 authenticator（转发认证报文并控制端口）、凭据校验通常在 RADIUS 服务器上（此时交换机侧只有共享密钥与可达性两件事可查），也可以落在设备本地 AAA —— 别把 RADIUS 当成 802.1X 的唯一形态\n- 方法决定安全性：证书类（EAP-TLS）双向认证最难被钓鱼；隧道口令类要先校验服务器证书，否则「输口令」等于把口令交给伪装成 RADIUS 的中间设备\n- 哑终端（打印机、摄像头）没有 supplicant，常见做法是 MAB 以 MAC 作凭据，或放 guest VLAN 只给受限网段；MAB 的凭据可伪造，只能当兜底\n- 判据按顺序看：端口是否受控 → 认证报文是否到达服务器 → 服务器是否回了 accept → 授权是否下发成功（改授权/CoA 失败会让已接入终端权限不刷新）\n- 认证失败常表现为「网线灯亮但拿不到 IP」，因为 DHCP 交互也被挡在受控端口之外；别一上来就查 DHCP","dg":{"k":"flow","n":[{"t":"PC 客户端"},{"t":"SW 认证者"},{"t":"Server"}],"l":["EAP","RADIUS"]},"c":"[Huawei-radius-rad] radius-server authentication 192.168.1.100 1812\n[Huawei-GE0/0/1] dot1x enable","o":"Interface: GE0/0/1\nStatus: Authenticated","j":["1812: RADIUS认证默认端口","radius-server 命令除认证端口 1812 外还有共享密钥与计费端口 1813：共享密钥两端不一致时设备直接丢弃 RADIUS 响应，表现为认证反复超时而非拒绝——超时查密钥与 UDP 可达性，拒绝查账号与策略","dot1x enable 是两级开关：系统视图开全局、接口视图再开一次，只开全局端口不受控；o 回显 Status: Authenticated 表示该端口已认证放行，未认证时 DHCP 等一切报文都被挡在受控端口之外"],"u":["园区网零信任第一步强制实名上网"],"w":["终端插上线灯亮却拿不到 IP：现象是 DHCP 请求石沉大海、网络图标一直转；机制是 Windows 的 Wired AutoConfig 服务未启动、终端根本不参与认证，或认证失败端口仍受控，DHCP 广播被挡在端口外；判据是交换机上端口认证状态与认证报文计数——先起客户端服务（Wired AutoConfig 置自动），再查账号与服务器","认证通过但用户进了错误网段/权限不对：现象是端口放行、终端拿到非预期 VLAN 地址；机制是认证（accept）与授权（下发 VLAN/ACL 属性）是两步，授权属性缺失或设备不认下发参数时落入缺省域；判据是认证态正常而地址属非预期网段——核对服务器授权模板与设备侧认证后域/guest VLAN 配置","哑终端（打印机、摄像头）接入即断网：现象是只有这类设备不通；机制是没有 supplicant、不响应 EAP 请求，受控端口永不放行；判据是认证日志里该 MAC 只有请求无响应——为哑终端配 MAB（MAC 当凭据）或 guest VLAN 放受限网段，MAB 凭据可伪造只能当兜底"],"v":"display dot1x sessions","l":["认证服务器与设备共享密钥配一致","在接入口开启认证并指向认证方案","测试终端接入：确认认证前拿不到地址","为哑终端改 MAB 或访客 VLAN，对比两种放行范围"]},{"id":"L1","t":"L1. CAPWAP 与 AC 发现","lab":false,"y":"瘦 AP 架构把控制面集中到 AC：射频参数、接入认证、配置下发由 AC 统管，AP 只负责空口收发。\n- 转发路径有两种选择：集中转发时用户数据也进隧道过 AC（便于统一策略与漫游），本地转发时数据直接从 AP 出（少一层瓶颈，但 AC 只管控制）\n- 上线流程是发现 → 建控制隧道 → 认证/白名单 → 下载配置与射频信息；发现方式常见为 DHCP option 43、DNS 域名、三层广播或静态指定\n- option 43 的内容是 AC 地址列表，编码方式要与 AP 侧解析一致（十六进制/字符串/IP 形式选一，选错表现为「拿到地址但连不上 AC」）\n- 控制与数据用不同端口（常见 5246 控制、5247 数据），中间设备只放一个就会「上线但用户不通」；AC 地址变了（改管理 VLAN、挪 VRRP）AP 会集体掉线\n- 判据顺序：AP 能否路由到 AC 地址 → 控制端口是否可达 → 认证是否放行 → 隧道是否建立并稳定","dg":{"k":"flow","n":[{"t":"AP"},{"t":"AC"}],"l":["CAPWAP UDP 5246/5247"]},"c":"[Huawei-wlan-view] capwap source interface Vlanif 100\n[Huawei] ip pool ap-vlan100\n[Huawei-ip-pool-ap-vlan100] network 192.168.100.0 mask 255.255.255.0\n[Huawei-ip-pool-ap-vlan100] gateway-list 192.168.100.1\n[Huawei-ip-pool-ap-vlan100] option 43 sub-option 2 ip-address 192.168.1.100","o":"AP ID  State    IP Address\n1      Online   192.168.1.101","j":["option 43 在 IP 地址池视图下配：sub-option 1=hex、2=ip-address、3=ascii，编码选错 AP 解不出来；系统视图没有 dhcp server option 43 这条命令","capwap source interface Vlanif 100 指定 AC 的隧道源接口：option 43 下发给 AP 的 AC 地址必须是这个接口的地址，源接口与下发地址不一致时控制隧道建不起来；一个 AC 只能指定一个 CAPWAP 源","o 回显 State Online 表示发现、认证、配置下载全部完成：AP 长时间不是 Online 时按阶段查——先看拿没拿到地址（DHCP），再看知不知道 AC 在哪（option 43/DNS/静态指定），最后看 UDP 5246 可达性与认证白名单"],"u":["大中型企业全覆盖Wi-Fi网络"],"w":["AP 反复掉线或『上线但业务不通』：现象是 display ap all 里 AP 反复重连、或 AP 在线而用户时通时断；机制是 CAPWAP 控制通道走 UDP 5246、数据通道走 UDP 5247，中间防火墙只放一个就出现控制通数据断；判据是 AP 状态 Online 且稳定、仅用户数据异常——两个端口分别放行并做长稳验证","改 AC 管理 VLAN/迁移 AC 地址后全网 AP 集体掉线：现象是成批掉线且时间点与地址变更吻合；机制是 AP 只认 option 43/DNS/静态配置里的 AC 地址，地址一变无法重新发现；判据是批量同时掉线、AP 侧解析到的目标地址已失效——变更前把新地址纳入下发列表或保留旧地址过渡","AP 在线、用户拿到地址却不通：现象是控制面正常、用户面断；机制是转发模式（集中/本地）与中间链路配置不一致，集中转发时用户数据要过 AC、业务 VLAN 在 AP 到 AC 路径上没放行就被丢；判据是 AP 状态稳定而用户流量不通——核对转发模式与沿途 VLAN 放行"],"v":"display ap all 看是否Online","l":["AC 上配地址池的下发项与隧道源接口","AP 上电，确认它既拿到地址也知道 AC 在哪","查 AP 状态是否从空闲变在线","故意把下发项编码改错，复现「上线但连不上 AC」再改回"]},{"id":"L2","t":"L2. WPA2 认证与 SSID","lab":false,"y":"SSID 就是 Wi-Fi 名。WPA2-PSK 是共享口令那一套（家用/小网），加密套件必须用 AES-CCMP —— 「AES 最安全」只是相对早该关掉的 TKIP 兼容模式。企业网走 802.1X，WPA3 再用 SAE 换掉 PSK 的离线字典攻击面并引入 GCMP-256；口令很弱的 PSK 本身并不安全。","dg":{"k":"flow","n":[{"t":"安全模板 密码 + SSID模板 …"},{"t":"绑给AP组"}],"l":[""]},"c":"[Huawei-wlan-sec-prof] security wpa2 psk pass-phrase cipher pass123 aes\n[Huawei-wlan-vap-prof] ssid-profile test_ssid","o":"VAP profile: office_vap\nAPs: 2 online","j":["psk: 预共享密钥","security wpa2 psk 后的 aes 指定加密套件为 CCMP：不要为兼容老设备再叠加 tkip——TKIP 已可破解且会把协商拉低；PSK 口令按 WPA2 要求至少 8 字符且避免纯字典词","VAP profile 是把 SSID 模板、安全模板、业务 VLAN 绑成一体下发的对象：终端连不上先核对 VAP 引用的安全模板与终端协商的模式是否一致；o 回显 APs: 2 online 表示该 VAP 已在两台 AP 生效"],"u":["办公/访客Wi-Fi分离发放","打印机等哑终端用独立 SSID+PSK 接入"],"w":["双频同名 SSID 下终端粘在 2.4G：现象是支持 5G 的手机始终连 2.4G、速率上不去；机制是同名 SSID 时由终端自主选频段，2.4G 信号更『耐连』、终端不会主动切；判据是 AC 上按终端查关联频段——把 2.4G 侧功率/基础速率调低引导双频终端走 5G，或干脆分 SSID","改 PSK/加密套件后部分终端反复连不上：现象是只有改过配置的 SSID 连不上；机制是终端缓存旧密钥与旧套件，与新配置协商失败（从 TKIP 混合模式改纯 AES 后尤其明显）；判据是终端『忘记网络』重输口令立即恢复——变更后引导用户遗忘重连，避免长期混合套件","访客 SSID 与办公 SSID 隔离失效：现象是访客终端能摸到办公网段；机制是两个 SSID 绑了同一业务 VLAN 或没做二层隔离，SSID 分开只是名字分开；判据是访客终端能 ping 通办公地址——隔离要落在 VLAN 划分加端口隔离/ACL 上，不是落在 SSID 名字上"],"v":"手机搜信号输入密码连入","l":["建安全模板：加密套件与口令强度先定","建 SSID 模板并绑定业务 VLAN","两个模板在 AP 组里下发生效","手机接入后查协商到的协议与速率是否符合预期"]},{"id":"L3","t":"L3. 802.11r 无缝漫游","lab":false,"y":"FT(Fast Transition，即 802.11r)：手机从 AP-A 走到 AP-B 之前先把密钥算好，省掉完整的 802.1X 重认证。切换耗时厂商标称多在几十毫秒级，但各家测量口径不同（有的只计重关联，有的含密钥交换与业务恢复），别把某个具体毫秒数当承诺 —— 验收以自己空口抓包为准。","dg":{"k":"flow","n":[{"t":"AP-A"},{"t":"AP-B"}],"l":["后台交互密钥"]},"c":"[Huawei] wlan\n[Huawei-wlan] ssid-profile name rsn-11r\n[Huawei-wlan-ssid-profile-rsn-11r] dot11r enable            # 缺省即空口 FT\n[Huawei-wlan-ssid-profile-rsn-11r] dot11r enable over-the-ds  # 改走 DS(有线侧)传 FT，与上一行二选一","o":"MAC: 00-11... Current AP: AP-2 Last roam time: 10:00","j":["VRP 里只有 dot11r enable [ over-the-ds ]：不带参数是空口 FT，加 over-the-ds 走分布式系统侧；没有 ft-over-air 这个命令","o 回显 Current AP 与 Last roam time 是验证漫游的两个关键字段：终端走动时 Current AP 应在 AP-1/AP-2 间切换、Last roam time 刷新即发生漫游，配合长 ping 统计丢包才能评估真实体验","FT 要在承载同一 SSID 的一组 AP 上整体生效：只在部分 AP 开启时，支持 11r 的终端漫游到未开的 AP 就退回完整 802.1X 重认证、切回秒级——配置落在 AP 组而不是单台 AP，并确认两端 AP 同属一个可共享密钥的域"],"u":["医院移动查房、企业VoIP语音"],"w":["开启 11r 后个别老机型彻底连不上：现象是只有特定机型无法关联该 SSID；机制是老终端驱动不识别 FT 鉴权套件（AKM），关联协商直接失败；判据是关掉 dot11r 该机型立刻恢复——为老终端单独留一个不开 11r 的 SSID，或先升级终端驱动","漫游频繁但体验更差：现象是终端在覆盖边缘来回切换（乒乓）、Last roam time 高频刷新、丢包集中在边缘位置；机制是两台 AP 信号强度接近且切换门限不合理，终端反复触发漫游，每次切换仍有短暂中断；判据是漫游统计异常偏高且位置固定——调功率/RSSI 门限让覆盖有主次，别指望 11r 单独解决","跨 AC 边界漫游退回慢切换：现象是 AC 内漫游快、跨 AC 明显变慢；机制是 FT 预计算密钥要求两端 AP 在同一控制器/密钥共享域内，跨域无法预计算只能走完整重认证；判据是慢漫游集中发生在 AC 边界——规划同域部署，跨域场景另选漫游方案"],"v":"display station roaming 看漫游次数","l":["两台 AP 按同规划上联同一控制器","在 SSID 模板里开启快速切换","终端长 ping 并在两台 AP 间走动，统计丢包","关掉该功能走同一条路径做对照，比较切换期间的差别"]},{"id":"D1","t":"D1. Python Netmiko 并发配置","lab":false,"y":"Netmiko 的价值不在连 SSH（paramiko 就能），而在替每台设备处理方言：提示符形状、分页是否要关、是否要进特权模式、进配置模式的命令差异。\n- device_type 配错的典型症状不是连不上，而是「等提示符超时」或把回显截断 —— 因为脚本按另一种设备的形状找结束符\n- 读命令与写配置是一类事，保存/提交是另一类：批量下发后不 save/commit，重启就回到改前状态；这是「明明配过」最常见的解释\n- 并发上限由设备侧决定（虚拟终端会话数、SSH 进程数、CPU），不是线程数；给 100 台并发前先按设备能扛的量设闸\n- 每一台都要有超时与异常隔离：一台卡住不能拖整批；失败清单要能单独重跑，而不是整批再来一遍\n- 写操作前先抓一份只读配置做基线，下发后再抓一份比对差异 —— 有了这两份，回滚才是可执行的而不是愿望","dg":{"k":"flow","n":[{"t":"Python脚本"},{"t":"SW1, SW2, SW3"}],"l":["多线程SSH"]},"c":"conn = ConnectHandler(**device)\nconn.send_config_set(['vlan 100', 'quit'])\nconn.save_config()","o":"192.168.1.1 done: vlan 100...","j":["ConnectHandler: 封装的SSH客户端","send_config_set 把命令列表逐条送进配置模式并等提示符：设备对拼错命令回的错误文本，脚本缺省不会停也不会报错——下发后要靠回读状态或检查回显确认，不能只看函数没抛异常","save_config 对应各设备的保存命令（方言由 device_type 决定）：不调用它配置只在运行配置里，设备重启即回滚——批量收尾必须逐台保存并校验"],"u":["全网刷VLAN、改密码、备配置"],"w":["并发跑批时一批设备集体失败：现象是几十台同时下发时超时/连接被 reset，单台串行却正常；机制是设备侧 vty 会话数、SSH 进程数与 CPU 有限，并发把设备打满后新连接被拒、老连接被踢；判据是失败集中在并发高峰、错峰重跑即成功——并发上限按最弱设备的承受力设闸（如 5~10），失败清单单独重跑","脚本显示成功、设备重启后配置消失：现象是『明明配过』重启回到改前；机制是 send_config_set 只进运行配置，没执行保存命令就不落启动配置；判据是运行配置与启动配置比对不一致——每台下发的收尾都要 save/commit 并确认保存成功","一台卡死拖垮整批：现象是脚本总耗时异常、大部分设备没轮到；机制是某台 SSH 半通/认证挂起且未设超时，工作线程被占满后续全堵；判据是卡住那台手工登录也慢——每台强制超时与异常隔离，失败台单独记录、单独重跑，不整批再来"],"v":"去设备上 display vlan 看效果","l":["列设备清单与凭据，凭据走环境变量不入脚本","先用只读命令批量抓一份配置做基线","拿一台验证下发与保存流程是否完整","扩到全量，保留失败清单并只重跑失败的那几台"]},{"id":"D2","t":"D2. Ansible 批量管理网络","lab":false,"y":"无代理(Agentless)自动化工具，用YAML写剧本(Playbook)。network_cli 是**连接插件**（plugins/connection/）而不是模块：它负责建会话，命令由 ansible.netcommon.cli_command / cli_config 下发，厂商差异靠 ansible_network_os 与对应 collection 决定。","dg":{"k":"flow","n":[{"t":"Ansible Playbook.…"},{"t":"ssh"},{"t":"Network Devices"}],"l":["",""]},"c":"tasks:\n  - name: Create VLAN 100\n    ansible.netcommon.cli_config:\n      lines:\n        - vlan 100\n# 主机侧还要 connection: ansible.netcommon.network_cli\n# galaxy 上不存在 huawei_vrp_command；提供旧华为模块的 community.network 集合已归档，教程里的旧写法别照抄","o":"TASK [Create VLAN] ***\nok: [192.168.1.1]","j":["cli_config 下发配置行、cli_command 执行 show 类读命令，两者都要求 connection 用 ansible.netcommon.network_cli：连接变量漏配时报『连接方式不被该模块支持』而不是连不上——报错先查 connection 与 ansible_network_os","教程里出现的 huawei_vrp_command『华为专用执行模块』在 Galaxy 上并不存在（c 注释同款提醒），旧华为模块所在的 community.network 集合已归档——华为 VRP 走 cli_config + ansible_network_os 即可，老教程写法别照抄","o 回显 ok: [192.168.1.1] 只代表任务执行成功返回，不代表配置语义正确：cli_config 不校验命令对错，设备回错误文本任务仍可能 ok——正确性靠回读任务或 changed/diff 确认"],"u":["标准化合规下发、批量巡检采集","配置漂移检测：定时拉现网与基线比对告警"],"w":["凭据明文入库即全网泄露：现象是代码库被拉走后设备口令一并外泄；机制是明文写在 vars 里的密码随 Git 历史永久留存，删提交也删不干净；判据是 git log -p 能搜到密码——凭据一律走 Ansible Vault 加密，泄露过的口令要改密而不是删文件","换台机器跑结果不同：现象是同一 playbook 部分主机连不上或行为不一致；机制是 network_cli 依赖每台的 ansible_connection/ansible_network_os 等变量，散落在 group_vars/host_vars 里漏一台错一台；判据是 ansible-inventory --host 逐台导出核对——连接参数收敛到组层统一管理","重跑失败批次把好设备也刷一遍：现象是重跑后原本正常的设备出现多余配置；机制是 cli_config 每次运行原样下发、不具备幂等，已成功设备被重复写入；判据是任务回显 changed 恒为 changed——失败重跑务必 --limit 到失败主机，对非幂等命令先回读比对再决定下发"],"v":"ansible-playbook --check 做试运行看差异","l":["准备好清单与连接参数（走网络类连接插件）","先跑只读任务，确认每台都能取到状态","写变更任务时先做试运行看差异，再实际下发","失败主机单独限跑，别整批重放"]},{"id":"D3","t":"D3. Git 配置版本控制与回滚","lab":false,"y":"配置入库把「谁在什么时候改了什么」从聊天记录变成可核对的历史，价值全在 diff 与回滚点。\n- 变更闭环是三段：PR 审查（人判断意图）→ CI 校验（语法、策略断言、渲染结果）→ 合并后由流水线下发；直接 push 到现网等于绕过后两段\n- revert 与 reset 不是一回事：revert 向前追加一个反向提交，历史完整可审计；reset 加 force push 改写历史，现网环境里不要做\n- 密钥与口令一旦进了历史就删不干净：正确处置是立即改密钥并清理历史，而不是指望 git 抹除\n- 回滚点要具体到一个 commit 或 tag，并与割接窗口对齐 —— 「回到上周那版」不是可执行指令\n- 漂移检测是定时拉现网配置与仓库基线比对再告警：先能发现，再谈自动纠偏；上来就自动改会把审查环节拆掉\n- 判据很朴素：不登录任何设备，能否回答「现在现网应该是什么、上次是谁改的、出问题回到哪一版」","dg":{"k":"flow","n":[{"t":"V1.0 稳定版 <- git d…"},{"t":"V2.0 异常版"}],"l":[""]},"c":"git init configs && cd configs\ngit add SW-01.cfg && git commit -m \"add SW-01 base\"\ngit diff HEAD~1 -- SW-01.cfg\ngit log --oneline -- SW-01.cfg\ngit revert HEAD --no-edit      # 生成一次反向提交（保留历史）\ngit restore --source=HEAD~1 -- SW-01.cfg   # 只改工作区，不动历史\n# git checkout HEAD~1 -- file 会连暂存区一起改，想“只看不改”别用它","o":"diff --git a/SW-01.cfg b/SW-01.cfg\n--- a/SW-01.cfg\n+++ b/SW-01.cfg\n@@ -12,7 +12,7 @@\n- ip address 10.0.1.1 255.255.255.0\n+ ip address 10.0.1.100 255.255.255.0","j":["git diff: 对比文件差异","git revert HEAD --no-edit 的 --no-edit 跳过提交信息编辑器直接生成反向提交，脚本化时不能省，否则卡在交互界面；revert 可一次撤多个提交，按从新到旧的顺序","o 回显 diff 的 @@ -12,7 +12,7 @@ 是 hunk 头：表示旧文件从 12 行起 7 行——审查配置变更要逐 hunk 看上下文，确认改动只落在目标行，而不是只看文件名"],"u":["NetDevOps基石，审计与快速故障恢复"],"w":["密钥进了历史删不干净：现象是发现口令在旧提交里，删文件再提交以为已处理；机制是历史提交仍可被 checkout，远程库与克隆副本同样留存；判据是 git log -p / git grep 在历史里搜得到敏感串——立即改密钥使旧泄露作废，再清理历史，顺序不能反","reset 加 force push 抹掉同事历史：现象是一次『回滚』后他人提交消失、拉取冲突满天飞；机制是 reset 改写分支历史、force push 覆盖远端，他人基于旧史的提交成孤儿；判据是本地 reflog 能找回而远端已丢——现网仓库禁止 force push，回滚一律用 revert 前向反向提交","git 里回滚了、设备还是新配置：现象是仓库已完成 revert、现网行为没变；机制是 Git 只管仓库内容，回滚后还要把旧配置重新渲染下发到设备，下发环节没跑或只跑一半；判据是设备运行配置与仓库目标版本 diff 不为空——回滚闭环三步：仓库回滚、重新下发、回读比对"],"v":"先 git log 能查到本次变更、再 git diff 确认只动目标行，才允许把配置下发设备；回滚后用 git status 确认工作区干净。","l":["把现网配置抓进仓库并提交首个基线","模拟一次误改：diff 确认只动了目标行","用反向提交回滚并重新下发，验证确实回到旧态","再抓一次现网与仓库比对，确认没有漂移"]},{"id":"W1","t":"W1. NetDevOps 进阶: GitOps 宣告式变更","lab":false,"y":"将网络配置写成 YAML 存入 Git。走 Pull Request 审核，CI 自动 Dry-Run，合并后自动推送现网。\n自动化框架选型：Nornir(Python 原生，并发多线程/协程，适合复杂逻辑)；Netmiko(单设备驱动库，Nornir 底层传输)；Ansible(YAML 声明式，生态大但复杂逻辑受限)。大规模并行刷配置优先 Nornir。","dg":{"k":"flow","n":[{"t":"Git Repo"},{"t":"CI Pipeline"},{"t":"Switches"}],"l":["PR Review","Ansible"]},"c":"git checkout -b feature/vlan200\ngit commit -m 'Add VLAN 200'\ngit push origin feature/vlan200","o":"PR #12 Created. Running CI checks...","j":["将 Git 作为现网唯一真理源 (Single Source of Truth)","git push origin feature/vlan200 推的是分支：评审只发生在分支合向主干的 PR 上，主干直推会被分支保护拦下——一个分支对应一次变更，分支名当变更单号用","o 回显 Running CI checks 之后要真的有人或脚本看结果：CI 能拦住合并靠的是分支保护规则强制，不是 CI 自己能拦——只搭 CI 不设保护规则，门禁形同虚设"],"u":["无人值守安全变更","配置审计与一键回滚","团队变更的 PR 评审与审批留痕"],"w":["变更不进 PR 直接 CLI 改现网：现象是设备配置与仓库对不上、事后说不清谁改的；机制是 CLI 直改绕过 PR 审查与 CI 校验，真理源被架空；判据是漂移检测发现现网多出仓库没有的配置——紧急修复也走『改仓库、快速 PR、流水线下发』，不开直改口子","PR 合并绿灯但设备没变成预期配置：现象是 CI 通过、现网未生效或下发出错没人知道；机制是 CI 校验与下发是流水线的两个阶段，下发失败告警没配或被吞；判据是流水线日志里下发阶段的成败加设备回读比对——合并后的下发必须带失败告警与回读验证","Git 沦为第二份真相：现象是仓库一套配置、设备另一套，改仓库不生效；机制是仍有变更走手工改设备或其他脚本，两条路径渐渐分叉；判据是定时拉现网与仓库 diff 出现非本次变更的差异——所有变更路径收敛到同一条流水线，其余通道只读"],"v":"查看 CI 审计日志及 git log","l":["创建分支修改 Jinja 模板","发起 PR 触发自动化部署","合并前后各跑一次校验，确认可渲染且差异符合预期","故意提一个改错默认路由的分支，看门禁能否拦住"]},{"id":"W2","t":"W2. NetDevOps 进阶: CI/CD 自动化集成 (Batfish)","lab":false,"y":"Batfish 把各厂商配置、拓扑与转发表达式编译成一个形式化网络模型，然后离线回答问题：这条流通不通、被哪条规则拦、路由会被哪条更好前缀抢走、某台设备挂了是否仍可达。\n- 它算的是配置的等价语义，不是抓包：所以擅长「变更前门禁 + 变更后回归对比」，把可达性断言放进 CI，失败就阻断下发\n- 不要指望它替代测试环境：真实丢包、时延、MTU 黑洞、CPU 限速、会话表竞争、驱动缺陷都不在模型里 —— 它回答「按配置应该怎样」，不回答「硬件现在怎样」\n- 输入必须完整：模板渲染后的真实配置、缺省行为依赖、被忽略的隐藏对象都要进模型，输入缺一角结论就会自信地错\n- 断言要写成不变式而不是快照：「web 到 db 的 5432 可达」「任何 untrust 不能到 mgmt」比保存一坨期望输出更好维护\n- 与配置仓库配合：同一次 PR 里既改配置又改断言，才不会出现「模型和现实各走各路」","dg":{"k":"flow","n":[{"t":"Git PR"},{"t":"Batfish 引擎"},{"t":"断言检查","s":"允许80端口?"},{"t":"Approve"}],"l":["","",""]},"c":"bf = Session(host='localhost')\nbf.init_snapshot('./configs')\nresult = bf.q.reachability(headers=HeaderConstraints(dstPorts='80')).answer()","o":"Flows reachable: 100%. All assertions PASSED.","j":["在内存中构建设备数据平面","bf.init_snapshot('./configs') 把整目录配置加载为一次快照：快照是『某时刻全部配置』的静态切片，设备清单或拓扑变了要重建快照，否则分析的还是旧网络","q.reachability 配合 HeaderConstraints（dstPorts='80' 等）定义查哪些流量：返回按配置推演的可达性结果，PASS 只覆盖断言范围内——断言没写的路径不在保证之内"],"u":["高危路由/ACL 变更前离线推演","安全分区隔离的合规验证（可达性证明）"],"w":["部分设备解析失败、答案不可信：现象是初始化快照后解析状态有告警、涉及这些设备的结论异常；机制是 Batfish 按厂商语法解析，非标准 CLI/模板残句不认识会退化或忽略；判据是快照的解析告警清单非空——先修解析告警再信答案，带病快照会自信地错","模型说可达、现网却断：现象是推演结论与现网不符；机制是快照不完整（缺设备配置、依赖的缺省行为未声明），模型按残缺信息推演；判据是快照设备清单与现网清单比对缺了谁——快照必须是渲染后的真实配置全集","断言退化成快照测试、CI 长期全绿：现象是配置错了 CI 依然过；机制是断言写成『保存上次输出当期望』，错误被一并固化进期望值；判据是断言只做输出比对、说不出『为什么』——改写成不变式（如『untrust 不可达 mgmt』『web 到 db 5432 可达』）"],"v":"查看 CI 测试断言报告","l":["编写 Batfish 断言脚本","将其嵌入 GitHub Actions","把断言失败设成流水线的阻断条件","改一条 ACL 让断言转红，确认下发真的被拦住"]},{"id":"W3","t":"W3. NetDevOps 进阶: 配置模板化 (Jinja2 & Nautobot)","lab":false,"y":"模板化的真正收益不是「少写几行」，而是同一份逻辑乘上每台设备的差异，差异集中到数据里。\n- 数据必须来自一个可信源头（IPAM/CMDB/资源台账）。若数据还在人脑和表格里，模板只是把复制粘贴自动化，错误照旧\n- 变量要有口径：命名统一、必填校验、缺省值显式；渲染前先校验数据，比渲染后肉眼核对输出可靠\n- 平台差异集中管理：把「思科/华为写法不同」做成可复用的条件片段，不要让 if 语句散落在每个模板里\n- 下发前必须能预览与 diff —— 渲染结果不可读，就等于放弃了对自动化的审查权\n- 模板与数据各自入库、各自有版本与回滚点；改模板影响的是全网，回归范围比改一台大得多\n- 从台账系统拉数据要处理分页与关系字段（子网/设备/接口的关联），一次性查询很容易只拿到第一页","dg":{"k":"stack","n":[{"t":"Jinja2 模板 + NetBo…"}]},"c":"template = Template('vlan {{ vlan_id }}\\n name {{ vlan_name }}')\nprint(template.render(vlan_id=10, vlan_name='WEB'))","o":"vlan 10\n name WEB","j":["剥离业务数据与逻辑配置","{{ vlan_id }} 是占位符变量，渲染时按名从传入字典取值；模板里还能用 {% if %}/{% for %} 承载条件与平台差异片段——平台写法差异集中到模板层管理，别让判断散落各处","c 里 Template(...) 是把模板写成脚本内字符串：工程化做法是模板独立成文件、用 Environment + FileSystemLoader 加载——模板与数据各自入库、各自有版本与回滚点"],"u":["千台设备标准化开局","数据驱动运维","同一份数据渲染多厂商 CLI，收敛平台差异"],"w":["改一行模板全网返工：现象是模板缩进/循环改错后批量渲染把错配置铺满全网；机制是模板逻辑乘上设备数量，一个 bug 乘上台数；判据是渲染产物抽检加与现网的全量 diff——模板变更先只渲染不发送，抽检通过再灰度小批设备","变量没传渲染成空配置：现象是输出里出现『vlan』后面空白、设备报命令错误；机制是 Jinja2 缺省把未定义变量渲染为空串不报错，变量名拼错静默通过；判据是渲染输出里有孤立关键字或空行——用 StrictUndefined 让缺失变量在渲染期抛错，渲染后再跑语法校验","台账数据脏、配置跟着错：现象是渲染出的接口描述/IP 与台账不符或渲染报错；机制是数据源字段缺失、格式不齐、分页只拉到第一页就下结论；判据是渲染前的数据校验（必填、格式、关联字段完整性）是否通过——先验数据再渲染，模板不背数据的锅"],"v":"对比生成的 CLI 与设备运行配置","l":["定义 YAML 变量文件","编写 Jinja2 渲染脚本","渲染结果与现网配置做差异比对，确认只有目标行变化","只改数据字段重渲染，验证模板与数据确实解耦"]},{"id":"LAB3","t":"🎯 阶段三综合实验：广域网与安全自动化","lab":true,"y":"**实验目标**：打通跨地域分支并完成基础安全准入，最后用 Python 收割全网配置。\n**拓扑**：总部 (Easy-IP+AC) --- IPsec VPN --- 分支 (AP+802.1X)","dg":{"k":"flow","n":[{"t":"总部 FW"},{"t":"VPN"},{"t":"分支 FW"}],"l":["",""]},"c":"python backup_all.py","o":"Switch-HQ: Config saved to git.\nFW-Branch: Config saved to git.","j":["检验全局架构整合能力","验证脚本并发健壮性"],"u":["面试上机考核","大中型项目结项复盘"],"w":["防火墙/隧道要放通 CAPWAP 的 IANA 端口：控制隧道 UDP 5246、数据隧道 UDP 5247（RFC 5415）；若再叠 IPsec，还要允许 ESP（协议号 50）或 NAT-T 的 UDP 4500"],"v":"执行 python 脚本，查看 Git 仓库是否有两端设备的 config 提交","l":["手工拉通总部与分支的 IPsec VPN","让 AP 跨广域网注册到总部的 AC","编写 Netmiko 脚本批量抓取设备版本与路由"]}]},{"id":"p-4","title":"阶段四：云原生与高级前沿","short":"云原生","icon":"i-cloud","lvl":4,"color":"rose","desc":"VXLAN / EVPN、IPv6 与 BGP unnumbered、SNMP 与 gNMI/YANG 遥测、K8s CNI/Ingress/Gateway API、eBPF、可观测性与 SRE","modules":[{"id":"F1","t":"F1. VXLAN 与 BGP EVPN","lab":false,"y":"VXLAN 解决两件事：二层隔离数量不够，以及大二层跨三层的扩展性 —— 它把以太网帧封进 UDP，用三层网络承载二层连通。\n- 24 位的 VNI 把 4096 个 VLAN 扩到千万级隔离域；封装带来额外开销，underlay 的 MTU 要相应放大，否则出现「小包通、大包不通」\n- 数据面端口是固定的 UDP 号（常见 4789），中间防火墙拦掉它会造成「路由全通但 MAC 学不到」的怪现象\n- 控制面有两条路：靠泛洪学 MAC（简单，规模一大就失控）与 EVPN（用 BGP 传递 MAC/IP 路由，控制面已知单播，支持地址解析抑制、多归属与分流）\n- EVPN 的价值在规模化场景：多归属用以太网段标识与哈希让 AP 接两台 PE，ARP 可由任一 PE 应答（网关 anycast），不必再靠泛洪\n- 判据分层：先确认 underlay 可达与封装端口放行 → VNI 与 VTEP 映射是否一致 → EVPN 路由是否收到并安装","dg":{"k":"flow","n":[{"t":"VM1"},{"t":"VXLAN隧道"},{"t":"VTEP2"},{"t":"VM2"}],"l":["VTEP1","",""]},"c":"[Huawei] bridge-domain 10\n[Huawei-bd10] vxlan 100\n[Huawei] evpn vpn-instance EVRF1 bd-mode\n[Huawei-evpn-instance-EVRF1] route-distinguisher 100:1\n[Huawei] interface Nve1\n[Huawei-Nve1] source 1.1.1.1\n[Huawei-Nve1] vni 100 head-end peer-list 2.2.2.2   # 两条独立命令：source 定建隧道的源地址，vni 行定 VNI 与对端列表\n[Huawei] bgp 100\n[Huawei-bgp] l2vpn-family evpn\n[Huawei-bgp-af-evpn] peer 2.2.2.2 enable\n[Huawei-bgp-af-evpn] peer 2.2.2.2 advertise encap-type vxlan","o":"display vxlan tunnel 的列含义：Source / Destination / VNI / Tunnel ID / State（各版本表头不同，此处只记字段不记逐字排版）","j":["vni: 全局唯一的24位虚拟网络标识","advertise encap-type vxlan 必须在 l2vpn-family evpn 视图下配置，且先 peer enable 再下发","参考标准：RFC 7432(EVPN，只定义 Type-1~4) + RFC 9136(Type-5 IP Prefix Route)","整体设计见 RFC 8365","Tunnel ID 与 State：Tunnel ID 是本机生成的隧道索引，仅在本机有意义；State=up 只说明两端 VTEP 地址可达，不保证对端已把该 VNI 绑定到同一桥接域——还要到对端核对 vni 与 BD 的绑定","vni 100 head-end peer-list 2.2.2.2：头端复制（ingress replication）——本端把广播/组播/未知单播逐份单播复制给列表内每个 VTEP，相当于用静态列表替代组播复制；列表里漏一个 VTEP，它下面的主机就收不到 BUM 流量"],"u":["数据中心多租户网络、大跨度VM热迁移","数据中心互联（DCI）：用 EVPN/VXLAN 承载跨站点二层/三层专线互通"],"w":["MTU 不匹配：现象是隧道 up、小包 ping 通但大包传输卡死或反复分片丢包——VXLAN 外层新增 50 字节（外层以太 14 + IP 20 + UDP 8 + VXLAN 头 8），要透传 1500 的内层帧，underlay MTU 至少 1550；判据：端到端逐跳核对 MTU，生产直接配 9100/9216 巨型帧，别只调到 1600 就当安全","封装端口被拦：现象是 VTEP 之间互 ping 全通（underlay 路由正常）但跨 VTEP 二层不通、MAC 学不到——VXLAN 数据面走固定 UDP 4789，中间防火墙/安全组默认不放行；判据：在 VTEP 侧抓包看封装报文「有出无回」，或 display vxlan tunnel 里 State 一直 down","静态 peer-list 漏配：现象是部分主机互 ping 通、部分不通，且每次新增 VTEP 后故障面扩大——head-end 复制列表是手工静态配置，扩容没人自动补；判据：对每个 VNI 把 peer-list 与全网 VTEP 清单逐一比对，EVPN 场景应改由 Type-3 路由自动发现对端","EVPN 邻居 up 但学不到路由：现象是 BGP 邻居 Established、display bgp l2vpn evpn 却看不到对端路由——l2vpn-family evpn 地址族未使能或没配 advertise encap-type vxlan，路由收下了也无法按 VXLAN 封装生成隧道；判据：先看地址族下路由计数大于 0，再核对收到的路由是否携带封装扩展团体属性"],"v":"display bgp l2vpn evpn 查路由","l":["先把 underlay 跑通：隧道端点间可达且 MTU 有余量","建桥接域与 NVE 接口，绑定 VNI 与对端列表","用 EVPN 建邻居并宣告对应路由","跨端点 ping 同网段地址，看 MAC 是泛洪学的还是已知单播"]},{"id":"H1","t":"H1. IPv6 地址与 NDP 机制","lab":false,"y":"128位地址。去掉了ARP和广播，全靠NDP(ICMPv6)做邻居发现、SLAAC(无状态地址自动配置)。\nSLAAC 流程：主机发 RS → 路由器回 RA(含前缀/前缀长度/默认网关=自身链路本地地址)；RA 中 M=1 表示用 DHCPv6 要地址、O=1 表示用 DHCPv6 要其他配置(如 DNS)。攻击防护：RA 可伪造劫持网关，需 RA Guard 或禁用不必要的 RA。","dg":{"k":"stack","n":[{"t":"2001","s":"0db8::1/64 公网 fe80:…"}]},"c":"[Huawei-GE0/0/0] ipv6 enable\n[Huawei-GE0/0/0] ipv6 address 2001:db8::1/64","o":"IPv6 Address   MAC Address       State\n2001:db8::2    00-11-22...       REACH","j":["REACH: 邻居可达状态","NDP 状态机五态：INCOMPLETE→STALE→DELAY→PROBE→REACH——STALE 是被动学习后的正常中间态，有流量才触发验证，邻居表大量 STALE 不等于故障","/64 前缀长度不是随手填的：NDP（NS/NA、DAD）与 SLAAC 都按 /64 边界工作，接口配成非 64 位前缀时无状态自动配置失效","参考标准：RFC 4861(NDP/RA) · RFC 4291(IPv6 地址架构)"],"u":["物联网、下一代互联网演进"],"w":["接口忘使能 IPv6：现象是接口视图下敲 ipv6 address 直接报错进不去——VRP 要求接口先 ipv6 enable 才接受地址配置；判据：配置被拒时先查接口使能状态，别去怀疑地址格式","RA 伪造劫持网关：现象是内网主机默认网关莫名变成陌生链路本地地址、流量被中间人截走——NDP/RA 无认证，任何同网段主机都能发 RA 宣称自己是路由器；判据：在主机抓 ICMPv6 RA 或查默认路由来源，接入交换机口上配 RA Guard 过滤","双栈下 v6 优先的「半故障」：现象是业务时通时断、连接迟缓——地址选择优先 v6，而 v6 学到了 RA 却不通：未实现 Happy Eyeballs 的客户端要等 v6 超时才回退 v4，卡几秒；实现 HEv2（RFC 8305）的客户端 250ms 后并发赛跑 v4/v6，仅短暂延迟；判据：分别对 v4/v6 目标 ping 对比，只有 v6 不通时查 RA 下发与上游路由"],"v":"ping6 测试，display ipv6 neighbors","l":["两台直连配全球单播，确认链路本地地址自动生成","互 ping 后查邻居表，看解析到的 MAC 是否正确","改错前缀制造不通，观察邻居表停在哪一步","对照 v4 的 ARP，说清 NS/NA 与「谁该应答」的差别"]},{"id":"H2","t":"H2. IPv6 OSPFv3 动态路由","lab":false,"y":"基于链路而不是子网运行，邻居用 IPv6 链路本地地址(fe80)建立。\nRouter-ID 仍是 32 位、以 IPv4 点分格式显示（RFC 5340），但怎么取得由实现决定：华为 VRP 必须手工 router-id，其它实现可自动选举 —— 别写成通用规则。\nOSPFv2(v4) 与 OSPFv3(v6) 默认各跑各的进程；RFC 5838 给 OSPFv3 加了地址族与实例号，同一个 OSPFv3 进程就能同时承载 IPv4 和 IPv6 路由，「绝不可混用」是旧说法。","dg":{"k":"flow","n":[{"t":"R1 fe80","s":":1 <"},{"t":"OSPFv3"},{"t":"R2 fe80","s":":2"}],"l":["",""]},"c":"[Huawei] ospfv3 1\n[Huawei-ospfv3-1] router-id 1.1.1.1\n[Huawei-GE0/0/0] ospfv3 1 area 0","o":"OSPFv3 Process 1, Neighbor ID: 2.2.2.2\nState: Full","j":["OSPFv2 可自动选举 Router-ID；OSPFv3 必须手工指定 IPv4 格式 Router-ID，否则进程无法启动（华为 VRP 必配，属实现差异而非协议通用规则）","ospfv3 1 area 0：接口下宣告——OSPFv3 没有 network 命令，按接口使能而非按网段宣告；多链路时漏配某条接口，邻居仍能经其他链路 Full，但该链路网段的路由学不到","State: Full 表示数据库同步完成；邻居卡在 ExStart/Exchange 多为两端接口 MTU 不一致，卡在 Init 多为单向可达","邻居地址显示为 fe80 链路本地：OSPFv3 按链路运行、报文用链路本地地址交互，这是正常现象不是配置错误","参考标准：RFC 5340(OSPFv3) · RFC 5838(OSPFv3 地址族/实例扩展)"],"u":["纯IPv6网络内的动态路由互通","双栈改造中用单一 OSPFv3 进程同时承载 IPv4/IPv6 路由（RFC 5838 地址族模式）"],"w":["多进程宣告配串：现象是同一接口起多个 OSPFv3 进程后某网段路由缺失或邻居只起一半——宣告命令按「进程号+接口」下发，配进错误进程等于把网段宣告到错误实例；同一链路两端除进程号（本地有效，无需一致）外，实例号必须一致，否则互不相认；判据：逐接口核对 ospfv3 <进程号> area 与两端实例号，缺哪段路由查哪段接口","Router-ID 冲突：现象是路由表反复翻动、LSA 频繁刷新，严重时邻居起不来——Router-ID 在区域内必须唯一，两台设备撞号会互相刷新对方 LSA；判据：日志出现 router-id 冲突提示或邻居状态反复从 ExStart 掉 Down 时，全网核对 32 位 Router-ID","接口没生成链路本地地址：现象是进程起来但邻居一直 Down——OSPFv3 Hello 走链路本地地址，接口未 ipv6 enable 时没有链路本地地址，Hello 根本发不出；判据：display ipv6 interface 确认 Link-local address 存在，再排查邻居"],"v":"display ipv6 routing-table 查路由","l":["接口先启用 v6，确认链路本地地址就绪","起 v6 路由进程，按需处理 router-id（厂商差异）","宣告接口，看邻居从初始态走到完全邻接","对照 v4：确认它是按链路而非按网段建邻居"]},{"id":"H3","t":"H3. IPv6 过渡: 6to4与NAT64","lab":false,"y":"6to4：把v6包塞进v4里穿越旧网。\nNAT64：v6纯客户端访问v4老服务器，通过协议/地址翻译(类似IPv4 NAT)。\n选型：6to4 用于 IPv6 孤岛间互联(需公网 IPv4 且协议号 41 可达)；NAT64 用于 IPv6-only 客户端访问 IPv4 服务(需配合 DNS64 合成 AAAA 记录)。","dg":{"k":"multi","rows":[{"n":[{"t":"IPv6孤岛"},{"t":"IPv6孤岛"}],"l":["IPv4隧道"]},{"n":[{"t":"IPv6终端"},{"t":"IPv4服务器"}],"l":["NAT64"]}]},"c":"[Huawei-Tunnel0] tunnel-protocol ipv6-ipv4 6to4\n[Huawei] nat64 enable","o":"Tunnel0 current state: UP\nProtocol: IPv6-IPv4 6to4","j":["6to4前缀固定含公网v4地址：站点前缀形如 2002::<v4地址十六进制>::/48（聚合在 2002::/16 下）——看到 2002: 开头的地址可反推隧道端点的公网 IPv4；端点公网地址一变，前缀就得跟着变","tunnel-protocol ipv6-ipv4 6to4：封装在 IPv4 协议号 41 里，不是 TCP/UDP 端口——四层 ACL 与普通 NAT 管不到它，中间链路放行协议 41 是通断的先决条件","nat64 enable 只是设备级开关：还需配 NAT64 地址池与前缀（常见 64:ff9b::/96，RFC 6052 知名前缀）；v 字段里对合成地址做 telnet 测试，本质就是把 v4 地址嵌入 /96 前缀构造出 v6 目标"],"u":["企业逐步演进IPv6过程中的业务平滑过渡","IPv6-only 移动终端访问存量 IPv4 互联网（464XLAT 类场景）"],"w":["NAT64 不配 DNS64：现象是 v6 客户端用 IP 直连 v4 服务通、用域名全部失败——DNS 里的 A 记录没有 v6 地址，纯 v6 主机无从路由，需要 DNS64 用前缀合成 AAAA；判据：对目标域名解析看是否返回 NAT64 前缀段的地址，有合成记录仍不通才去查 NAT64 本身","协议 41 被中间链路丢弃：现象是两端隧道接口都 up、v6 孤岛间却不通——6to4 封装是 IPv4 协议号 41，运营商出口/企业 NAT 对非 TCP/UDP 协议常默认丢弃；判据：两端抓包看有没有协议号 41 的 IPv4 包进站，没有就查中间链路而不是隧道参数","公共 6to4 中继已弃用：现象是照老文档配 6to4 中继（IANA 已回收的公共 anycast 中继地址）完全不通——公共中继因安全问题被 IETF 弃用（RFC 7526）；判据：选型阶段就排除「6to4+公共中继」组合，改用 6rd 或双栈/NAT64，老文档只当原理参考"],"v":"telnet 64:ff9b::8.8.8.8 测NAT64转换","l":["纯 v6 孤岛两端各建一条隧道","确认隧道起来后 v6 路由可达","配 NAT64 与配套的地址合成，用 v6 客户端访问 v4 目标","再对比全双栈方案，说明过渡方案的取舍与退场条件"]},{"id":"I1","t":"I1. SNMP 原理与配置","lab":false,"y":"网管拉取设备数据的协议。v1/v2c 明文传输(只配团体名)；v3 把认证和加密做成三档可选（RFC 3414 USM）：noAuthNoPriv / authNoPriv / authPriv —— 不配 privacy 仍是明文，所以「v3 一定加密」是误解，生产要显式强制 authPriv。\n认证(authentication)与加密(privacy)分离：authentication-mode 只验身份，privacy-mode 才加密报文。","dg":{"k":"flow","n":[{"t":"NMS监控平台"},{"t":"网络设备Agent"}],"l":["UDP 161 GET"]},"c":"[Huawei] snmp-agent sys-info version v3\n[Huawei] snmp-agent usm-user v3 admin authentication-mode sha cipher <pwd>\n[Huawei] snmp-agent usm-user v3 admin privacy-mode aes128 cipher <pwd>","o":"SNMP version running: SNMPv3","j":["cipher: 本地存储加密","认证与加密是两个独立配置项，只配认证不配 privacy-mode 时报文仍明文","sha / aes128：认证与加密的算法分开指定、口令也分开——网管侧把两把口令填反是最常见的对接失败，表现为抓取超时或 USM 统计里认证错误计数增长","sys-info version v3 只声明设备支持的版本，v1/v2c/v3 可以并存使能——对接排障时让网管侧固定版本探测，避免静默回退到明文 v2c"],"u":["Zabbix等主流网管软件对接采集"],"w":["v2c团体名设成public极易被黑客拖库：现象是设备上线不久就被扫描出接口表、系统信息被批量读走——v1/v2c 的团体名即明文口令且全程明文传输，public 是扫描字典必备的默认值；判据：拿 snmpwalk -v 2c -c public 试探自己的设备，通了就必须改名并限源，生产直接上 v3 authPriv","authNoPriv 冒充安全级别：现象是自查认为已上 v3、链路抓包里数据却仍可读——v3 三档安全级别里不配 privacy 就是 authNoPriv，payload 明文、只有认证字段参与校验；判据：display snmp-agent usm-user 看用户级别是否为 authPriv，或在链路抓包确认 payload 不可读","全量轮询拖垮设备：现象是网管接入后设备 CPU 飙高、管理面丢包抖动——一次 walk 完整接口表要遍历上千个 OID，短周期高频轮询让设备一直服务于采集；判据：只订阅用到的 OID 子树、采集间隔放宽到分钟级，把 CPU 曲线与轮询时间窗对齐核实"],"v":"电脑端用snmpwalk测试抓取数据","l":["设备上开启只读团体名先跑通基本抓取","限制可访问源，确认不配源时谁能抓","抓系统信息与接口表，核对 OID 层次","切到 v3 并配到认证加加密档，对比明文抓取的差别"]},{"id":"I2","t":"I2. Prometheus + Grafana","lab":false,"y":"Prometheus 是拉模型：按周期去各目标的 HTTP 端点取指标，配合标签形成多维时间序列 —— 采集成功与否本身也是一个指标。\n- SNMP Exporter 是转换器：它把 SNMP 轮询变成可被抓取的指标；Prometheus 抓的是 exporter，不是设备。targets 写设备地址，再用重定向规则把目标塞进查询参数、把真正拨号的地址换成 exporter\n- instance 标签来自被查询的设备地址，所以它的值一定是完整设备地址；看到裸 IP 尾段说明重定向配错\n- 网卡字节数/包数是计数器，必须用求速率或求增量的函数处理，窗口要覆盖足够的抓取次数；计数器位宽回绕与接口重编号会让曲线跳变\n- 基数是这类监控的主要成本：每接口、每队列、每邻居都出一条序列，大屏看着爽、存储与查询买单\n- 判据顺序：先确认抓取本身成功（目标状态为 1），再核对重定向后的标签，最后才怀疑查询语句","dg":{"k":"stack","n":[{"t":"Grafana大屏","s":"<- Prometheus <- SN…"}]},"c":"scrape_configs:\n  - job_name: 'snmp_switches'\n    metrics_path: /snmp\n    static_configs:\n      - targets: ['192.168.1.1']    # 被监控设备，不是 exporter\n    params:\n      module: [if_mib]\n    relabel_configs:\n      - source_labels: [__address__]\n        target_label: __param_target\n      - source_labels: [__param_target]\n        target_label: instance\n      - target_label: __address__\n        replacement: 127.0.0.1:9116   # 真正被拨号的地址换成 exporter","o":"（示意，非 exporter 逐字输出）snmp_sysName{instance=\"192.168.1.1\", snmp_sysName=\"Core-SW\"} 1\n# instance 由 __param_target 注入，一定是完整设备地址；字符串型 OID 的信息在标签里，样本值恒为 1","j":["job_name: 拉取任务名","metrics_path 与 params.module：/snmp 是 exporter 的查询入口，module（如 if_mib）决定抓哪一组 OID——模块名写错时要么报错要么抓回来没有接口指标","relabel 三步各管一件事：__address__→__param_target 把设备地址塞进查询参数；__param_target→instance 让标签保留完整设备地址；最后把 __address__ 换成 exporter 才决定真正拨号对象——顺序颠倒 instance 就不再是设备地址","采集周期与速率窗口：rate/increase 这类函数的窗口必须覆盖至少两个样本点，不足则返回空、图上断点；建议窗口取抓取周期整数倍或 ≥4 倍间隔以稳定样本数，非整数倍也能计算，只是结果波动"],"u":["替代传统老旧NMS，实现现代化可观测大屏"],"w":["拉取频率太高(如1秒1次)会把交换机CPU拉满：现象是接入监控后交换机 CPU 持续升高、管理面响应变慢——SNMP 全表 walk 是重查询，把抓取间隔压到秒级等于让设备反复做全表扫描；判据：间隔放宽到 30s 以上（常见 1m），把 CPU 曲线与抓取时间戳对齐核实","instance 标签被换成 exporter 地址：现象是 Grafana 里同一设备出现两条曲线或 instance 显示 127.0.0.1:9116——relabel 顺序写反，__address__ 先被换成 exporter，设备地址没来得及进 __param_target 与 instance；判据：查样本标签，instance 必须是完整设备地址，出现 exporter 地址即顺序错了","计数器跳变造成假尖峰：现象是速率图偶发巨大尖峰后归零——32 位计数器回绕或设备重启/接口重编号让计数值跳变，速率窗口覆盖跳变点就被放大成假尖峰；判据：尖峰时间点核对设备 uptime 与接口编号是否变化，必要时缩短窗口或按重置容忍处理"],"v":"去:9116端口看指标是否生成","l":["起转换器并配好面向设备的抓取参数","抓取端配重定向：目标→查询参数→实际拨号地址","确认抓取成功、实例标签是完整设备地址","用一个计数器画速率图，验证求导窗口用法是否正确"]},{"id":"I3","t":"I3. Syslog 集中日志","lab":false,"y":"集中日志的链路是四段，任何一段没验证都会「以为在收」：设备发出 → 中间放行 → 接收端落盘 → 索引可检索。\n- 设备侧不是一句开启就完：日志先按设施与级别过滤，再选通道外送；级别设得过粗会把有用信息一起丢掉，过细则打爆带宽\n- UDP 无确认，突发时丢的是告警本身，所以「没收到日志」不等于「没发生」；要可靠性就换面向连接或带确认的传输，并处理断线重连\n- 时间戳要分清设备生成时间与服务器接收时间：两端不同步（缺 NTP）会让跨设备关联完全失效，这是集中日志最隐蔽的坑\n- 接收端要先开监听并显式配置落盘模板与目录，直接对目录 tail 是没有意义的\n- 保留周期常被合规要求约束（国内常见口径是网络日志留存不少于六个月），先确认口径再定存储规模\n- 判据：在设备上打一条可识别的测试消息，看它在哪一段消失，而不是先怀疑采集器","dg":{"k":"flow","n":[{"t":"设备群"},{"t":"ELK集群"}],"l":["Syslog UDP 514"]},"c":"[Huawei] info-center enable\n[Huawei] info-center loghost 192.168.1.100 facility local6","o":"Loghost: 192.168.1.100\nChannel: loghost, level: debugging","j":["loghost: 指向收集器IP","facility local6：给本设备日志打 facility 标记，接收端按 facility 分流落盘——多台设备共用一个收集器时不区分 facility，所有日志混进同一文件、没法按设备检索","Channel: loghost, level: debugging：这是外送通道的级别过滤——debugging 是最详细的一级，设成它意味着全级别外送，链路与磁盘压力最大；既要信息又要控制量，外送常用 informational"],"u":["等保合规日志留存、全网故障统一检索"],"w":["Debugging级别日志海量，可能撑爆服务器磁盘：现象是收集端运行数月后磁盘写满、检索服务挂掉——级别全开加落盘无轮转，日志量远超预估；判据：接入前先定轮转与保留策略，核对每日增量与容量余量","两端时钟不同步：现象是跨设备关联同一事件时时间戳对不上、排障时序全乱——日志时间戳由设备本地生成，缺 NTP 时同一事件在两台设备上能差几分钟；判据：全网统一 NTP 源，抽查设备生成时间与服务器接收时间的偏差应在秒级以内","UDP 静默丢日志：现象是偶发告警在收集端找不到、事后复盘才发现证据缺失——syslog 默认走 UDP 514 无确认，网络突发拥塞时丢的恰恰是告警本身，「没收到日志」不等于「没发生」；判据：关键设备改用 TCP/TLS syslog，并用设备侧缓存日志与收集端交叉核对"],"v":"到收集端确认报文真的落盘：tail -f /var/log/messages（或 rsyslog 规则里指定的落盘文件）—— /var/log 是目录，直接 tail -f 没有意义；接收端还要先在 rsyslog.conf 打开 UDP 514 监听并配落盘模板","l":["接收端先开监听并配置落盘模板","设备上配日志服务器地址与级别过滤","制造一条可识别事件（接口 up/down）","在接收端确认已落盘且可检索，再收紧级别看哪些被丢"]},{"id":"J1","t":"J1. K8s Pod CNI 规范","lab":false,"y":"CNI插件(如Calico)负责给每个Pod分独立IP并插上网线。要求Pod间全互通无NAT。\nService 类型：ClusterIP(集群内虚拟IP，默认)；NodePort(节点端口暴露，每 Node 监听高端口)；LoadBalancer(云 LB 分发到 NodePort)；ExternalName(CNAME 到外部域名，无 ClusterIP)。","dg":{"k":"flow","n":[{"t":"Pod veth"},{"t":"网桥/路由"},{"t":"物理网卡"}],"l":["",""]},"c":"kubectl get pods -o wide\nkubectl exec -it <pod> -- ip addr","o":"NAME     STATUS   IP           NODE\nnginx-1  Running  10.244.1.2   node1","j":["-o wide: 显示IP和Node","hostNetwork:true 副作用：绕过 CNI(直接复用宿主机网络栈)、NetworkPolicy 失效、端口易冲突","IP 第三段常能看出子网切分：常见 CNI 把 Pod 大网段（如 10.244.0.0/16）按 /24 切给每个节点，第三段就是子网号——跨节点不通时先查两端节点的子网路由与封装状态","ip addr 里要看到 eth0 拿到 Pod 网段地址才算网络就绪——STATUS=Running 只说明容器进程起来了，不代表 CNI 已注入网卡"],"u":["云原生业务基础底座网络排障"],"w":["CNI没装好，Node都是NotReady状态：现象是新建 Pod 卡在 ContainerCreating、describe 报 network plugin not ready——kubelet 等待 /etc/cni/net.d 配置与插件二进制，缺失时沙箱创建失败、节点被置 NotReady；判据：先看 Pod describe 的 sandbox 报错与节点上 /etc/cni/net.d 是否有文件，而不是重启 kubelet 碰运气","跨节点 Pod 不通：现象是同节点 Pod 互通、跨节点 ping 丢包——Pod 网段在底层网络不可路由，跨节点要靠封装隧道或 BGP 打通，底层防火墙拦掉封装（如 IPIP 的 IP 协议 4、VXLAN 的 UDP 端口）就只有单边通；判据：两端节点分别抓包看封装报文有无进出，再查路由表有无对端 Pod 子网","拿 ping 测 ClusterIP：现象是 ping Service 的 ClusterIP 不通就判定 Service 坏了——ClusterIP 是转发规则里的虚拟地址，不响应 ICMP 属正常现象；判据：用 curl 对 ClusterIP 加端口或服务域名测真实转发，能通即 Service 正常"],"v":"在Pod A里直ping Pod B的IP","l":["裸集群先确认跨节点 Pod 地址不可路由","装一个 CNI 插件，观察节点上多出的虚拟网卡","跨节点 ping Pod 地址验证连通","检查插件二进制与配置的下发路径是否就位"]},{"id":"J2","t":"J2. Calico BGP 与 IPIP","lab":false,"y":"纯BGP模式(No Encap)：Node当路由器，原生IP转发无损耗性能极高。\nIPIP模式：公有云里节点间转发受 SDN 源/目的校验限制、Pod 网段也不会被 VPC 路由表学到，所以默认走 IPIP/VXLAN 封装（AWS 同子网可关 source/dest check 做无封装，跨子网需另配 VPC 路由）。","dg":{"k":"multi","rows":[{"n":[{"t":"纯BGP","s":"NodeA"},{"t":"NodeB"}],"l":["物理网"]},{"n":[{"t":"IPIP","s":"NodeA tunl0"},{"t":"NodeB"}],"l":["封装IP"]}]},"c":"calicoctl patch ippool default-ipv4-ippool -p '{\"spec\":{\"ipipMode\":\"Never\"}}'","o":"10.244.2.0/24 via 192.168.2.2 dev eth0 proto bird","j":["proto bird: 证明路由是Calico的BGP刷入的","via 对端Node地址 dev eth0：这是 NoEncap 模式的形状——下一跳是物理地址、出物理口；一旦出现 dev tunl0 就说明流量进了 IPIP 封装，看路由表一眼区分两种模式","ipipMode 三档：Never(纯 BGP 无封装)/Always(全封装)/CrossSubnet(同子网裸转发、跨子网封装)——公有云用 CrossSubnet 时同子网也要关 source/dest check，否则同子网反而断","calicoctl patch -p：在线改 IPPool，改动触发全网路由重刷——生产环境放在低峰执行"],"u":["追求极致性能的自建机房集群"],"w":["切换模式可能导致瞬间断网，注意MTU：现象是 Never↔Always 切换瞬间跨节点流量全断、之后大包传输失败——切换期新旧路由交替，tunl0 生效后 IPIP 外层多 20 字节、有效 MTU 变小，1500 全尺寸包被丢；判据：切换后 ip -d link show tunl0 核对 MTU，用 ping -M do -s 从小到大探出可用载荷","公有云 source/dest check：现象是 NoEncap 配完跨节点 Pod 不通、Node 物理地址互 ping 却全通——云虚拟交换机默认校验网卡源/目的地址，带 Pod 源地址的包被丢，且 Pod 网段不在 VPC 路由表里；判据：同子网须关网卡的 source/dest check，跨子网还要补 VPC 路由——路由表查不到 Pod 网段就别指望裸转发","BGP 邻居没起来：现象是节点路由表里看不到 proto bird 的对端 Pod 网段——节点间 TCP 179 不通（防火墙拦）或 AS 号/peer 配置不匹配；判据：calicoctl node status 看 BGP peer 是否 Established，先于一切应用层排障"],"v":"ip route | grep -E 'tunl0|proto bird' 看路由是否经隧道口（注意 NoEncap 下 tunl0 接口也可能存在，别只看接口存不存在），再 ip -d link show tunl0 确认封装类型","l":["看节点间路由协议邻居是否建立","跨节点打流并抓包，确认走隧道还是裸 v4","按平台条件关掉隧道封装，再抓一次包对比","查路由表：确认 Pod 网段路由的下一跳来自哪一协议"]},{"id":"J3","t":"J3. NetworkPolicy 微隔离","lab":false,"y":"NetworkPolicy 是声明式白名单，作用单位是「被选中的 Pod」，理解这一点才知道它为什么有时「配了没生效」。\n- 默认全通只对未被任何策略选中的 Pod 成立；一个 Pod 一旦被任一策略选中，未显式允许的流量就开始被丢弃 —— 这就是灰度上线时「只写一条 deny-all 会发生什么」的机理\n- 选择器只有三类维度：Pod 标签、命名空间标签、IP 段；端口层协议只有 TCP/UDP/SCTP，所以 ICMP 类流量无法精细放行，别把「只允许 ping」当可行目标\n- 方向是分开的：只声明入向策略不影响该 Pod 的出向；要做严格隔离得两个方向都写\n- 它是 CNI 的功能，不是 K8s API 的自动行为：插件不实现（部分只提供连通性的 CNI）时策略对象能创建但无人执行\n- 至少要放行 DNS（UDP 53）与探针/健康检查路径，否则第一个失败的是域名解析而不是业务连接\n- 推进顺序：先按命名空间写 deny-all 观察谁报错，再逐条加允许；一次上几十条规则只会让排障变成考古","dg":{"k":"flow","n":[{"t":"Namespace-A Front…"},{"t":"Backend"},{"t":"X"},{"t":"Hacker Pod"}],"l":["放行","",""]},"c":"spec:\n  podSelector: { matchLabels: { app: backend } }\n  ingress:\n  - from: [{ podSelector: { matchLabels: { app: frontend } } }]","o":"Name: backend-policy\nPod-Selector: app=backend\nAllow: from app=frontend","j":["podSelector: 应用策略的目标","from 里选择器的组合语义易错：同一个数组元素内 podSelector 与 namespaceSelector 是「与」（限定在那些命名空间里选中的 Pod），拆成两个元素就是「或」——写错时放行的范围完全不同","回显 Allow: from app=frontend 表示入向白名单：被选中的 Pod 没有显式允许的入向流量一律丢弃；回显里没有 egress 字段说明该策略未限制出向——两个方向是分开声明的"],"u":["多租户集群隔离、高安应用零信任"],"w":["得看你装的CNI支不支持它(Flannel原生不支持)：现象是策略对象创建成功、get 也看得到，但流量完全没被拦——NetworkPolicy 只是 API 对象，执行在 CNI；Flannel 这类只管连通性的插件不实现策略引擎；判据：查所用 CNI 是否声明支持 NetworkPolicy，或换支持策略的插件实测拦截——对象创建成功不是生效依据","出向白名单误杀 DNS：现象是 egress 策略上线后应用大面积报错、域名解析全部失败——白名单没放行到集群 DNS 的 UDP/TCP 53，解析先于业务连接挂掉；判据：出向策略上线前先放行集群 DNS（按标签加端口），故障时用 nslookup 区分「解析失败」与「连接失败」","deny-all 灰度连锁反应：现象是只上一条选中 backend 的拒绝策略后探针开始失败、Pod 进入重启循环——Pod 被任一策略选中后未显式允许的流量全丢，部分 CNI 实现下 kubelet 探针流量同样被拦；判据：策略上线同时放行探针端口与必要依赖，把 Pod 重启计数与策略变更时间对齐观察"],"v":"起非授权Pod用wget测访问被阻","l":["先只写一条「选中目标 Pod、拒绝入向」的策略","从同命名空间与外部各发起连接，看谁被丢","按需放开某个 TCP 端口，复测是否只影响该端口","加出向策略前，先确认它不会顺手打断域名解析"]},{"id":"J4","t":"J4. Docker 单机网络","lab":false,"y":"Docker 默认在宿主机建 docker0 网桥（172.17.0.1/16），每个 bridge 容器一对 veth-pair：容器内叫 eth0，宿主端挂在 docker0 上。\n- 四种模式：bridge 默认且隔离适中；host 共享宿主网络栈、-p 失效；container 借用另一容器的网络栈（K8s Pod 同源）；none 只剩 lo 自己配\n- -p 8080:80 的主路径是 netfilter DNAT 改写目的地址，docker-proxy 进程只兜底本机 localhost 访问\n- 默认 bridge 容器间只能按 IP 互访；自定义 bridge 才带内嵌 DNS，直接用容器名互通\n- 默认网段 172.17.0.0/16 落地前先和办公网、VPN 网段核对，冲突会让外部访问发布端口超时\n- 吃透 veth+网桥+DNAT 这套单机拓扑，再去看 J1 的 Pod veth 和 CNI，只剩编排层差异","dg":{"k":"flow","n":[{"t":"外部客户端","s":"10.9.1.20"},{"t":"宿主机 eth0","s":"10.2.10.8:8080"},{"t":"DNAT","s":"→172.17.0.2:80"},{"t":"docker0","s":"172.17.0.1/16"},{"t":"容器 eth0","s":"172.17.0.2:80"}],"l":["访问发布端口","PREROUTING 改写目的地址","经网桥转发","送进容器"]},"c":"root@netops:~# docker network ls\nroot@netops:~# ip -br link\nroot@netops:~# docker network inspect bridge\nroot@netops:~# docker network create --subnet 172.28.0.0/24 appnet\nroot@netops:~# docker run -d --name web --network appnet -p 8080:80 nginx:alpine\nroot@netops:~# docker run -d --name db --network appnet redis:alpine\nroot@netops:~# docker exec web ping -c2 db\nroot@netops:~# iptables -t nat -nL DOCKER\n# ip link show master docker0 可列出挂在网桥上的全部 veth 宿主端\n# 对端验证：docker exec web ip link 里 eth0 的 ifindex 应等于宿主端 veth 的 @ifN\n# Cisco/华为容器外的等价视角：网桥=二层交换，veth=互联线缆，DNAT=端口映射","o":"[\n{\n    \"Name\": \"bridge\",\n    \"Id\": \"a12f3b8c9d01\",\n    \"Scope\": \"local\",\n    \"Driver\": \"bridge\",\n    \"EnableIPv6\": false,\n    \"Internal\": false,\n    \"IPAM\": {\n        \"Driver\": \"default\",\n        \"Config\": [\n            {\n                \"Subnet\": \"172.17.0.0/16\",\n                \"Gateway\": \"172.17.0.1\"\n            }\n        ]\n    },\n    \"Containers\": {\n        \"8f3a9c1e77b2\": {\n            \"Name\": \"web\",\n            \"IPv4Address\": \"172.17.0.2/16\"\n        }\n    },\n    \"Options\": {\n        \"com.docker.network.bridge.name\": \"docker0\"\n    }\n}\n]","j":["ip -br link 里 veth8f3a1c2@if11 是 veth 的宿主端，@if11 就是某个容器内 eth0 的接口序号，一对 veth 一一对应","默认 bridge 的容器 IP 按启动顺序分配，重启顺序一变 IP 就变，依赖一律走容器名+自定义网络而不是写死 IP","iptables -t nat -nL DOCKER 里能看到每条 -p 生成的 DNAT；设 userland-proxy:false 只关掉本机 localhost 的兜底转发路径，外部访问仍走内核 DNAT","host 模式下 -p 静默无效（端口直接用宿主的），冲突不会在 docker run 时报错，要到 ss -lntp 里才暴露"],"u":["单机上给 Web/DB/缓存组隔离网段并按容器名互访","发布中间件端口前核对 docker0 网段与办公网、VPN 是否重叠","用 --network container:xxx 预演 K8s Pod 内多容器共享网络栈"],"w":["办公网或 VPN 恰好落在 172.17.0.0/16 内时，外部访问 -p 端口超时而本机 curl 正常——容器回包在宿主机命中 172.17.0.0/16 dev docker0 直连路由被送回网桥，回程断链；判据：ip route 里该 /16 路由覆盖办公网段，修法是 daemon.json 配 default-address-pools 换网段","主机重启或 firewalld 重载后发布端口外部不通——DOCKER/FORWARD 规则是 dockerd 启动时写入 iptables 的，防火墙服务若在其后重载会冲掉规则或把 FORWARD 默认策略置 DROP；判据：iptables -t nat -nL DOCKER 找不到对应 DNAT 条目，重启 docker 或把防火墙服务排在 dockerd 之前加载","图省事用 --network host 跑中间件，结果与宿主服务抢端口且容器监听直接暴露公网——host 模式无 NET 命名空间隔离、-p 不生效；判据：docker inspect 的 NetworkMode=host，ss -lntp 看到容器进程直接绑定宿主地址"],"v":"自定义网络里两个容器按名互 ping 通过；-p 8080:80 发布后从外部 curl 宿主机 8080 通，iptables -t nat -nL DOCKER 出现对应 DNAT 条目。","l":["docker network inspect bridge 记下网段与 veth 关系","docker network create --subnet 172.28.0.0/24 appnet","分别在默认 bridge 与 appnet 里用容器名 ping，体会内嵌 DNS 的有无","设 userland-proxy:false，iptables -t nat -nL 找 DNAT","故意创建一个与办公网重叠的网段，读 Pool overlaps 报错，验证地址池检查逻辑"]},{"id":"N1","t":"N1. K8s Ingress 与控制器选型（含 ingress-nginx 退役）","lab":false,"y":"Ingress 声明「域名/路径 → Service」的入口规则，真正干活的是某个 Ingress Controller。\n- 注意时效：最主流的参考实现 ingress-nginx 已于 2025-11 官方公告退役、2026-03 后不再出修复与安全更新，新项目不应再选它\n- Ingress 这个 API 本身没有废弃，存量集群照旧用；但官方对新部署指向 Gateway API 及其实现（如 Envoy Gateway 等）\n- Gateway API 已 GA 且范围继续扩大（v1.6 起 TCPRoute/UDPRoute 也毕业），按角色拆成 GatewayClass/Gateway/HTTPRoute，支持跨 namespace 与更细的流量控制","dg":{"k":"flow","n":[{"t":"外部用户"},{"t":"Ingress"},{"t":"分流"},{"t":"Pod-A/B"}],"l":["app.com","",""]},"c":"apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: app-ing\nspec:\n  ingressClassName: nginx        # 不写就用集群默认 class，行为随集群变化\n  rules:\n  - host: app.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix         # v1 里必填，漏了 apiserver 直接拒绝该对象\n        backend:\n          service:\n            name: web-svc\n            port:\n              number: 80","o":"NAME      CLASS        HOSTS     ADDRESS   PORTS  AGE\nweb-ing   gateway-api  app.com   10.0.0.8  80     2d","j":["host: 绑定的域名","pathType 三种取值：Prefix 按路径段匹配（/api 匹配 /api 与 /api/v2，但不匹配 /apiv2）；Exact 精确等值；ImplementationSpecific 交给控制器定义——v1 里必填，漏了 apiserver 直接拒绝该对象","ingressClassName：决定由哪个控制器处理；不写时落到集群默认 IngressClass——集群装了多个控制器时漏写，流量会交给非预期实现（老的 annotation 写法已不推荐）","ADDRESS 列是控制器回写的入口地址：恒为空说明控制器未就绪或未接管该 Ingress，此时规则不会生效"],"u":["单个公网IP暴露100个微服务"],"w":["没装Controller的话，配了Ingress也白搭不生效：现象是 Ingress 创建成功但 ADDRESS 恒为空、请求全是超时或 404——Ingress 只是声明，没有控制器 watch 它就没有任何数据面；判据：先 kubectl get ingressclass 确认类与控制器的对应关系，再核对资源是否命中预期 class","选到退役实现：现象是新项目沿用 ingress-nginx，CVE 无修复、问题无人处理——ingress-nginx 已于 2025-11 公告退役、2026-03 起不再发版；判据：新部署选 Gateway API 实现（如 Envoy Gateway）或其他仍在维护的控制器，存量集群把迁移排进计划","Host 头不匹配伪装成配置错误：现象是浏览器访问正常、脚本或 IP 直连就 404——规则按请求的 Host 头匹配，不带 Host 或带错域名时流量落到默认 backend、返回控制器默认 404；判据：用 curl -H 指定 Host 显式复测，404 先比对 host 再查 path"],"v":"curl -H 'Host: app.com' http://<INGRESS-IP>","l":["先定入口类型与域名规划，再选控制器","部署入口资源，核对 class 与路径匹配类型","用指定 Host 的请求复现 404，比对规则哪里没匹配","杀掉后端复现 502，用端点与控制器日志定位"]},{"id":"N2","t":"N2. Gateway API 流量治理","lab":false,"y":"Ingress 的演进方向：多协议(TCP/UDP)、跨Namespace 路由、权重分流(灰度/金丝雀发布)。\n现状：核心资源已 GA（Gateway API v1.6 起 TCPRoute/UDPRoute 也毕业），能不能用取决于你选的实现与它的 conformance profile，而不是 API 本身。","dg":{"k":"flow","n":[{"t":"Gateway"},{"t":"HTTPRoute"},{"t":"90%到v1, 10%到v2"}],"l":["",""]},"c":"kubectl apply -f httproute-canary.yaml\nkubectl get gateway,httproute -A\nkubectl describe httproute app-route -n prod\n# 权重分流核心片段：\nbackendRefs:\n- name: api-v1\n  weight: 90\n- name: api-v2\n  weight: 10","o":"NAME          CLASS   ADDRESS     PROGRAMMED   AGE\nprod-gw       istio   10.0.0.8    True         21d\nNAME         HOSTS     AGE\napp-route    app.com   21d","j":["weight: 轻松实现金丝雀发布流量拆分","Programmed 与 Accepted 是两个独立条件：Accepted 表示配置被控制器接受；Programmed 表示数据面（网关实例/监听）真正就绪——只 Accepted 不 Programmed 时没有可用转发面，流量进不来","ResolvedRefs 是 HTTPRoute 上的状态条件：backendRefs 指向的 Service 不存在或不可解析时为 False——「灰度比例不生效」先看它，别只盯 weight 数字","parentRefs 决定路由挂在哪个 Gateway 的 listener 上：跨 namespace 引用需要 ReferenceGrant 放行，否则路由被接受却不挂载"],"u":["复杂微服务多版本灰度测试"],"w":["还在演进期，需装对应CRD：现象是 apply 报 no matches for kind HTTPRoute 或字段校验失败——Gateway API 按版本发布 CRD，集群里注册的 CRD 版本与控制器支持的版本不一致时资源不被接受；判据：kubectl get crd 核对注册的组/版本与所用 API 版本一致，再对控制器的 conformance profile","只装 CRD 没装实现：现象是资源都能创建，但 Gateway 的 Programmed 一直 False、拿不到入口地址——CRD 只是 API 骨架，需要具体实现（Istio/Envoy Gateway 等）watch 并落地数据面；判据：GatewayClass 的 Accepted 条件与控制器 Pod 状态一起看","权重不等于精确比例：现象是压测统计 v2 得 12% 而 weight=10 就回滚——权重是加权转发的统计期望，小样本短时间必然偏离，长连接复用会进一步放大波动；判据：用万级以上请求统计，比例收敛在目标附近（±几个百分点）即正常"],"v":"并发压测后统计 api-v2 实际收到的比例是否≈10%；同时看 HTTPRoute 的 Accepted / ResolvedRefs 与 Gateway listener 的 Accepted / Programmed 是否为 True —— 只看资源存在不代表数据面已生效。","l":["装资源定义与控制器，确认网关类被接受","建网关与路由资源，看状态条件是否已就绪","配两个后端的权重做灰度并发压测","统计实际分流比例，并在父资源状态上确认结果"]},{"id":"N3","t":"N3. Ingress 排障 (502/404)","lab":false,"y":"Endpoint/EndpointSlice 为空（选择器或就绪探针问题）→ 多数控制器返回 503，也有版本/配置表现为 502，判据是日志里写的是 “no endpoints” 还是 “connect() failed”。\n有后端但连接被拒、超时前 RST、响应非法 → 502（升级中、探针误判、keepalive 与 idle timeout 不匹配）。\n404：host/path 规则没匹配上。504：后端在网关超时内没回完。\n（各家控制器与版本对空后端的状态码不一致，别把它当固定规律背。）","dg":{"k":"flow","n":[{"t":"404"},{"t":"查Ingress规则 502"},{"t":"查Pod就绪状态"}],"l":["",""]},"c":"kubectl get endpoints,endpointslices -n prod\nkubectl describe ingress app-ing -n prod\nkubectl get pods -A -l app.kubernetes.io/component=controller -o wide\nkubectl logs -n <ns> <controller-pod> --tail=200 | grep -E \"(502|503|504|404)\"   # 控制器日志有纯文本与 JSON 两种格式，别只匹配空格分隔的一种\nkubectl exec -n prod <pod> -- wget -qO- http://<web-svc>/","o":"NAME       ENDPOINTS                                    AGE\nweb-svc    10.244.1.7:80,10.244.2.5:80                  5m\n# 502 时常见为空：\nNAME       ENDPOINTS   AGE\nweb-svc    <none>      5m","j":["<none>: 代表后端全挂了","ENDPOINTS 列是就绪后端的 IP:port 清单：有地址仍 502 才是连接层问题（目标端口错、keepalive/超时不匹配），为空则先修选择器与就绪探针——先分清「没有后端」还是「连不上后端」","endpoints 与 endpointslices 要对照看：新版本以 EndpointSlice 为准，两者不一致（slice 有地址、endpoints 显示 none）说明旧视图未同步，别被单一输出误导"],"u":["日常集群发布出锅兜底排障"],"w":["注意PathPrefix末尾带不带/区别很大：现象是 /app/ 通而 /app 404（或反过来）——pathType=Prefix 按路径段做前缀匹配，/app 与 /app/ 覆盖的路径段不同，不同控制器实现间还有差异；判据：拿真实 URL 全路径复现，规则 path 抄成与请求一致（含尾斜杠）","状态码别死背：现象是同一个「后端为空」在这个集群回 503、那个集群回 502——空 endpoints 的响应码由控制器实现与版本决定，没有统一规律；判据：以控制器日志文本分类（no endpoints 还是 connect() failed），状态码只做线索","就绪探针误判引发间歇 502：现象是发布后 ENDPOINTS 反复增减、用户间歇性 502——探针阈值过紧或探测路径与应用真实健康口径不一致，应用慢启动期被反复摘除；判据：把 endpoint 变化时间与应用启动日志对齐，调大延迟与失败阈值覆盖真实启动时长"],"v":"502 先看 endpoints 是否为空（选择器/就绪探针导致后端无健康 Pod）；404 比对 host/path 规则与实际请求路径；两者都要在控制器日志里找到对应状态码才算闭环。注意：曾经最主流的 ingress-nginx 已退役，排障思路不变但工具链要跟着换。","l":["先复现 502：让后端没有可用实例","分别复现 502/503/504，记下各自的表现形状","用控制器日志时间戳判断卡在入口还是应用","修好后同一条请求回归，确认链路通且无重复重连"]},{"id":"P1","t":"P1. CoreDNS K8s DNS架构","lab":false,"y":"集群 DNS 是所有服务名解析的唯一入口，由 CoreDNS 承担：它不解析就都不解析。\n- Service 会获得一个域名，形如 服务名.命名空间.svc.集群域；集群域默认是 cluster.local；Headless 服务返回的是后端 Pod 地址列表而不是一个虚拟地址\n- 服务另有一个虚拟 IP 供连接使用，Pod 里指向的 nameserver 就是这个虚拟地址的 53 端口，转发规则由 kube-proxy 或数据面插件维护\n- CoreDNS 通过监听端点切片拿后端 —— 查解析失败时看端点切片是否建成，而不是只盯着 Service 对象\n- 常见故障不是「DNS 挂了」而是链路上的一环：虚拟地址转发规则未生效、UDP 大包被截断、conntrack 竞争丢包、search 后缀拼出错误名字\n- 判据：在 Pod 内 nslookup 并显式指定服务地址，看它有没有回到 CoreDNS；再对比同名字在集群外用 search 后缀能否拼对","dg":{"k":"flow","n":[{"t":"Pod"},{"t":"请求db.default"},{"t":"CoreDNS"},{"t":"返回10.x.x.x"}],"l":["","",""]},"c":"kubectl get pods -n kube-system -l k8s-app=kube-dns","o":"NAME           READY   STATUS    AGE\ncoredns-1234   1/1     Running   10d","j":["k8s-app: K8s关键组件标签","-l k8s-app=kube-dns：按标签找解析组件——CoreDNS 的 Pod 标签是 k8s-app=kube-dns，而 kube-dns 只是 Service 的历史名字，名字与组件是两回事","READY 1/1 表示容器过了就绪探针；若显示 0/1，进程可能在但未过检查——Service 的端点里不会有它，解析表现为间歇超时而不是彻底失败"],"u":["微服务间只认域名不认IP解耦"],"w":["CoreDNS一挂整个集群东西向全瞎：现象是服务间用域名互调全部超时、直接用 IP 却通——Service 域名到虚拟地址的解析全靠 CoreDNS，它不可用应用就拿不到目标地址；判据：Pod 内 nslookup kubernetes.default 显式指向集群 DNS IP 验证，再用 IP 直连业务端口做对照","五元组竞态的 5 秒超时：现象是大批 Pod 并发启动时域名解析偶发固定 5 秒超时、重试即成功——UDP 的 DNS 响应与连接跟踪表项存在竞态，响应被静默丢弃，客户端等满超时才重发；判据：超时集中在 5s（默认 DNS 超时）且重试成功，指向该机制而非 CoreDNS 本身","ndots/search 后缀拖慢外部域名：现象是 Pod 里访问外部域名明显变慢、先卡几秒——Pod 默认 ndots:5，点数不足的短域名会先逐个拼上集群后缀轮询、全失败才按绝对域名查；判据：抓包看对外部域名发出的首轮查询是否带 .svc.cluster.local 后缀，外部域名末尾加点可绕开"],"v":"nslookup kubernetes.default","l":["在 Pod 里看解析配置的名字服务器与后缀列表","解析一个服务名，确认指向服务虚拟地址","把解析组件副本缩到 0，观察失败的具体形态","恢复后查端点切片，确认后端与解析结果对得上"]},{"id":"P2","t":"P2. Pod 服务名称解析机制","lab":false,"y":"Pod 的解析行为由 resolv.conf 决定，关键在 search 列表与 ndots 两个字段。\n- search 里通常是 命名空间.svc.集群域、svc.集群域、集群域 三行，所以输 服务名 就能在「同命名空间」解析成功；跨命名空间要写 服务名.别的命名空间\n- ndots 是一个阈值：名字的点数少于它时，解析器先按 search 列表逐个拼后缀，试完才按原样去查 —— 这就是带点的小名字也会先被拼一轮的原因\n- 后果是延迟与包数量：一次看似简单的查询可能先发好几个请求；对高频外部域名，写成结尾带点的绝对名或调整 DNS 策略可跳过拼接\n- 每个 Pod 可用 dnsPolicy 选择走集群解析还是沿用节点解析，选错时表现为「集群内名字解析不了」或「集群外名字解析不了」两种相反症状\n- 判据：抓一次解析看实际发出的查询名是什么，比盯着应用日志猜「域名不对」快得多；再与手动 nslookup 的结果对比即可定位是拼接问题还是记录问题","dg":{"k":"flow","n":[{"t":"curl db"},{"t":"补齐"},{"t":"db.default.svc.cl…"}],"l":["",""]},"c":"kubectl exec -it test-pod -- cat /etc/resolv.conf","o":"search default.svc.cluster.local svc.cluster.local cluster.local\nnameserver 10.96.0.10\noptions ndots:5","j":["options ndots:5 的 5 是点数阈值：查询名里的点少于 5 就先按 search 列表逐条拼后缀重查，全部试完才按原名查——回显里三条 search 意味着一个外部短名最多先挨 3 次注定失败的查询","nameserver 10.96.0.10 是 kube-system 里 DNS Service 的 ClusterIP，不是节点地址：这行为空或指向节点 DNS 时，说明 dnsPolicy 不是 ClusterFirst（用了 Default/None 且没补 dnsConfig），集群内 Service 名必然解析不了","search 三行的顺序即补齐优先级：default.svc.cluster.local（同命名空间）→ svc.cluster.local（跨命名空间）→ cluster.local（集群域）。「服务名.命名空间」这种两点短名会被第二行补成 服务名.命名空间.svc.cluster.local 命中——跨命名空间短格式因此成立"],"u":["写死配置文件里的DB连接串为简写域名","在 Pod spec 配 dnsConfig 后回读 /etc/resolv.conf，验证 search/ndots/nameserver 的合并结果"],"w":["跨命名空间访问只写服务名解析失败：search 首行只补本命名空间，短名被拼进自己 namespace 的 svc 域后查无记录。判据：跨命名空间改写成「服务名.命名空间」（会被 search 第二行补齐命中）或直接写全名，改完按 v 的方式核对实际解析出的 IP","应用报 no such host 类错误而 HTTP 层根本没发出请求：这是 DNS 层 NXDOMAIN，不是 404——名字不存在时连接没建立；且 ndots:5 下一个短名先按每条 search 各试一次，看到的失败次数可能是真实故障的数倍。判据：报错类型是 getaddrinfo/DNS 而非 HTTP 状态码；数同一查询名的变体个数确认拼接轮数","访问外部域名（镜像仓库、对象存储）稳定多出几十毫秒：外部名点数少于 5，先按 3 条 search 各发一次 NXDOMAIN 查询再查原名，叠加 UDP 丢包重试就是 3 倍重试时延。判据：抓 53 端口，每个外部名先出现 3 个带 cluster.local 后缀的查询再出现原名查询；对策是结尾带点的绝对名、dnsConfig 调低 ndots 或把高频外部名交给外部解析策略"],"v":"ping db 观察解析的IP","l":["用短名访问同命名空间的服务","跨命名空间访问，对比正确写法","抓一次解析过程，数一共发了几个查询","改用绝对名或调整解析策略，复测查询数变化"]},{"id":"P3","t":"P3. DNS 排障 (CoreDNS)","lab":false,"y":"解析失败？先看CoreDNS活着没，再开调试日志看它收没收到，最后查 EndpointSlice（kubectl get endpointslices -l kubernetes.io/service-name=<svc>）—— Endpoints 自 v1.21 起已不是路由真源，CoreDNS 也是通过 discovery.EndpointSlices 看后端。","dg":{"k":"stack","n":[{"t":"Timeout 网断了 NXDOM…"}]},"c":"kubectl edit configmap coredns -n kube-system","o":"[INFO] 10.1.2.3:4321 - 12345 \"A IN wrong-svc.default.svc.cluster.local. udp 41 false 512\" NXDOMAIN qr,aa,rd 106 0.000123456s\n# 模板：remote:port - id \"type class name proto size do bufsize\" rcode flags rsize duration","j":["回显的 NXDOMAIN 是 rcode=名称不存在；NOERROR 但 0 条记录是另一回事（名字在、没有这一类型），两者排查方向不同。qr,aa,rd 是标志位：qr=响应报文、aa=权威应答（CoreDNS 对集群域置位）、rd=客户端要求递归","引号内「A IN wrong-svc.default.svc.cluster.local. udp 41 false 512」依次是 类型/类/查询名/传输/报文长/DO 位/客户端缓冲——udp 41 false 512 即走 UDP、41 字节、未开 DNSSEC DO、客户端宣告 512 字节缓冲：响应超 512 会截断转 TCP，能解释抓包里突然出现的 TCP 53（在 Corefile 加 log 插件即可看到这类逐条日志）","行尾 106 是响应字节数、0.000123456s 是该查询耗时：CoreDNS 日志持续毫秒级而业务仍超时，问题多半不在 CoreDNS 而在它之前的链路（NodeLocal DNS、conntrack、客户端拼接），别急着给 DNS 扩容"],"u":["微服务说找不到对方时的终极杀器","上线 NodeLocal DNSCache 前后对比解析时延与超时率，验证收益"],"w":["现象：排障时给 Corefile 加 log 插件后忘了撤，DNS QPS 高的节点磁盘被容器日志写满。机制：log 把每条查询整行打进 stdout，随节点日志链路落盘，写入量 = QPS × 每行百字节级。判据：改 Corefile 前留存 diff，收工 kubectl diff 复核归零；磁盘告警路径指向 coredns 容器即中招","现象：kubectl get endpoints 明明有 IP，业务仍解析失败或解析到死后端。机制：自 v1.21 起路由真源是 EndpointSlice，Endpoints 只是兼容投影，CoreDNS 走 discovery.k8s.io 的 EndpointSlices，两者在 ready 判定与拓扑路由下可能不一致。判据：用 kubectl get endpointslices -l kubernetes.io/service-name=<svc> 核对 ready/serving 条件，别只看旧 Endpoints","现象：nslookup 手测秒回，应用却偶发恰好 5 秒的解析延迟。机制：glibc 并行发出 A 与 AAAA 两条同五元组查询，conntrack 处理第二条回包有竞态丢包，客户端按默认超时等满 5 秒——延迟总是 5 的整数倍是特征。判据：抓包见同源端口两条查询只有一条有响应；对策是 NodeLocal DNSCache、single-request-reopen 或降并发，口径是「5 秒整」而非「CoreDNS 慢」"],"v":"直接指定DNS查: nslookup svc 10.96.0.10","l":["业务里先复现一次解析失败（错误服务名）","打开解析组件的查询日志，确认请求到没到","显式指定集群解析地址查询，绕开后缀拼接","查端点与后端就绪状态，最后再看拼接阈值的影响"]},{"id":"X1","t":"X1. 可观测性三支柱: Metrics/Logs/Traces 协同","lab":false,"y":"三支柱不是三套工具，而是三种成本与粒度的取舍：指标便宜适合告警但只能回答「多少」，日志细节全但检索贵，链路回答「哪一跳慢/错」但要传播与采样。\n- 真正省事的是三者之间的关联键：同一个标识注入每条日志行，指标点上能跳链路，链路上能回服务 —— 没有关联键时你会在三个界面之间手工对时间戳\n- 指标模型选对省事一半：面向服务用红/错/时延三件事，面向资源用利用率/饱和/错误；只对单机设阈值会漏掉「每台都正常但整体在排队」\n- 告警应挂在 SLO 与错误预算消耗速度上，而不是挂在某台机器 CPU 上；前者叫用户受损，后者常常是噪声\n- 链路要跨语言传播才不断链，头部采样省钱但可能恰好丢掉异常请求，异常驱动/尾部采样更利于排障但实现更重\n- 判据是演练出来的：挑一个真实故障，看能否在告警 → 服务 → 具体调用 → 那行日志之间一次跳完，跳不完就补关联键而不是加仪表盘","dg":{"k":"flow","n":[{"t":"Alert Metrics"},{"t":"Find Trace ID"},{"t":"Inspect Span Logs"}],"l":["",""]},"c":"curl -H 'traceparent: 00-<trace-id>-<span-id>-01' http://<SVC-HOST>/checkout","o":"traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01\n# 版本-trace-id(32位十六进制)-parent-id(16位十六进制)-flags；头里的字段名是 parent-id，不是 span-id","j":["traceparent 是 W3C Trace Context 标准头：00=版本，32 位 hex 的 trace-id 标识整条链路，中间 16 位规范字段名就叫 parent-id（不是 span-id），指向调用方那一段","尾部 -01 是 flags：最低位 sampled=1 表示本链已被采样、下游必须继续上报；置 00 则下游可自行丢弃——手工 curl 注入忘置 01，表象是「请求成功但 Tempo 里查不到这条 trace」","c 命令里的注入占位符有硬格式：trace-id 32 个十六进制字符、parent-id 16 个，且都不得全 0；格式非法时合规 SDK 会忽略注入头另起新 trace-id，注入等于没注——全 0 与非 hex 字符是最常见的两个坑"],"u":["分布式微服务复杂故障定位","新服务上线时用固定 trace-id 注入做冒烟，验证传播链完整"],"w":["现象：全量采样上线后链路存储容量告急、查询超时。机制：写入量 = 每秒请求数 × 平均 span 数，下游中间件自发产生的 span 不受入口采样控制。判据：按每秒 span 数而非 QPS 做容量口径；生产用头部采样打底 + 错误链路强制保留（尾采样/异常标记），预算写进容量规划","现象：链路只有入口一段，下游服务各自成孤岛。机制：跨进程靠 traceparent 透传，某一跳的 HTTP 客户端/消息队列没装传播器（或网关剥了头），context 断裂即另起新 trace-id。判据：看 trace 的服务树是否只有根节点；断点处那一跳的客户端库是排查对象，不是采样配置","现象：排障时在三个系统间手工对时间戳总对不齐。机制：日志记处理完成时刻、span 记 RPC 区间，叠加节点间时钟漂移，两种口径本就不可精确互推。判据：出现手工对时就该补关联键——让日志行带 trace-id（MDC/结构化字段）实现一键跳转，而不是去校 NTP"],"v":"通过 Grafana Tempo 链路跳转 Loki 查看日志","l":["在入口网关注入 TraceID","使用 OpenTelemetry 收集指标","用同一个关联标识把指标、日志、链路串成一次跳转","挑一个真实故障演练：能否从告警一次跳到那行日志"]},{"id":"X2","t":"X2. eBPF 进阶: tc-ebpf 与 XDP 报文处理","lab":false,"y":"XDP 运行在网卡驱动层(极速丢包/抗DDoS)，tc-ebpf 运行在 Linux TC 协议栈(精细挂载与重定向)。\nCO-RE(Compile Once, Run Everywhere)：eBPF 程序一次编译到处运行，依赖内核 BTF(BTF 提供内核结构体布局信息)，加载时用 libbpf 做字段偏移重定位，替代旧的一机一编译。BTF 是 CO-RE 的基石。","dg":{"k":"flow","n":[{"t":"NIC"},{"t":"XDP 极速丢包"},{"t":"tc-ebpf 路由重定向"},{"t":"Protocol Stack"}],"l":["","",""]},"c":"ip link set dev eth0 xdp obj xdp_drop.o\nbpftool prog show","o":"id 42 type xdp name xdp_drop_func tag 1234","j":["「绕过协议栈开销」的确切位置：XDP 挂在网卡驱动收包路径、skb 分配之前，XDP_DROP 在进协议栈前就完成丢包，动作集是 XDP_ABORTED/DROP/PASS/TX/REDIRECT（TX 把包从本网卡 hairpin 回发，ABORTED 为异常终止）；tc-ebpf 挂在 clsact qdisc（ingress/egress 均可），包已过驱动、能拿到完整 skb，对应动作是 TC_ACT_SHOT/OK/REDIRECT——选层先看需要多早介入","bpftool prog show 回显字段：id 是内核实例号，卸载重挂就变，别拿它做长期引用；tag 是指令序列的哈希摘要，同一份 .o 重编译 tag 不变——核对线上版本用 tag 比看文件名可靠","权威参考是内核源码 Documentation/bpf/：XDP 动作语义与 CO-RE/libbpf 用法以它为准；eBPF 是 Linux 实现而非 IETF 标准，没有对应 RFC"],"u":["TB 级抗 DDoS 攻击","云原生高性能网关","应急止血：对攻击源段在驱动层 XDP_DROP，比下发防火墙规则快且不占 conntrack"],"w":["现象：在 XDP 程序里想读 TCP 状态或连接跟踪信息，编译期就报错或行为不符预期。机制：XDP 运行在 skb 之前，没有 conntrack、socket 状态与 GRO 结果，只有原始包头可解析。判据：需要 L4 状态、NAT 感知就下移到 tc-ebpf 或主机层挂载点；「引用 skb 字段编不过」是选错层的编译期信号","现象：裸写 ip link set dev eth0 xdp obj xdp_drop.o 后压测吞吐远低于预期。机制：不带后缀的 xdp 写法在驱动不支持时自动回落 generic 模式（走 skb 克隆路径），性能差一个量级，且 bpftool 里 type 仍显示 xdp，不易察觉。判据：ip link show eth0 回显出现 xdpgeneric 字样即发生了回落；要原生性能显式用 xdpdrv 挂载并确认驱动支持","现象：换内核或换节点后同一份 .o 挂载失败。机制：CO-RE 重定位依赖 BTF（/sys/kernel/btf/vmlinux），内核未编 CONFIG_DEBUG_INFO_BTF 时 libbpf 拿不到结构体布局；驱动模式还要求驱动实现对应 XDP 能力。判据：挂载报错先查 BTF 存在性与驱动支持，再怀疑程序逻辑"],"v":"bpftool prog list 查看挂载状态","l":["编写简易 C 语言 XDP 丢包程序","使用 clang 编译并用 ip link 挂载","挂载后确认早于协议栈的丢包计数开始变化","卸载程序并确认恢复，记录挂载点与回滚方式"]},{"id":"X3","t":"X3. eBPF 可观测性: Cilium Hubble 流量图","lab":false,"y":"Hubble 的观测数据来自内核里 Cilium 数据面的事件流，不是旁路抓包，也不是往 Pod 注入代理。\n- 每条事件自带身份（源/目的 Pod、标签、命名空间）、动作（放行或丢弃及丢弃原因）与协议层次（L3/L4/L7），这让它能回答「被哪条策略丢的」\n- 能力上限取决于执行点：NetworkPolicy、服务转发、策略与可观测共享同一套内核钩子 —— 所以策略生效与流量可见是一体两面，不是两套系统\n- 成本在事件量与保留窗口：全量事件既吃内存又吃带宽，生产要按命名空间/标签采样、限保留期、按需只记丢包\n- 展示与存储分两层：节点侧 agent 出事件，聚合层负责汇聚、鉴权与查询；聚合层对外暴露前必须有 TLS 与认证\n- 判据：先确认能否收到任何事件（agent 与聚合层之间连接正常），再看过滤条件；最后把「策略丢弃」与「内核其它原因丢包」分开解释，两者修复路径完全不同","dg":{"k":"flow","n":[{"t":"Pod A"},{"t":"Pod B"}],"l":["eBPF SockOps 重定向"]},"c":"hubble observe --namespace default --verdict DROPPED","o":"10:00:01.123: default/web-pod:34562 -> default/db-pod:5432 http-request DROPPED (policy verdict) traffic denied by network policy at egress (reason: POLICY_DENIED)","j":["回显逐段拆：default/web-pod:34562 -> default/db-pod:5432 是 命名空间/实例:端口；http-request 表示这条走了 L7 解析（L4-only 流量此处显示 tcp 等协议标识）；DROPPED 是判决，(policy verdict) 强调是策略判决而非内核路由丢包——这是「被哪条策略丢的」的直接证据","行尾 reason: POLICY_DENIED 是修复分叉点：它指向 CiliumNetworkPolicy 规则本身，改策略即可；AUTH_REQUIRED、INVALID_IDENTITY 等其它 reason 分别指向加密/身份解析问题，改策略没用——先分清 reason 再动手","hubble observe 的 --verdict DROPPED 只按判决过滤：egress 与 ingress 的丢弃混在同一输出里，需再叠 --from-namespace/--to-namespace（或 --from-label/--to-label）限定方向，否则分不清是源侧还是目的侧策略拦的"],"u":["K8s 东西向流量可视化","网络安全策略验证","策略上线前切 audit 模式跑一段时间，用 Hubble 统计将被丢弃的流量评估误杀面"],"w":["现象：装完 Hubble 功能残缺或部分策略类型不可用。机制：官方建议内核 ≥ 5.10（RHEL 8.10 这类 4.18 回移植内核等价亦可），低版本能跑但 L7 解析等能力受限；且无论版本必须有 BTF（/sys/kernel/btf/vmlinux 存在），否则 CO-RE 加载失败。判据：上线前 uname -r 与 ls /sys/kernel/btf/vmlinux 两查，缺一样先补内核再上策略","现象：hubble observe 一条事件都没有，误判为集群没流量。机制：事件链是 内核数据面→节点 agent→Hubble Relay→客户端，任何一环断开都表现为空，与真实流量多少无关。判据：先 hubble status 看 relay 连接与事件速率，status 正常再把 --verdict 放宽到 DROPPED,FORWARDED，排除过滤条件过窄","现象：把 Hubble 的策略丢弃数当真实丢包率上报，与网络层统计对不上。机制：Hubble 只见经过 Cilium 钩子的事件，conntrack 拒绝、MTU、本机路由等协议栈其它环节的丢包不产生 policy verdict；反之一次重传可产生多条 L7 事件。判据：两条口径分开报——策略丢弃看 Hubble，链路丢包看内核 drop 计数，混报即口径事故"],"v":"执行 hubble status 查看连接","l":["部署 Cilium 并开启 Hubble","运行 hubble observe 观察丢包","制造一次被策略丢弃的连接，在事件里找到丢弃原因","与旁路抓包对比：哪些信息只有内核事件里才有"]},{"id":"Y1","t":"Y1. 混沌工程: Chaos Mesh 网络故障注入","lab":false,"y":"混沌演练的目的不是搞坏环境，而是把「容错设计是否真的有效」变成一次带断言的实验。\n- 作用域必须先收窄：命名空间加标签选择器限定对象，设置时长并到期自动撤销；声明式对象删掉就恢复，这就是中止开关\n- 注入手段在数据面（网络类用流量整形与丢弃规则，Pod 类靠杀掉或制造不可用），所以要给控制面足够的权限与可达镜像 —— 演练失败常先败在权限\n- 一次实验三件套：基线指标、通过/失败断言、一键中止。没有基线就无法判断「变差是故障造成还是本来就差」\n- 注意联动伤害：被注入对象的健康探针可能因超时而真实重启，把演练放大成事故；先在预发、小流量、短时长验证\n- 断言失败是这次演练的产出而不是故障：要落成工单与修复项，否则演练只是「跑了一次很酷的脚本」\n- 常见有效断言：依赖侧注入延迟后，业务成功率是否仍在 SLO 内、超时是否早于重试预算耗尽、降级是否真的返回了兜底内容","dg":{"k":"flow","n":[{"t":"Chaos Operator"},{"t":"修改 tc/netem"},{"t":"Target Pod"}],"l":["",""]},"c":"kubectl apply -f network-delay.yaml","o":"networkchaos.chaos-mesh.org/delay-test created","j":["回显 networkchaos.chaos-mesh.org/delay-test created 只证明 CR 被 API Server 接受：注入要等 controller-manager reconcile 后才落到目标 Pod 的 tc/netem（内核流量整形机制）上，有秒级滞后；spec.duration 到期自动撤销——created 不等于已生效，验收以 v 的 ping 实测为准","spec.delay.latency 是注入的固定延迟值；spec.direction 合法取值是 from/to/both（写成 in/out 会被 CRD 校验拒绝）——target 指定对端时 from/to 仅影响单向往返方向，验证要让流量方向与注入方向一致，这是「注入了但压测无变化」的高频原因","spec.scheduler 可配 cron 做周期性间歇注入（间歇抖动比持续延迟更贴近真实网络）；不配 scheduler 时 apply 即生效、duration 到期自动恢复——两者配合才能把注入窗口钉死在演练时段内"],"u":["故障演练","高可用架构 Resilience 断言","反向验收监控链路：注入后核对告警是否在预期时间内触发"],"w":["现象：生产演练一发注大面服务抖动。机制：selector 命中面过宽（label 选中整个 Deployment 甚至多命名空间）且没配 duration/scheduler 收口，混沌对象删之前一直生效。判据：apply 前先用同款 selector 执行 kubectl get
