界？"],"w":["把它浪费成礼节性问题，或只问加班与薪资"],"rel":["W1","X1","D3"],"cat":"面试形式"},{"id":"IVQ53","t":"面试中被问到完全不会的问题，你怎么办？","point":"面对无知的诚实与推理能力 —— 网络领域没人什么都会，面试官在测的是这两样。","star":"先明确承认没做过/不掌握（不装懂是底线），再把问题拆成自己懂的部分做有依据的推理，并说清需要什么信息才能确认；最后展示补法（会后查什么、多久能上手）。切忌编造命令、回显或数字 —— 一被追问就全盘失信。","answer":"我会先说这个我没实际做过，然后把我知道的部分推一遍：这类现象通常分几段，我会先确认哪一段有证据、缺哪块信息，再说我会怎么查。比如被问到一个没碰过的厂商特性，我会先讲它在解决什么问题、我理解它的机制大概是什么、然后说清楚我不敢给你命令名 —— 因为编一个看起来对的命令，比我承认不知道代价大得多。会后我会去查官方文档，一般一两天能上手做基础运维。","fb":"承认边界 + 给出推理路径和补课计划，比硬答得分高得多。","j":["先划清「知道」和「不知道」的边界","用分层与分段做有依据的推理","绝不编命令名或设备回显"],"u":["你推的机制被面试官当场说错了，怎么接？","「一两天上手」的学习方法具体是什么？"],"w":["硬编一个像模像样的答案：被追问第二个细节时整段可信度归零"],"rel":["Z1","X1","Z10"],"cat":"面试形式"}],"dict":{"cols":[{"k":"hw","n":"华为 / H3C"},{"k":"cs","n":"Cisco"},{"k":"zte","n":"中兴"},{"k":"lx","n":"Linux / 云原生"},{"k":"win","n":"Windows"}],"rows":[{"i":1,"fn":"查看版本","hw":"display version","cs":"show version","zte":"show version","lx":"uname -a","win":"systeminfo","cat":"运维"},{"i":2,"fn":"运行配置","hw":"display cur","cs":"show run","zte":"show run","lx":"cat /etc/network/interfaces","win":"-","cat":"运维"},{"i":3,"fn":"保存配置","hw":"save","cs":"write memory","zte":"write","lx":"-","win":"-","cat":"运维"},{"i":4,"fn":"日志缓存","hw":"display logbuffer","cs":"show logging","zte":"show log","lx":"journalctl -xe","win":"wevtutil qe System /c:20 /f:text","cat":"运维"},{"i":5,"fn":"NTP 同步","hw":"ntp-service enable","cs":"ntp server","zte":"ntp server","lx":"timedatectl set-ntp true","win":"w32tm /resync","cat":"运维"},{"i":6,"fn":"接口状态","hw":"dis ip int br","cs":"show ip int br","zte":"show interface br","lx":"ip addr show","win":"ipconfig /all","cat":"通用"},{"i":7,"fn":"配置 IP","hw":"ip address x.x.x.x m","cs":"ip address x.x.x.x m","zte":"ip address x.x.x.x m","lx":"ip addr add x.x.x.x/m dev eth0","win":"netsh int ip set address","cat":"运维"},{"i":8,"fn":"流量统计","hw":"display interface","cs":"show interfaces","zte":"show interface","lx":"ifconfig -a","win":"Get-NetAdapterStatistics","cat":"无线"},{"i":9,"fn":"速率双工","hw":"speed 1000 { p: 'p-4', m: 'P1', q: 'CoreDNS 在 K8s 中承担什么职责？', o: ['负载均衡', '网络策略', '集群内服务发现(DNS)', '容器运行时'], a: 2, e: '把 svc.namespace.svc.cluster.local 解析为 ClusterIP，是东西向通信的基础。' },

{ p: 'p-4', m: 'F1', q: 'VXLAN 场景下 Underlay MTU 通常需要调整为？', o: ['1600 或更大', '1400', '不用调', '1500'], a: 0, e: 'VXLAN 外层封装约增加 50 字节，Underlay 不调大会导致大包分片或丢弃。' },
{ p: 'p-4', m: 'F1', q: 'BGP EVPN 中 Type-2 路由的作用是？', o: ['建立 BUM 隧道', '分发 MAC/IP 实现 ARP 抑制', '通告 IP 前缀', '选举 DR'], a: 1, e: 'Type-2 是 MAC/IP 通告；Type-3 建 BUM 泛洪隧道；Type-5 通告三层前缀。' },
{ p: 'p-4', m: 'J1', q: 'Flannel 作为 CNI 的显著限制是？', o: ['原生不支持 NetworkPolicy', '需要商业授权', '不支持 IPv4', '不支持跨节点'], a: 0, e: 'Flannel 只做连通性，写了 NetworkPolicy 也不生效，需换 Calico/Cilium。' },
{ p: 'p-4', m: 'Z2_2', q: '99.9% 的 SLO 对应每月可用错误预算约为？', o: ['4.3 分钟', '3 天', '43 分钟', '7.2 小时'], a: 2, e: '30天×24×60×0.1% ≈ 43.2 分钟。99.99% 则约 4.3 分钟。' },
{ p: 'p-4', m: 'J1', q: 'K8s 跨节点 Pod 不通，首先排查？', o: ['Dashboard', 'CNI 插件与其 BGP/隧道状态', 'CoreDNS', 'Ingress'], a: 1, e: '跨节点转发由 CNI 负责，先看 calicoctl node status 或 cilium status。' },
{ p: 'p-4', m: 'IVQ6', q: '面试中描述故障经历应遵循什么法则？', o: ['PDCA', 'STAR', 'SMART', '5W1H'], a: 1, e: 'Situation 情境、Task 任务、Action 行动、Result 结果，逻辑完整有说服力。' },
{ p: 'p-4', m: 'J2', q: '公有云上 Calico 默认要开 IPIP/VXLAN 封装，根本原因是？', o: ['K8s Service CIDR 与节点网段冲突', 'SDN 做源/目的校验，且 VPC 路由表不会学习 Pod 网段', 'K8s 强制要求封装', '节点不支持 MTU'], a: 1, e: '常被说成「云上不许跑 BGP」并不准确：真实机制是转发校验 + 路由不可知。AWS 上同子网可以关掉 source/dest check 走无封装，但跨子网/跨 AZ 仍需 IPIP/VXLAN，或把 Pod 网段路由写进 VPC 路由表（cloud provider 集成）。' },
{ p: 'p-4', m: 'I4', q: '遥测（gNMI 等）相比 SNMP 轮询的关键优势是？', o: ['订阅式推送、亚秒粒度、带时间戳，能还原事件时序', '不需要认证', '兼容性更好', '端口更少'], a: 0, e: '轮询周期受 walk 耗时限制，通常是分钟级，突发被抹平；YANG 模型让「读状态」和「写配置」统一成结构化路径。' },
{ p: 'p-4', m: 'I4', q: 'YANG 数据模型在网工侧的作用最贴切的是？', o: ['加速转发', '替代 SNMP 端口号', '定义 VLAN 类型', '用结构化模型描述设备配置与状态，供 NETCONF/RESTCONF/gNMI 按路径读写'], a: 3, e: '它是「数据长什么样」的契约，不是协议本身：YANG 1.1 = RFC 7950；NETCONF(RFC 6241)/RESTCONF(RFC 8040)/gNMI 是访问它的三条通道。' },
{ p: 'p-4', m: 'F2', q: 'BGP unnumbered 的核心机制是？', o: ['关掉 hold timer', '用静态路由替代 BGP', '邻居用 IPv6 链路本地地址建立，IPv4 路由携带 IPv6 下一跳（RFC 8950）', '不分配 AS 号'], a: 2, e: '准确说法是「单跳 eBGP 跑在 IPv6 链路上，IPv4 路由携带 IPv6 下一跳」（RFC 8950，已废止 RFC 5549）。华为侧有 ipv4-capability 一类开关，但具体命令随平台/版本不同，以型号文档为准。' },
{ p: 'p-4', m: 'N1', q: '2026 年新搭 K8s 对外入口，最该注意的事实是？', o: ['只能用硬件 LB', 'Ingress API 已废弃', '参考实现 ingress-nginx 已退役，新项目应选仍在维护的 Gateway API 实现', '必须先装 Istio'], a: 2, e: '被退役的是 nginx 这个控制器，不是 Ingress 资源 API（存量集群照用）。官方对新部署指向 Gateway API 及其实现。' },
{ p: 'p-3', m: 'C1', q: '内网通过 Easy-IP 正常上网，但外网访问已映射的端口始终不通，第一步该确认什么？', o: ['是否存在面向入向的 server 映射（目的地址 + 端口重写）', '服务器 CPU 是否过高', '内网终端能否互访', 'DNS 解析是否生效'], a: 0, e: 'Easy-IP 只对「先 outgoing 的会话」自动建映射，入向没有会话可反查，必须显式做 server 映射。再往下才看回程是否走了另一台设备（非对称）。' },
{ p: 'p-3', m: 'C2', q: 'PPPoE 拨号后网页能打开、SSH 也正常，但大文件下载和 VPN 握手卡住，最可能是？', o: ['路由协议没起来', 'MSS/MTU 没按 PPPoE 开销调整，大包被中间丢弃', 'DNS 缓存污染', '账号并发数超限'], a: 1, e: '以太网 1500 减 PPPoE 会话头 6 再减 PPP 头 2，IP 层约 1492、TCP MSS 约 1452。小包与交互流量正常、大包卡住正是「分片被丢」的典型形状。' },
{ p: 'p-3', m: 'K1', q: 'IPsec 隧道的一端在 NAT 后，中间防火墙只放行了协议号 50，结果不通。原因是？', o: ['ESP 没有端口概念，NAT 改地址会破坏校验，必须用 NAT-T 把 ESP 封进 UDP 4500', 'AH 与 ESP 冲突', 'ESP 报文太大', 'IKE 版本不匹配'], a: 0, e: '只放行 50 在 NAT 场景不够，要放行 UDP 4500（NAT-T）。同时注意 AH 因把 IP 头算进校验，遇 NAT 必失效。' },
{ p: 'p-3', m: 'K2', q: '端口开了 802.1X 之后，接在该端口上的打印机拿不到 DHCP 地址，最合理的解释是？', o: ['VLAN 数量超过 4096', '认证完成前端口只放行认证报文，DHCP 交互同样被挡', '打印机不支持 SNMP', 'DHCP 服务器地址池满了'], a: 1, e: '受控端口在认证通过前不通业务流量。哑终端常见处置是 MAB 以 MAC 作凭据（可伪造，只当兜底）或放 guest VLAN 只给受限网段。' },
{ p: 'p-3', m: 'D1', q: 'Netmiko 批量脚本显示全部下发成功，重启设备后配置却回到改前，最可能漏了哪一步？', o: ['少了一次保存/提交：发配置与落盘是两类动作', '线程数太少', '没有关分页', '没用 try 包裹异常'], a: 0, e: 'send_config_set 只是把命令发给设备，VRP/IOS 的 save 或候选配置 commit 要另外做。批量写完还要留基线与改后对比，回滚才可执行。' },
{ p: 'p-3', m: 'W2', q: '把 Batfish 接进 CI 后，它的断言应该起什么作用？', o: ['作为变更前门禁', '实时告警链路丢包', '自动修复配置错误', '替代测试环境做压力测试'], a: 0, e: '它算的是配置的等价语义，属于「编译期检查」：擅长变更前后对比与门禁，不覆盖真实丢包、时延、MTU 黑洞、驱动缺陷。可达性/策略类断言失败就阻断配置下发。' },
{ p: 'p-4', m: 'P2', q: 'Pod 里只写了服务名，一次解析却发出好几个 DNS 查询，为什么？', o: ['Service 有多个端口', 'resolv.conf 的 search 列表加上 ndots 阈值', 'CoreDNS 在做负载均衡', '网卡驱动重传'], a: 1, e: '这是拼接顺序与阈值的行为，不是解析失败。写结尾带点的绝对名或调整 dnsPolicy 可跳过 search，减少无用查询。点数不足的名字会先逐个拼后缀再按原样查。' },
{ p: 'p-4', m: 'J3', q: '集群里加了 NetworkPolicy，流量却照旧互通，最先要排除的两个原因是？', o: ['kube-proxy 版本太旧', 'NetworkPolicy 有优先级，被更高优先级的规则覆盖了', '策略对象的 selector 没匹配到目标 Pod，或 CNI 根本不执行策略', 'Pod 重启过'], a: 2, e: 'NetworkPolicy 由 CNI 实现执行：只提供连通性的插件不会生效。另一个常见情况是选择器写错，目标 Pod 未被任何策略选中，于是仍享受「默认全通」。' },
{ p: 'p-4', m: 'X3', q: 'Hubble 能直接显示「这条流被哪条策略丢弃」，tcpdump 做不到，本质差别是？', o: ['tcpdump 不支持容器', 'Hubble 读的是策略执行点上的内核事件（带身份与动作），不是旁路复制的报文', 'Hubble 抓包更完整', 'Hubble 用了镜像端口'], a: 1, e: '因为 Cilium 的策略执行与可观测共享同一套内核钩子，事件自带 Pod 身份、动作与丢弃原因；抓包只看到包，不知道「谁决定丢的」。' },
{ p: 'p-4', m: 'Z2_2', q: 'SLO 定为 99.9%（30 天窗口），实测可用性 99.922%，剩余错误预算约是多少？', o: ['约 22%', '约 0.078%', '无法计算', '约 78%'], a: 0, e: '已消耗 = (1-0.99922)/(1-0.999) = 0.78，剩余 1-0.78 ≈ 22%。注意「可用性达成度」和「预算余量」是两个数，别混着报。' },
{ p: 'p-4', m: 'I2', q: '用 snmp_exporter 时抓到的指标 instance 显示成一个残缺地址且没有数据，配置上错在哪？', o: ['没做 relabel', 'SNMP 版本太低', 'Prometheus 端口冲突', 'SNMP 团体名写错'], a: 0, e: 'Prometheus 拨号的是 exporter 而不是设备。三段 relabel（地址→__param_target、__param_target→instance、__address__→exporter）缺一会导致抓错目标或标签残缺。要把设备地址送进 __param_target，并把 __address__ 换成 exporter 地址。' },
{ p: 'p-4', m: 'Y2', q: '只配了熔断阈值，故障时反而更容易雪崩，通常还缺什么配套？', o: ['关闭链路追踪', '更激进的告警', '超时、带退避与预算的重试、并发/连接上限三件套', '更大的实例规格'], a: 2, e: '没有超时，等待慢调用的连接会被占满；没有重试预算，重试把故障放大数倍；没有并发上限，后端刚恢复又被灌满。熔断只是快速失败的开关。' },
{ p: 'p-4', m: 'Y1', q: '在测试环境注入网络延迟做演练，结果真实业务连续重启，最可能漏考虑了什么？', o: ['健康探针会被延迟拖成失败，把演练放大成真实重启；作用域、时长与中止开关要先收窄', '没用容器', '日志级别太低', '注入时间太短'], a: 0, e: '演练对象的成功/失败判定与探针共享同一条链路。一次合格的演练要有基线指标、明确断言和一键中止，且从小流量短时长开始。' },
{ p: 'p-4', m: 'N3', q: 'Ingress 返回 502，而后端服务日志里完全没有这条请求，最可能的原因是？', o: ['客户端主动断开', 'DNS TTL 太长', '后端处理太慢', '上游拒连或协议不匹配（例如明文打到后端 TLS 端口、容器崩溃导致连接被重置）'], a: 3, e: '502 说明请求没被上游正常应答：先区分「拒连/协议不匹配/无可用后端」与「等不到响应」（后者是 504）。慢不是这里的解释。' },
{ p: 'p-1', m: 'Z13', q: '同样是「只看 443 端口」，tcpdump 写 port 443、Wireshark 写 tcp.port==443，两者的本质差别是？', o: ['显示过滤器更严格，必须在开始抓包前就写好', '只是新旧写法不同，可以混用', 'tcpdump 的 BPF 在内核抓包点先过滤（省资源），Wireshark 在解析后对已抓包筛选（可随时改）', 'tcpdump 只能抓 TCP，Wireshark 什么都能抓'], a: 2, e: 'BPF 作用于捕获阶段，包在内核就被丢弃，省拷贝省磁盘；显示过滤器在用户态解析层对已抓报文随时改条件重筛。两者语法不通用，混写要么报语法错要么抓空。' },
{ p: 'p-1', m: 'Z13', q: 'tcpdump 抓到一行「IP 198.51.100.1 > 203.0.113.10: ICMP 198.51.100.80 unreachable - need to frag (mtu 1400), length 56」，最合理的下一步是？', o: ['在客户端关掉 DF 位让 IP 层自动分片', '按 mtu 1400 把这方向 MSS 收到 1360 左右（或 clamp mss-to-pmtu），并复查中间是否有设备吞了这条 ICMP', '把全网 MTU 统一改大', '把 198.51.100.1 当成故障源直接下线'], a: 1, e: 'need to frag 括号里的 mtu 就是路径可用 MTU，MSS≈mtu-40=1360。关 DF 是掩盖问题（分片劣化性能且可能被丢），mtu 1400 说明瓶颈在路径中段，不必全网改大。' },
{ p: 'p-1', m: 'Z13', q: '客户端到 <SVC-HOST> 的 443 握手秒通，一传数据就卡死，ping 小包正常；客户端抓包只见大段反复重传、没有 ACK，最该补看什么？', o: ['有没有 ICMP type 3 code 4（need to frag）', '对端服务进程是不是挂了', '是不是 DNS 解析太慢', '客户端网卡是不是半双工'], a: 0, e: '握手正常+大包重传无应答+小包正常，是 PMTUD 黑洞的典型指纹：路径上有小于 MSS 的 MTU，frag-needed 告警在半路被丢。抓 icmp[icmpcode]==4 或用 ping -M do 逐档探 MTU 即可定位。握手小包通但大包被更小 MTU 挡住、告警又被中间设备吞掉，就是 PMTUD 黑洞。' },
{ p: 'p-1', m: 'Z14', q: '客户端向本地 DNS 发的查询，和本地 DNS 向根、顶级、权威发的查询，分别是什么类型？', o: ['前者递归、后者迭代', '两者都是迭代', '两者都是递归', '前者迭代、后者递归'], a: 0, e: '递归是「替我查到底」，客户端只等结果；迭代是「我只告诉你下一跳」，本地 DNS 得自己逐级跑。方向记反，后面看 +trace 输出全是懵的。' },
{ p: 'p-1', m: 'Z14', q: 'dig +short <SVC-HOST> 只回一行 cdn.<SVC-HOST>，后面没有 IP，业务解析失败的直接原因是？', o: ['TTL 为 0', '本地 DNS 递归功能被关闭', 'CNAME 目标 cdn.<SVC-HOST> 没有 A/AAAA 记录，别名链断了', 'MX 记录缺失'], a: 2, e: '+short 会把别名链展开到地址为止；停在 CNAME 说明目标名查不到地址，去权威服务器补 cdn.<SVC-HOST> 的 A 记录即可。' },
{ p: 'p-1', m: 'Z14', q: '权威 DNS 已确认返回新地址 203.0.113.10，记录 TTL 也早已到期，某台老服务器上的应用仍连着旧地址，第一步查哪里？', o: ['根服务器是否收敛', 'MX 记录是否同步修改', '该机 hosts 文件里的残留条目', '权威服务器的 SOA 序列号'], a: 2, e: 'TTL 到期意味着缓存解释不成立；hosts 命中就根本不发 DNS 查询，优先级压过一切 DNS 服务器，老机器迁移后最常见的就是残留条目。' },
{ p: 'p-1', m: 'Z15', q: 'iperf3 输出里，TCP 模式的 Retr 列和 UDP 模式的 Lost/Total 列各自统计的是什么？', o: ['两者都是链路丢包率，只是统计位置不同', 'Retr 是断线重连次数；Lost/Total 是超时次数', 'Retr 是发送端 TCP 重传次数；Lost/Total 是接收端统计的丢失报文数与总报文数', 'Retr 是丢包率；Lost/Total 是重传率'], a: 2, e: 'TCP 靠重传把丢包救回来，所以只报 Retr 计数；UDP 不重传，只有接收端能数出真实丢失。要量化丢包率必须换 -u 模式。' },
{ p: 'p-1', m: 'Z15', q: 'iperf3 -c 198.51.100.10 -u -t 10 不带 -b，receiver 行显示丢包 0%，能据此认定链路零丢包吗？', o: ['不能，iperf3 的 UDP 丢包统计天生不准', '不能，UDP 模式默认目标速率只有 1 Mbit/s，流量太小激不起拥塞，须先 -b 到接近标称带宽再读数', '能，receiver 行就是权威的丢包统计', '能，但要连续测 3 次取平均才作数'], a: 1, e: 'UDP 不带 -b 默认只发 1 Mbit/s，小流量根本压不出丢包，0% 只说明没打够；先 -b 到标称值再下结论。' },
{ p: 'p-1', m: 'Z15', q: '万兆上联实测单流只有 1.1 Gbit/s，加 -P 4 冲到 9.4 Gbit/s，期间 ping 网关稳定无丢包，最可能的解释是？', o: ['链路存在丢包，应先换线', '上联口硬件故障', '单流受 TCP 窗口限制跑不满高带宽长延迟路径，链路本身正常，可加大 -w 或保持多流', '服务端 CPU 打满导致限速'], a: 2, e: 'ping 无丢包且加流即满，是典型的高带宽×高延迟（大 BDP）链路单流窗口受限，不是链路故障；加大窗口或多并发流即可跑满。' },
{ p: 'p-1', m: 'Z16', q: 'NTP 客户端同时配置两个源：A 为 stratum 2 且 Reach 377，B 为 stratum 1 但 Reach 0，客户端最终会怎么选？', o: ['把 A 和 B 的时间取平均', '无条件优先 stratum 更小的 B', '选可达的 A', '每次轮询随机换一个源'], a: 2, e: '选源的前提是源可达：Reach 0 说明 B 最近 8 次轮询全失败，不参与选源；在可用源里再按 stratum、偏差与抖动择优，故跟随 A。不可达的 B 先出局，再在可用源里按层数小、偏差小择优。' },
{ p: 'p-1', m: 'Z16', q: 'chronyc sources 里同时看到「^* 198.51.100.10 Reach 377」和「^? 198.51.100.11 Reach 0」，判读正确的是？', o: ['两个源必须删掉一个，否则无法同步', '两台源都处于正常同步中', 'Reach 377 表示已经成功同步了 377 次', '^? 表示该源不可达（最近 8 次轮询全失败），^* 的 198.51.100.10 才是当前跟随的源'], a: 3, e: '^* 是 chronyd 当前选中并跟随的源，^? 表示不可达；Reach 是八进制位图，377 = 11111111 即最近 8 次全成功，0 即全失败，与同步次数无关。' },
{ p: 'p-1', m: 'Z16', q: '终端访问内网 HTTPS 站点报证书 Not yet valid，同时域账号登录也失败，而证书本身在有效期内，最可能的根因与第一步动作是？', o: ['HTTPS 端口被拦截，先改防火墙策略', 'CA 根证书没装，先给终端推送根证书', '终端时钟失步', '证书被吊销了，直接重新签发一张'], a: 2, e: '证书有效期按两端时钟判定，偏差一大就报 Not yet valid / expired；域登录失败同因（Kerberos 默认约 5 分钟容差）。两个症状同时出现指向时钟失步，校时是第一步。先用 NTP 与内网统一源校时，再复测证书与登录。' },
{ p: 'p-1', m: 'Z17', q: 'Windows 终端自己配出了 169.254.18.77/16 这类地址，最准确的解读是？', o: ['DHCP 服务器地址池耗尽，终端抢到了残留地址', 'DNS 配置错误导致终端回退到链路本地地址', 'DHCP 四步全程没收到应答，系统自动私有编址（APIPA）临时自救', '这是系统保留的回环地址段，属于正常现象'], a: 2, e: '169.254.0.0/16 是 DHCP 无应答后的 APIPA 自动配置，固定 /16 掩码、无默认网关——第一动作是查链路（端口、VLAN、中继），而不是先动服务器或 DNS。' },

{ p: 'p-1', m: 'Z17', q: '用户终端 ipconfig /all 显示 IP 198.51.100.23/24、网关 198.51.100.1，ping 网关通；但 nslookup <SVC-HOST> 超时，回显显示当前 DNS 服务器是 203.0.113.53，而 DHCP 正常应下发 198.51.100.5。下一步先做什么？', o: ['对 <INGRESS-IP> 做 tracert 排查中间链路', '把 DNS 恢复为 DHCP 下发的 198.51.100.5（或 /renew 重新获址），再验证解析', 'arp -d 清空 ARP 缓存后重试 ping 网关', '立即 netsh int ip reset 重置协议栈并重启'], a: 1, e: '地址层已通（网关可 ping），病灶明确在解析层：终端 DNS 被改成了别的服务器。先恢复下发的 DNS 配置再验证；netsh 重置会清掉静态配置，此处用不上。' },
{ p: 'p-2', m: 'A7', q: '同一条出口链路要限速到 100Mbps，选整形（shaping）而不选监管（policing）的核心收益是？', o: ['不占设备缓存，超限流量直接放行', '不丢包：超限报文进缓存队列匀速补发，代价是引入少量排队时延', '能提高链路的总吞吐量上限', '对 UDP 语音同样做到零时延零丢包'], a: 1, e: '整形把超限报文缓存后按承诺速率匀发，削峰不丢包，代价是排队时延；监管超限即丢，省缓存但抖动大。UDP 语音进缓存同样被拖出时延，所以整形主要利好 TCP 类业务。' },
{ p: 'p-2', m: 'A7', q: 'show policy-map interface 显示 Service-policy input: MARK-IN 已应用，但 Class-map: VOICE 的计数长期为 0 packets，而接口上话机流量正常通过，最可能的原因是？', o: ['Packets marked 为 0 说明 DSCP 标记值选错了', 'QoS 策略必须应用在出方向才能计数', '设备硬件转发不支持 QoS，需要更换整机', 'class-map 引用的 ACL 五元组与话机实际流量不匹配（源网段或端口范围写错）'], a: 3, e: '策略已在位，计数恒 0 说明分类器没匹配到任何流量：逐项核对 ACL 的源网段、协议与端口（话机 RTP 常见 16384-32767），改对后计数立即增长；入方向做标记本身就是标准做法，与出/入无关。' },
{ p: 'p-2', m: 'A7', q: '上游入方向已给语音打上 DSCP EF，出口拥塞时语音仍卡顿，排查发现出口队列还是默认 FIFO。下一步最有效的动作是？', o: ['把标记值从 EF 改成 AF31 再试', '加大出口接口的缓存队列长度', '在出口应用 LLQ/PQ 调度策略把 EF 流量送进严格优先队列，并逐跳确认中间设备信任 DSCP', '把语音流量封装进 GRE 隧道再发送'], a: 2, e: '标记只是贴标签，起作用的是每个拥塞点的队列调度：EF 只有进入 PQ/LLQ 才会被优先发送，同时中间设备若不信任 DSCP 会把标签重置为 0。改标记值或加缓存都解决不了「没人按标签调度」的问题。' },
{ p: 'p-2', m: 'A8', q: 'IS-IS 与 OSPF 在区域设计上的关键差异是？', o: ['IS-IS 整台路由器连同全部接口只属于一个区域，区域边界落在链路之间', 'IS-IS 的 ABR 一台路由器横跨多个区域', 'IS-IS 支持 stub 与 NSSA 区域类型', 'IS-IS 必须配置骨干区域 0'], a: 0, e: 'OSPF 的区域边界在路由器上（ABR 不同接口属不同区域），IS-IS 的边界在链路上、一台设备只有唯一区域号；IS-IS 没有 stub/NSSA 概念，L1 区域靠 ATT 位收默认路由。' },
{ p: 'p-2', m: 'A8', q: 'display isis peer 里邻居的 Circuit Id 显示为 0000.0000.0002.01，这条链路的形态是？', o: ['邻居即将超时', '点对点链路，未选举 DIS', '对端 System ID 配置冲突', '广播网链路，0000.0000.0002 是当选的 DIS 并生成了伪节点'], a: 3, e: '广播网上 DIS 用自己的 System ID 加 .01 后缀生成伪节点 LSP 代表整个 LAN；p2p 链路（isis point-to-point）没有伪节点，这也是 DC fabric 的常见配置。' },
{ p: 'p-2', m: 'A8', q: '两台交换机互联起 IS-IS：接口 UP、MTU 一致、进程与接口使能都配了，display isis peer 却是空表。两端 NET 为 49.0001.0000.0000.0001.00 和 49.0002.0000.0000.0002.00，is-level level-1。最可能的原因是？', o: ['必须同时启用 IPv6 才能建邻接', '两个 NET 的 System ID 长度不合法', '区域号 49.0001 与 49.0002 不一致，L1 邻接要求同区域', 'IS-IS 不能运行在交换机链路上'], a: 2, e: 'L1 邻接要求两端 NET 的区域号一致，区域号不同只可能建立 L2 邻接；is-level level-1 下直接起不来。两个 NET 的 System ID 均为合法 6 字节。' },
{ p: 'p-2', m: 'B5', q: '多厂商混合机房要统一收集直连邻居信息，为什么首推 LLDP 而不是 CDP？', o: ['CDP 报文周期太长，默认 5 分钟才发一次', 'LLDP 不要求配置管理地址，CDP 必须先配管理地址才能跑', 'LLDP 能穿透三层路由发现远端设备，CDP 只能看直连', 'LLDP 是 IEEE 802.1AB 标准，各厂商设备都能收发解析；CDP 是思科私有，只在思科设备间生效'], a: 3, e: '标准与私有的差别是根本：LLDP 的 TLV 规范出自 802.1AB，谁都能解析；CDP 只对思科邻居可见，混厂商环境用它就「看一半」。两者都只发现直连邻居。' },
{ p: 'p-2', m: 'B5', q: 'display lldp neighbor GigabitEthernet0/0/1 回显里 Port ID 是 GigabitEthernet0/0/24、System name 是 CORE-SW-01，这两行读出什么？', o: ['本端 GE0/0/1 检测到了环回', '对端 GigabitEthernet0/0/24 划错了 VLAN', 'CORE-SW-01 离本端还有 24 跳远', '本端 GE0/0/1 的线另一头插在 CORE-SW-01 的 GigabitEthernet0/0/24 口上，接错线核对的就是这两行'], a: 3, e: 'LLDP 表项是对端填的 TLV：System name 是对端系统名，Port ID 是对端接口名——两者拼出「这根线的两头」，与规划表比对即可发现插错口。跳数与 VLAN 都不在 LLDP 信息里。' },
{ p: 'p-2', m: 'B5', q: '新核心上线后，接入交换机上联口物理 up，但 display lldp neighbor brief 始终看不到核心侧邻居，最先检查什么？', o: ['在本端加一条到核心的静态路由', '把上联口强制成 100M 半双工', '把接口 MTU 改成 9000', '两端全局 LLDP 是否都已使能'], a: 3, e: '链路 up 而邻居表空，第一嫌疑是开关：邻居表完全依赖两端周期互发报文，任一端没使能就建不起来。速率、路由、MTU 都与邻居发现无关。' },
{ p: 'p-2', m: 'B6', q: '关于 storm-control 与 loopback-detection（环路检测）的分工，正确的是？', o: ['两者等效，配了 storm-control 就不必再开环路检测和 STP', '环路检测主动发探测帧定位「环」这个根因，storm-control 被动对超阈值的风暴流量限流止血，两者要配合用', '环路检测也按阈值丢包，只是阈值单位用 pps', 'storm-control 触发说明端口一定存在物理环路'], a: 1, e: 'storm-control 只对「量」负责：ARP 攻击、蠕虫也能触发，环路不除它就一直反复触发；环路检测靠探测帧识别环路，抓的是根因。两者叠加使用，且都替代不了 STP 破环。' },
{ p: 'p-2', m: 'B6', q: 'display storm-control 显示 GE0/0/1：RateMode Percent、RateMin 5、RateMax 10、Action Block、PunishState Punished，判读正确的是？', o: ['广播超过 5% 就触发，10% 是恢复阈值', 'Punished 表示阈值配置非法，抑制未生效', '端口物理已 down，必须手工 undo shutdown 才能恢复', '广播超过 10% 触发抑制、整口报文被丢，回落到 5% 以下自动恢复'], a: 3, e: 'RateMin 是恢复下限、RateMax 是触发上限，超上限进入抑制（滞回设计防抖动）；block 是软抑制，端口物理仍 up、恢复自动完成，shutdown 动作才涉及 error-down 与人工恢复。' },
{ p: 'p-2', m: 'B6', q: '楼层全网卡顿，接入交换机多个用户口的 PunishState 反复在 Normal 与 Punished 之间跳变，正确的处置顺序是？', o: ['先按发生抑制的位置下追根因', '把广播上限阈值调大到 50%，让端口别再进入抑制', '把动作从 block 改成 shutdown，一劳永逸', '在端口上再叠加 multicast 抑制阈值'], a: 0, e: '抑制反复触发说明风暴源还在网络里，调大阈值或改 shutdown 都只是掩盖症状；先破环/隔离攻击源，止血这一步 storm-control 已经做了。查环路（G3 的 MAC flapping 口径）或镜像抓 ARP 找攻击主机（G6 口径），必要时先拔线隔离，再复置阈值。' },
{ p: 'p-3', m: 'C4', q: '分支与总部要用 IPsec 建站点到站点隧道并跑 OSPF 动态路由，为什么通常做成 GRE over IPsec 而不是纯 IPsec？', o: ['IPsec 加密算法对路由报文不支持，解密会失败', 'OSPF 协议会被运营商封禁，必须套 GRE 才能过公网', 'IPsec 感兴趣流按单播五元组匹配，OSPF 组播报文进不了加密范围，而 GRE 能封装组播', '纯 IPsec 隧道 MTU 太小，装不下 OSPF 报文'], a: 2, e: 'IPsec 按 ACL 五元组定义感兴趣流，OSPF 走组播 224.0.0.5 无法命中；GRE 能封装组播/广播，先把路由报文打包成单播 GRE 再交 IPsec 加密，两者互补。' },
{ p: 'p-3', m: 'C4', q: 'display interface Tunnel 0/0/1 看到 current state : UP 但 Line protocol current state : DOWN，最该先排查什么？', o: ['隧道口 MTU 与对端不一致', '两端隧道互连地址是否同网段', 'keepalive 未配置导致协议层起不来', '去往 tunnel destination 公网地址的路由与连通性'], a: 3, e: 'Tunnel 口物理状态恒为 UP，Line protocol UP 的前提是 tunnel destination 经公网口可达；先核公网路由与 ISP 连通，再谈隧道参数。' },
{ p: 'p-3', m: 'C4', q: 'GRE over IPsec 隧道内 ping 小包正常、ping -s 1400 不通，网页打开一半就卡住，最可能的根因与处置是？', o: ['运营商拦截 ICMP，放通所有 ICMP 即可', 'GRE 24 字节开销叠加 IPsec 后超链路 MTU 且 PMTUD 黑洞——降隧道 ip mtu 并配 MSS clamp', 'IKE SA 即将过期，重建协商即可恢复', '隧道带宽跑满，需要上 QoS 限流'], a: 1, e: '小包通、大包丢是超 MTU 报文被丢且 ICMP 不可达被吞（PMTUD 黑洞）的典型组合（案例 G28）；让 TCP 用钳小的 MSS 主动适配有效 MTU 才是根治，放行 ICMP 只是缓解。' },
{ p: 'p-3', m: 'E3', q: 'USG 双机热备里上下行业务接口各自起了 VRRP 组，为什么还必须有 VGMP 管理组？', o: ['VRRP 只保证单接口的网关冗余，VGMP 把多个 VRRP 组和监控对象捆成一组统一裁决，保证整组一起倒换', 'VGMP 用来在两台设备之间分担业务流量', 'VGMP 负责把安全策略从主机同步到备机', 'VGMP 对心跳报文做加密认证'], a: 0, e: 'VRRP 各组独立裁决，可能出现上行切了、下行没切的半倒换，流量被丢在两台墙之间；VGMP 以管理组为单位统一角色，任一监控对象故障整组倒换——这是双机热备区别于裸 VRRP 的核心。' },
{ p: 'p-3', m: 'E3', q: '主备组网巡检发现两台 USG 的 display hrp state 都显示「Role: active」，终端反馈业务时通时断，最可能的原因是？', o: ['两台设备的安全策略版本不一致', 'hrp mirror session enable 没开，会话没同步', '正常现象：主备备份组网里两台本来就都是 active', 'HRP 心跳实际不通（接口 up 但不通，如 remote 地址写错、中间交换机 VLAN 未放行），双方互判对端故障形成双主'], a: 3, e: '主备组网正常时两端角色必须互补（一台 active 一台 standby）；双双 active 是心跳断的典型指纹——接口 up 只保证物理层，先查心跳接口 remote 地址与中间二层，再查会话或优先级。' },
{ p: 'p-3', m: 'E3', q: '倒换演练后 SSH/HTTPS 业务无感，但视频会议全部重连；display hrp state 两端角色互补、策略也同步了，最可能的缺口是？', o: ['备机 CPU 过高，没接住倒换', '缺省 HRP 只备份 TCP 会话，UDP 会话没同步', '心跳接口带宽不足，Hello 报文被挤丢导致状态震荡', '视频会议的安全策略没放行 RTP 端口，补策略即可'], a: 1, e: 'TCP 业务无感、UDP/ICMP 业务倒换即断，是「会话同步缺省只备 TCP」的指纹：新主会话表里没有 UDP 流，直接丢包强制重连。若是端口没放行，TCP 信令也会断，与 SSH/HTTPS 正常矛盾。补 hrp mirror session enable 开快速备份。' },
{ p: 'p-4', m: 'I5', q: '同一条 TCP 长连接持续传输了 40 分钟，NetFlow 采集器里却出现几十条流记录，正确的理解是？', o: ['活跃超时到期会强制把仍在进行的连接切成多条记录导出，各条量值累加才是总流量', 'v9 模板没同步，采集器解码出错把一条流显示成多条', '设备发生丢包重传，把连接拆散了', '只有 sFlow 会拆分，NetFlow 一定是采集器配错了'], a: 0, e: '流不是「一个连接一条记录」：超过活跃超时（常配 1 分钟）就强制导出并在新流中继续累计，不活跃超时也会收尾；按五元组聚合累加看总量，别拿记录数当连接数。' },
{ p: 'p-4', m: 'I5', q: 'show ip flow export 已显示 Exporting flows to 198.51.100.10 (2055)，但 flows exported 恒为 0 且采集器收不到包，最先该做什么？', o: ['抓采集器侧防火墙日志，查 UDP 2055 拦截', '在入口接口启用 ip flow ingress，让流缓存里先有流可导', '升级采集器到 ElastiFlow', '把导出版本从 9 改成 5 再观察'], a: 1, e: '目的地配置正确不等于有流可导：没有任何接口启用流采集时缓存为空，导出计数恒 0。先在入口接口开 ip flow ingress 看计数增长；计数增长后仍收不到，才转向查 UDP 2055 连通性与防火墙。' },
{ p: 'p-4', m: 'I5', q: '出口带宽凌晨突增，SNMP 只见接口总流量飙高；要最快回答「哪台内网主机、连到哪个目的、什么协议」，选哪条路径？', o: ['出口设备开 NetStream/NetFlow 导流，用 nfdump 按 srcip/bytes 出 TopN 排序', '把 SNMP 采样间隔调到 30 秒再看图', '在核心交换机做全量端口镜像抓包离线分析', '逐台主机 ping 大包测时延定位'], a: 0, e: 'SNMP 只有接口字节总量，没有「谁」；全量镜像成本高且难回溯历史。流记录自带五元组，TopN 聚合直接给出谁、到哪、什么协议，还能翻历史归档对基线。' },
{ p: 'p-4', m: 'I6', q: 'Trap 告警秒级可达，为什么关键设备仍必须保留周期轮询兜底？', o: ['trap 只能上报接口事件，CPU 状态必须靠轮询取', 'trap 是 UDP 单向不重传，接收端重启或链路中断窗口内会永久丢失，轮询保证最终覆盖', '轮询比 trap 到达更快，只是成本高', 'trap 会占用设备转发带宽，轮询不影响业务'], a: 1, e: 'Trap 管「快」、轮询管「全」：UDP 无确认无重传，丢窗内的 trap 不会补发，「没收到 trap」不等于「没发生」，必须靠下一轮轮询把状态补全；CPU 越限同样有 trap，B/C/D 均不成立。' },
{ p: 'p-4', m: 'I6', q: '设备已配 snmp-agent community 且执行了 snmp-agent trap enable，网管却收不到任何 trap，下一步最该查什么？', o: ['display cpu-usage 看设备负载', 'display snmp-agent target-host 看是否配了目标接收端', 'display interface brief 看端口状态', 'display snmp-agent trap-list 看各模块开关'], a: 1, e: '开 trap enable 只决定「发什么」，target-host / snmp-server host 决定「发给谁」——漏配目标地址设备永远不上发且无任何报错，这是「网管无告警」最常见根因；trap-list 只回答模块开关。' },
{ p: 'p-4', m: 'I6', q: '机房断电恢复后，网管只收到设备重启后的 trap，断电前 1 分钟内一条接口 down 告警都没有，最合理的解释是？', o: ['重启后 securityname 被设备重新随机生成', '断电窗口内链路不通，UDP trap 不重传也不会补发，需靠轮询确认断电期间的实际状态', '设备重启清空了 SNMP 配置', '网管侧把 linkDown OID 过滤掉了'], a: 1, e: 'trap 依赖网络可达且不重传：断电窗口内发出的 trap 自然丢失，这是固有短板而不是过滤或配置问题；SNMP 配置保存后重启不会丢（A），剩余 trap 也没被过滤（C/D 无依据）。' },
{ p: 'p-2', m: 'A9', q: '为什么在 IGMPv1 接入下，已经没有人观看的 IPTV 频道，组播流还会持续几分钟才停？', o: ['v1 的 Report 报文被二层设备丢弃，路由器误以为仍有成员在线', 'IGMPv1 没有 Leave 报文，路由器只能等周期查询无人应答后按老化超时收回该组', 'IGMPv1 的查询间隔配置过小，导致老化计时器被反复重置', '组播流本身没有停止机制，只能等接收端 RTP 会话超时'], a: 1, e: 'v1 协议里根本没有定义离开报文，路由器不知道成员走了，只能等 Query 无人应答再按老化超时（默认 60 秒查询间隔 × 老化倍数，分钟级）停流；v2 引入 Leave + 特定组查询才缩到秒级。B/C 无协议依据，D 的现象是学不到组而不是停不下来。' },
{ p: 'p-2', m: 'A9', q: '末跳路由器 display pim routing-table 看到 (*, 239.1.1.1) 表项，下游 Vlanif10 的 Protocol 显示 igmp、Expires 为 00:02:31，最可靠的判断是？', o: ['RP 已不可达，表项即将被删除', '该组播流已经在 SPT 上转发，RP 不再参与这条流', '该表项来自静态组播路由配置，不会自动老化', 'Vlanif10 下有接收者通过 IGMP 加入该组，且成员关系还在正常刷新'], a: 3, e: '下游 Protocol=igmp 表示这条共享树分支由接收端的 IGMP 成员关系驱动，Expires 有倒计时且与 IGMP 成员表同源，说明成员在正常老化/刷新；是否走 SPT 要看 (S,G) 表项的 SPT 标志，静态加入不会带 igmp 协议标识和到期时间。' },
{ p: 'p-2', m: 'A9', q: '某频道黑屏，接收端播放器显示正在加入，但末跳路由器 display igmp group 和 display pim routing-table 都看不到该组，同一 VLAN 其他频道正常，最先查什么？', o: ['把 PIM-SM 改成 PIM-DM 用泛洪保证可达', '把 IGMP 升级到 v3 以获得源过滤能力', '全网重新统一静态 RP 并重启 PIM 进程', '检查接入交换机 IGMP Snooping'], a: 3, e: '三层两张表都为空说明 IGMP Report 根本没到达路由器，问题卡在二层链路（Snooping 未启用、端口没学进组表或未知组丢弃策略），RP 和 PIM 此时还没被用到；换协议或升级版本治不了「Join 上不去」。其他频道正常也印证 RP/PIM 全域配置没问题。该 VLAN 是否启用、成员端口和路由器端口有没有学到。' },
{ p: 'p-2', m: 'B7', q: '同样是两台核心交换机做网关高可用，M-LAG 与 iStack/CSS 堆叠最本质的差别是什么？', o: ['M-LAG 的成员链路之间要靠 STP 阻塞防环，堆叠不需要', 'M-LAG 必须叠加 VRRP 才能选主备，堆叠不需要任何协议', 'M-LAG 下游设备的 Eth-Trunk 同一时间只有一条成员链路能转发，堆叠可以全部转发', 'M-LAG 的两台设备控制面彼此独立，配置与升级各做各的，靠 dfs-group/peer-link/keepalive 协同；堆叠则把控制面合为一台逻辑设备，一份配置、整组升级'], a: 3, e: 'M-LAG 是「转发双活、控制面独立」：两台各是独立设备（各一份配置、各一个升级窗口），靠 dfs-group/peer-link/keepalive 协同，下游因统一 LACP system ID 而看成一台；堆叠是控制面合一的「真·一台」，代价是升级整组重启并要防堆叠线脑裂。B 错：M-LAG 双活网关不依赖 VRRP；C 错：M-LAG 靠 peer-link 绕行标记防环，成员口不靠 STP 阻塞；D 把两者说反了，M-LAG 成员链路正是全活转发。' },
{ p: 'p-2', m: 'B7', q: '在 M-LAG 备机上执行 display dfs-group 1 m-lag：Heart beat state 为 OK、本机 State 为 Backup，但本机 M-LAG 成员口全部 error-down。最可能的原因是？', o: ['peer-link 故障', '下游设备 LACP 超时，成员口协商失败被 error-down', '对端设备改了更高优先级，触发了主备抢占回切', 'keepalive 链路断了，DFS 备机主动关闭成员口等待仲裁'], a: 0, e: '心跳 OK 而 M-LAG 成员口被联动关闭，正是 peer-link 故障的标志性组合：DFS 主备还能经 keepalive 互知，谁也不抢主，但为防「两台都转发同一虚 MAC」造成双主，备机会把自己的 M-LAG 成员口 error-down，流量全走主机；peer-link 恢复后按延迟恢复定时器自动拉起。keepalive 单独断不会关成员口（A），改优先级/抢占不会产生 error-down（C），LACP 失败是协商 down 而非 DFS 联动关口（D）。心跳仍通说明双机互知，备机为防双主自动关闭自己的 M-LAG 成员口，业务收敛到主机。' },
{ p: 'p-2', m: 'B7', q: '割接施工后两台 M-LAG 核心告警：互查 display dfs-group 1 m-lag 两台的 State 都是 Master、Heart beat state 异常，部分终端网关时通时断；施工记录显示只动过一束光缆。最合理的判断是？', o: ['下游终端中了 ARP 病毒泛洪，把网关 MAC 表学乱了', 'keepalive 单独中断导致双主，恢复 keepalive 即可，peer-link 不受影响', 'peer-link 与 keepalive 共沟、被同一束光缆波及而双通道齐断，双方都判对端失联各自升主（脑裂），需恢复任一通道并人工裁决主备', 'VRRP 抢占导致两台都想当网关，先关闭抢占再排查'], a: 2, e: '两台互查都 Master 且心跳异常，是 peer-link 与 keepalive 双通道齐断的典型脑裂征兆：单断 peer-link 时备机会关闭成员口而非抢主，单断 keepalive 业务无感，所以 A 的「单断就双主」不成立；B 无关，M-LAG 双活网关不靠 VRRP；D 无法解释两台 State 双 Master。规范做法是 keepalive 与 peer-link 物理分离（keepalive 常走独立三层链路或管理网），恢复任一通道后按优先级/人工裁决收敛双主，再核对 error-down 与恢复定时器。' },
{ p: 'p-2', m: 'B8', q: '关于 MACsec（802.1AE）与 IPsec 的定位差异，说法正确的是？', o: ['MACsec 加密后路径中间的交换机也看不到明文，等效于端到端加密', 'MACsec 在网络层端到端加密，IPsec 在链路层逐跳加密，两者层次正好相反', 'MACsec 需要应用改造才能加密，IPsec 对所有应用透明', 'MACsec 保护以太网帧、在两台直连设备间逐跳生效；IPsec 工作在网络层，可跨多跳端到端建立'], a: 3, e: 'MACsec 在二层，作用对象是以太网帧，逐跳（直连对端）生效；IPsec 在三层，可跨任意多跳端到端。A 把层次说反了；MACsec 对应用完全透明，无需改造，C 反了；逐跳意味着中间每台设备都解密再加密、看得到明文，D 是对 MACsec 模型最常见的误解。' },
{ p: 'p-2', m: 'B8', q: '两端静态 CAK 下发后，display macsec 回显里 MKA Session Status 一直是 init，收不到对端 MKPDU，业务流量不通。最先核对什么？', o: ['重放窗口是否被设成了 0', '加密套件是否必须选 gcm-aes-256', '两端 key chain 的 CKN/CAK 是否逐字符一致，EAPOL 报文是否被端口安全或 ACL 拦截', '两端接口的协商速率与双工是否一致'], a: 2, e: 'MKA 起不来且收不到 MKPDU，根因集中在「握手前提」：静态 CAK 模式靠同一对 CKN/CAK 建立信任，任何一端不一致都会静默失败；EAPOL（0x888E）被拦则协商报文根本到不了对端。速率差异、套件选 128 还是 256、重放窗口大小，都不会导致会话完全建立不起来。' },
{ p: 'p-2', m: 'B8', q: 'DCI 裸纤两端开启 MACsec 后巡检发现：业务大包（1500 字节）丢包、小包正常，链路错包计数为 0。最可能的原因与修法是？', o: ['MACsec 每帧增加约 24 字节（SecTAG+ICV）开销，两端应同步下调 MTU（如 1500→1470）保证端到端口径一致', '重放窗口 0 过于严格导致乱序丢包，应放大重放窗口', 'MKA 会话没建好导致大帧被丢弃，重新下发一遍 CAK 即可', 'AES-GCM 算法太重导致硬件转发丢包，应改成仅校验不加密模式'], a: 0, e: '「小包通、大包丢、错包计数为 0」是典型的净荷口径问题：MACsec 在帧内加约 8B SecTAG 加 16B ICV，原来 1500 字节的净荷现在装不下，超限帧被丢弃。修法是两端同步下调 MTU 或统一端到端口径，与 G28 的 MTU 排障思路一致。加密由硬件线速完成（B），重放窗口只影响乱序帧（C），MKA 没建立时大小包都不通（D），均与现象对不上。' },
{ p: 'p-3', m: 'C5', q: 'SD-WAN 里「Overlay 隧道跑在 Underlay 上」，两层各自的职责是？', o: ['Underlay 负责加密数据，Overlay 负责路由收敛', 'Overlay 就是运营商的 MPLS 专线本身', '两层都必须运行 BGP 才能互通', 'Underlay 只负责底层可达性，Overlay 在其上构建隧道逻辑网，负责加密、业务隔离与智能选路'], a: 3, e: '与词汇表口径一致：Underlay 是承载隧道的底层物理网（MPLS/互联网），只管把包送到对端；Overlay 是其上由 IPsec 等隧道构建的逻辑网，业务策略、加密与选路都发生在这一层。' },
{ p: 'p-3', m: 'C5', q: '站点探测结果：互联网隧道抖动 35ms、丢包 0.1%；MPLS 隧道抖动 3ms、丢包 0.1%。策略模板里视频会议要求抖动 ≤20ms 且优先 MPLS。可判定？', o: ['两条链路丢包率相同，流量继续五五分担', '控制器会自动把阈值放宽到 40ms', '抖动超标的互联网链路会被自动 shutdown', '视频会议流量会被切到 MPLS 隧道转发'], a: 3, e: '智能选路按「应用类别 + SLA 阈值 + 链路探测值」三要素决策：互联网隧道抖动 35ms 超过 20ms 阈值，命中关键业务的流量切换到达标的 MPLS 隧道；阈值在模板里定义不会自动放宽，探测越界也只会切流，不会物理 down 链路。' },
{ p: 'p-3', m: 'C5', q: 'SD-WAN 分支反馈：大文件传输时断时续几乎传不动，ping 小包正常，SLA 探测丢包率也是 0。下一步最该做什么？', o: ['把 SLA 探测阈值调大，让流量不再切换', '立即更换互联网运营商链路', '用 ping -f -l 1300 做不分片探测，验证隧道 MTU，超标则降 MTU 并钳 MSS（同 G13）', '重装控制器并重新下发全部策略模板'], a: 2, e: '小包通、大包丢、小包探测丢包为 0 是 PMTUD 黑洞的典型指纹：Underlay 加 IPsec 等封装头后 1500 链路上的超大包被丢，而探针默认小包所以显示正常（同 G13）；处置是隧道口降 MTU + tcp adjust-mss 钳 MSS。换链路、调阈值都不解决封装开销问题。' },
{ p: 'p-3', m: 'E4', q: '同样是远程接入，为什么「员工在家访问内部 Web 应用」常选 SSL VPN，而「分支机构与总部互联」选 IPSec？', o: ['SSL VPN 加密强度不如 IPSec，所以只敢用于临时访问', 'IPSec 不能跨公网使用，只能跑专线，所以分支机构必须拉专线', 'SSL VPN 接入后用户自动获得整网路由，授权粒度比 IPSec 更粗', 'SSL VPN 架在 TLS/443 上，出口无需额外放行、按应用/端口授权给「人」；IPSec 在网络层封装、隧道起来整网可达，适合「网对网」'], a: 3, e: 'SSL VPN 面向人：TLS/443 天然穿过 NAT 和只放网页的出口，角色里勾什么用什么，最小暴露；IPSec 面向网：网络层封装整网可达，适合固定站点互联。B 的说法不成立，C 错在 IPSec over Internet 是常态，D 把粒度说反了——SSL VPN 才是细粒度授权。' },
{ p: 'p-3', m: 'E4', q: 'SSL VPN 全通模式接入后，ping 内网网关正常、小文件能传，但打开内网 OA 大页面一直转圈、大附件传到一半卡死。最该先做哪一步？', o: ['把内网 OA 服务器重启一次', '用大小 ping 包对比后调低虚拟网卡 MTU/MSS（或网关侧调分片）', '把用户角色里 OA 的授权去掉重新下发', '在终端卸载重装 VPN 客户端'], a: 1, e: 'TLS 封装叠加 IP 头使有效 MTU 缩水，超 MTU 且带 DF 位的报文被丢——表现为 ping 通、小请求正常、大页面/大传输卡死。先用大小包对比坐实，再调低 MTU/MSS；B/D 与「小包正常」矛盾（授权没通连 ping 都不该通），C 是无依据的玄学操作。' },
{ p: 'p-3', m: 'E4', q: '用户一边连本地有线网、一边拨 SSL VPN（双网卡），接入后内网业务反而全部不通；断开本地网卡立即恢复。下一步怎么查？', o: ['把该用户的角色改成全通模式再试', '把 VPN 网关的 443 端口改成 8443 重新拨号', '在防火墙上给该用户换一个虚地址池', 'route print 看推送的业务网段命中的是物理网卡还是虚拟网卡'], a: 3, e: '本地默认路由与 VPN 推送路由重叠时，跃点更小的一方抢走流量，内网目的地址被拽到物理网卡出不去——断开本地网卡即恢复正是这个机制的指纹。查 route print 的接口归属坐实后，改跃点/禁本地网卡或让客户端接管路由；B/C 与路由归属无关，D 只是模式差异，冲突依旧。' },
{ p: 'p-3', m: 'E5', q: '行为管理设备以旁路镜像方式接在出口交换机旁，管理员在策略里勾选「禁止 P2P」，用户却照常高速下载。最根本的原因是？', o: ['旁路镜像只复制报文供审计，设备不在转发路径上，丢包动作无从执行', 'P2P 走 UDP 传输，行为管理设备默认只处理 TCP 流量', '特征库没有收录该 P2P 协议特征，升级特征库即可阻断', '镜像口没配双向（both），设备只看到单方向流量，缺少阻断依据'], a: 0, e: '旁路部署时设备只是旁观者，交换机按原路转发报文，策略里的阻断动作根本没有执行点——这是部署形态问题，不是识别或协议问题。现象里报表已能标出 P2P 流量，说明识别正常，升级特征库（A）无济于事；C 只影响审计完整性；D 不成立。' },
{ p: 'p-3', m: 'E5', q: '行为管理设备升级特征库并开启 SNI 嗅探后，报表里「未知加密流量」仍有约 8%；抓包发现这些流量的 ClientHello 携带 encrypted_client_hello 扩展。最合理的解释是？', o: ['特征库版本仍旧，再升级一轮即可识别这些域名', '这些流量都是恶意行为，应直接在出口封禁整个 443', '镜像口带宽不足导致丢包，识别所需的握手信息缺失', '这些客户端启用了 ECH'], a: 3, e: 'encrypted_client_hello 扩展说明 ClientHello（含 SNI）已被 ECH 加密，明文层面无字段可看，升级特征库（A）救不了不存在的字段；C 过激且误伤全部业务；D 与扩展字段的存在矛盾，丢包也不会精确只命中这 8%。HTTPS 时代的识别天花板正在于此：正文加密后剩 SNI，ECH 连 SNI 也拿走。SNI 本身被加密，嗅探路径到头，设备只能按目的 IP 与流量特征粗分，无法还原真实域名。' },
{ p: 'p-3', m: 'E5', q: '单位启用上网审计后，出口出现大量指向境外公共 DoH 服务 443 端口的加密连接，且部分终端内网域名解析偶发失败。最完整的处置组合是？', o: ['调高这类流量的审计级别，详细记录后观察一个月再定', '在出口封禁 UDP 53，禁止一切 DNS 出网即可杜绝绕过', '只在内网 DNS 上把 DoH 服务商域名加入黑名单，不管 IP 直连', '出口封堵已知 DoH/DoT 提供商的目的 IP 与 SNI，同时内网强制 DNS 走内部解析（DHCP 下发 + 终端策略），再用账号-IP 映射归因到人'], a: 3, e: 'DoH 首次靠域名引导、之后全是 IP 直连 443 的加密解析——B 只挡域名引导挡不住直连；C 杀掉正常出口解析，且对走 443 的 DoH 完全无效；D 只看不堵，逃逸照旧。A 两头堵（出口断外部 DoH/DoT + 内网收紧 DNS，与 Z14 的 DNS 治理同源）再归因到人，才是闭环。' },
{ p: 'p-4', m: 'J4', q: 'Docker 四种网络模式中，哪一种与 K8s Pod 内多容器共享同一个网络栈的机制同源？', o: ['bridge', 'none', 'host', 'container'], a: 3, e: 'container 模式（--network container:xxx）让新容器加入已有容器的 netns，lo 和全部接口共享——K8s Pod 里 pause 容器持网络栈、业务容器加入，正是这一机制的编排化；bridge 是各自独立栈（A），host 共享的是宿主栈而非容器间互借（B），none 只有 lo（D）。' },
{ p: 'p-4', m: 'J4', q: '宿主机 ip -br link 输出里有一行 veth8f3a1c2@if11，正确的判读是？', o: ['这是宿主机上的一块独立物理网卡', '这是容器回环口在宿主机上的投影', '这是 veth-pair 的宿主端，对端 if11 对应某个容器内的 eth0', '这就是 docker0 网桥本身'], a: 2, e: 'veth-pair 永远成对：@if11 表示对端接口序号 11，进入对应容器 netns 执行 ip link 可看到 eth0 的 ifindex 正是 11；docker0 是网桥不是 veth（C），物理网卡不会带 @ifN 后缀（A），回环口不跨命名空间（D）。' },
{ p: 'p-4', m: 'J4', q: '服务器所在办公网段是 172.17.8.0/24。装完 Docker 后 -p 8080:80 发布的容器本机 curl 127.0.0.1:8080 正常，同事电脑访问服务器 IP:8080 全部超时，最可能的根因是？', o: ['8080 端口被宿主机其他进程占用', 'docker0 默认网段 172.17.0.0/16 与办公网重叠，回程流量被直连路由截回网桥', 'docker-proxy 进程崩溃，需要重启容器', '容器内 nginx 没有监听 0.0.0.0'], a: 1, e: '网段重叠时外部连接经 DNAT 到达容器，但回包在宿主机命中 172.17.0.0/16 dev docker0 这条直连路由，被送回网桥而不是原路发往客户端，SYN-ACK 有去无回表现为超时；本机 curl 走本地路径不受影响（B 为何本机正常的反证）。监听问题（A）和端口占用（D）通常直接拒绝而非超时，且本机也会异常。判据：ip route 里 172.17.0.0/16 dev docker0 覆盖办公网段，daemon.json 配 default-address-pools 换网段后恢复。' },
{ p: 'p-4', m: 'I7', q: '分支与中心之间已有专线互通，为什么网管对接仍要在分支放一台 Zabbix proxy，而不是所有设备直接对接中心 server？', o: ['proxy 用来减少需要购买的 agent 数量', 'proxy 能把 SNMP 协议翻译成 agent 协议，没有 proxy 交换机没法被监控', 'WAN 抖动/断链时 proxy 本地缓存采集数据、恢复后补传，保证中心曲线无缺口，采集流量也收敛在分支出口', 'trap 只能发给 proxy，server 没有收 trap 的能力'], a: 2, e: 'proxy 的核心价值是断链续传（ProxyOfflineBuffer 控制缓存时长）与采集下沉：WAN 短暂中断不缺数据；网络设备走 SNMP 本就不需要 agent（A）；server 侧同样能收 trap（C）；proxy 与 agent 数量无关（D）。' },
{ p: 'p-4', m: 'I7', q: '核心交换机重启后，某业务端口的流量曲线仍在更新，但数值与现场实测对不上且出现异常尖峰，item 的 ifName 显示正常，最可能的原因是？', o: ['SNMP community 重启后被清空', 'proxy 缓存溢出导致补传错位', 'Zabbix server 与设备时钟不同步', '重启导致 ifIndex 重排，LLD 生成的 item 还按旧索引取数，实际读到的是另一个接口'], a: 3, e: 'ifName 是描述符不会变，ifIndex 才可能重排——item key 锚在 ifIndex 上时重启后就指错端口；判据是重启前后 snmpwalk ifIndex↔ifName 对照。修复是锚定改 ifName/ifAlias 后重新发现；32 位计数器回绕是另一类尖峰成因（衔接 I2），高速口用 64 位计数器。' },
{ p: 'p-4', m: 'I7', q: 'Zabbix 上某交换机的全部 SNMP item 突然转 Unsupported/超时，但该设备触发的 linkDown trap 仍能正常到达网管，下一步最该先查什么？', o: ['display cpu-usage / show processes cpu 看设备是否过载', '网管到设备的 UDP 161 轮询方向是否被 ACL 拦截、community 是否与设备一致', 'proxy 的 ProxyOfflineBuffer 是否设置过小', 'Zabbix server 的数据库磁盘是否写满'], a: 1, e: 'trap 能到只证明设备→网管的 162 上行通；轮询要求网管→设备的 161 下行可达且 community/安全名匹配，两个方向独立，先手工 snmpget 打一枪即可二分。过载（A）通常是个别 OID 超时而非全红，库满（C）会影响所有主机，断链续传与单机采集异常无关（D）。' },
{ p: 'p-1', m: 'Z3', q: '终端 A（10.1.1.5/24）与终端 B（10.1.1.130/25）接在同一台交换机同一 VLAN，互 ping 的现象最可能是？', o: ['只有广播能互通，单播全丢', '双向都通，只是掩码提示不一致', 'A 能 ping 通 B；B 回 A 时按自己的 /25 判跨网段去找网关，表现为单向可达或时通时断', '双向都超时，交换机端口被 err-down'], a: 2, e: 'A 按 /24 判 10.1.1.130 同段、直接 ARP 对端；B 按 /25 判 10.1.1.5 跨段、去 ARP 网关——前缀判断不对称。两端掩码必须一致，「A 通 B 不通」先查两端前缀长度。' },
{ p: 'p-1', m: 'Z3', q: '终端 IP 192.168.10.20/24，默认网关误填 192.168.20.1。最典型的现象是？', o: ['同段互 ping 通、跨段全不通，arp -a 学不到网关 MAC', '上外网偶发丢包', '终端拿不到 IP，退回 169.254 自动配置', 'DNS 正常但 HTTPS 打不开'], a: 0, e: '网关必须与终端在同一前缀内：网关不在本机前缀时主机不会为它发 ARP，默认路由无从生效。判据：先核对掩码与网关是否同前缀，再 arp -a 看网关 MAC 是否学到。' },
{ p: 'p-1', m: 'Z3', q: '跨网段访问时，服务器收到的报文里，二层源 MAC 与三层源 IP 分别是？', o: ['全 0 的 MAC 与源主机的 IP', '源主机的 MAC 与第一跳网关的 IP', '源主机的 MAC 与源主机的 IP（二层端到端保持）', '最后一跳网关出接口的 MAC 与源主机的 IP'], a: 3, e: '每一跳都重写二层：对服务器而言发来报文的是它自己的网关，源 MAC 是该网关出接口；三层源 IP 全程不变——「网关只管第一跳、中间路由看不到源主机 MAC」的另一面。' },
{ p: 'p-1', m: 'Z4', q: '「ping 得通网关、业务端口却连不上」，在防火墙上最该查哪张表？', o: ['MAC 表', '路由表', '会话表：看有没有对应五元组的会话，没有再回到策略逐条核对', 'ARP 表'], a: 2, e: '三层可达只证明路由与 ICMP 通；防火墙首包匹配策略建会话、回程靠会话自动放行——ICMP 常被单独放而 TCP 端口没放。MAC/ARP 表是二层同段问题才查的。' },
{ p: 'p-1', m: 'Z4', q: '交换机每个端口是独立冲突域，但默认所有端口仍在同一个广播域。切分广播域靠什么？', o: ['划分 VLAN，VLAN 间再经三层接口（VLANIF/单臂路由）互通', '开启 STP', '提高背板带宽', '把双工改成全双工'], a: 0, e: '全双工解决冲突域，广播域要划 VLAN 才切开；跨 VLAN 通信必须经三层——「同一网段却不通」常出在网关侧。STP 防环，与广播域无关。' },
{ p: 'p-1', m: 'Z4', q: '三层交换机上排障，「该查 MAC 表还是路由表」的第一步判断是？', o: ['先判定流量同段还是跨段', '先重启再看是否恢复', '看设备型号档次', '看端口速率协商'], a: 0, e: '现代设备界限模糊（三层交换机同时有两张表），判据就是流量方向：同段走二层、跨段走三层、过防火墙再加会话表，逐层收窄。同段查 MAC 表，跨段查路由表。' },
{ p: 'p-1', m: 'Z8', q: 'display startup 显示 Next startup 是 vrpcfg.cfg，dir 里却只有 vrpcfg.zip。说明什么风险？', o: ['zip 会被忽略，设备空配置启动属正常', '下次启动指向的文件不存在，到重启那一刻才暴露', '下次启动会自动解压 zip 兜底，无风险', '只影响日志文件，不影响配置'], a: 1, e: '部分平台指定启动项时不做强制存在性校验，名字对不上文件要到重启才炸；示例正是「Next startup 写 cfg 而 Flash 里只有 zip」的不一致，reboot 前再验一次。' },
{ p: 'p-1', m: 'Z8', q: 'Flash 里清文件，delete 与 delete /unreserved 的本质差别是？', o: ['/unreserved 会先备份到远端服务器', 'delete 只删配置，/unreserved 只删日志', '没有差别，都立即物理删除', '默认 delete 进回收站、可用 undo delete 找回；/unreserved 直接删除不可恢复'], a: 3, e: '删除重要文件前先 copy 到远端留底，删除后 dir 复核；回收站里有要保留的文件先 undo delete 恢复，再 reset recycle-bin 清空。' },
{ p: 'p-1', m: 'Z8', q: '升级只换了系统软件、没核对配置启动项，重启后最可能的后果与正确动作是？', o: ['只影响 License', '版本对了但配置缺失或部分失效——display startup 两行全核对，并保留旧软件包+旧配置作回滚组合', '配置会随新版本自动迁移，无需动作', '设备直接无法开机'], a: 1, e: '系统软件与配置是两条独立启动项指针，互不覆盖；版本更替可能伴随配置格式差异。回滚组合（旧软件+旧配置）必须在 Flash 或远端服务器上找得到。' },
{ p: 'p-2', m: 'A2', q: 'Vlanif 接口 display ip interface brief 显示 Physical 为 down，最直接的原因是？', o: ['该 VLAN 里没有任何活动的成员物理口', '没配策略路由', 'MAC 表为空', 'VLAN ID 太大'], a: 0, e: 'Vlanif 的 Physical 列看 VLAN 里有没有活动成员口，Protocol 列看本端 IP/协议状态；两列全 up 才是可用网关——先看这两列再谈策略路由。' },
{ p: 'p-2', m: 'A2', q: '策略路由 redirect 指定的下一跳失联，策略未联动 track/NQA。现象是？', o: ['报文改为广播泛洪', '策略命中计数照常增长，业务持续中断（引流黑洞）', '策略自动失效并告警', '流量自动改走路由表'], a: 1, e: '不带 track 联动的重定向不感知下一跳死活，报文反复 ARP 解析失败被丢而命中计数照涨——「计数在涨、业务全断」并存时先查下一跳 ARP 与 track；华为联 NQA/track，Cisco 用 set ip next-hop verify-availability。' },
{ p: 'p-2', m: 'A2', q: 'PBR 只在入口把去程引向新链路，回程未做对等策略。过防火墙/会话型 NAT 的业务会怎样？', o: ['只有 UDP 受影响', '去回路径非对称，防火墙/会话型 NAT 上表现为「有去无回」', '完全正常', '带宽自动翻倍'], a: 1, e: 'PBR 只影响本设备出向，对端回包按它自己的路由表走；非对称路径下防火墙等不到匹配的回程。判据：去回两侧各抓一次包对比路径，回程设备补对等策略。' },
{ p: 'p-2', m: 'A5', q: '想让整个 AS 的出向流量统一走某条线，应该改哪个属性？', o: ['Local_Pref——在希望走的那条线入向调大，随 IBGP 传播全 AS', 'MED——发给邻居 AS 让它优选', 'Weight——Cisco 本机有效，不传给 IBGP 邻居', 'Origin 改成 incomplete'], a: 0, e: 'Weight 是 Cisco 本地有效值（华为对应 preferred-value），不随 IBGP 传播；AS 内统一选向用 Local_Pref（缺省 100、越大越优）。方向别写反：import 管收到的路由，挂错邻居等于抬高别人。' },
{ p: 'p-2', m: 'A5', q: '应用 route-policy 后，一批路由从 BGP 表里消失了。最可能的原因是？', o: ['路由自动聚合生效', 'Local_Pref 值溢出', '邻居被 shutdown', '所有节点 if-match 都未命中，按末尾隐式 deny 被丢弃（不收不发）'], a: 3, e: 'route-policy 节点逐个尝试匹配，全部未命中按隐式 deny 收尾。判据：display route-policy 看各节点匹配计数；补救是在末尾补一个不带 if-match 的 permit node 显式兜底。' },
{ p: 'p-2', m: 'A5', q: 'MED 调小了，跨两个 AS 比较选路却始终不生效，为什么？', o: ['MED 缺省只在同一邻居 AS 学来的路由间比较，跨 AS 要显式放开（华为 compare-different-as-med / Cisco bgp always-compare-med）', 'MED 只能用于 EBGP 邻居', 'MED 越大越优', 'MED 不参与选路'], a: 0, e: '先看两条候选路由的 AS_Path 是否同源；跨 AS 调度改用 Local_Pref 或 AS_Path 长度，而不是指望 MED 缺省跨 AS 比较。' },
{ p: 'p-2', m: 'A6', q: '接入口没有配置 BPDU 保护/根保护，下游私接了一台优先级更高的交换机，最可能的后果是？', o: ['无影响，STP 自动忽略', '端口自动 err-down', '立即广播风暴打死全网', '私接交换机竞选根桥成功，全网转发路径被抢着绕远'], a: 3, e: '没有保护时下游 BPDU 照常参与竞选、可能抢走根桥，转发路径绕远；防私接要配 BPDU 保护/根保护。注意与「边缘端口收到 BPDU 失去 edge 属性」是两件事，别混为一谈。' },
{ p: 'p-3', m: 'C3', q: '两个客户的 VRF 都要用 10.0.0.0/8 私网地址，L3VPN 靠什么让重叠前缀在骨干上全局唯一？', o: ['每个客户独立进程号', 'RD 把 IPv4 前缀拼成全局唯一的 VPNv4 前缀，RT 再决定进哪个 VRF', 'VLAN 隔离', '骨干全网大范围 NAT'], a: 1, e: 'RD（路由区分符）解决「唯一」，RT（导入/导出目标）解决「去哪」，两端 export/import 必须成对匹配。客户路由只存在于 PE 实例里，骨干 P 路由器完全不感知。' },
{ p: 'p-3', m: 'C3', q: '本端 PE 的 VRF 表里有 CE 路由，对端 PE 的 VRF 表却是空的。先核对什么？', o: ['CE 侧 ACL', '两端 vpn-target 的 export/import 是否成对取值一致', 'P 路由器有没有加客户路由', '接口 MTU'], a: 1, e: 'RT 不对称是 L3VPN 最常见断点：display bgp vpnv4 all 里本端前缀已发布、对端收不到就是 RT 匹配失败。另一常见断点是 VRF 里缺回程路由——标签通路与客户路由要分段排查。' },
{ p: 'p-3', m: 'C3', q: '关于 P 路由器在 L3VPN 中的角色，正确的是？', o: ['必须运行客户的 IGP', '要为每个客户维护 VRF 路由表', '只按外层标签把包送到对端 PE，完全不感知客户路由', '负责 RT 的导入导出'], a: 2, e: '两层标签分工：外层（IGP/LDP）送到对端 PE，内层告诉对端 PE 丢进哪个 VRF/出接口，转发只看外层——这正是「客户路由只存在于 PE 实例里」的含义。' },
{ p: 'p-3', m: 'L2', q: 'WPA2-PSK 的加密套件必须选什么？', o: ['WEP104', 'TKIP，兼容老网卡', 'AES-CCMP；不要再叠加 TKIP', 'GCMP-256'], a: 2, e: 'CCMP 是 WPA2 标配；GCMP-256 属于 WPA3（SAE）一代；TKIP 是早该关掉的兼容模式。从 TKIP 混合模式改纯 AES 后，终端要「忘记网络」重输口令。' },
{ p: 'p-3', m: 'L2', q: '双频同名 SSID 下，支持 5G 的手机始终粘在 2.4G。正确的解读与处置是？', o: ['同名 SSID 由终端自主选频，2.4G 更「耐连」——降 2.4G 功率/基础速率引导，或干脆分 SSID', '把信道调到 13 即可', '必须把 2.4G 整个关闭', 'AP 的 5G 射频故障'], a: 0, e: '同名时选频权在终端，它不会主动切向信号弱一点的 5G；AC 上按终端查关联频段核实后用功率/基础速率引导。这不是射频故障。' },
{ p: 'p-3', m: 'L2', q: '访客 SSID 与办公 SSID 隔离失效，访客能摸到办公网段。根因通常在哪？', o: ['两个 SSID 绑了同一业务 VLAN 或没做二层隔离', 'SSID 名字不够隐蔽', 'PSK 太弱', 'AP 固件太旧'], a: 0, e: 'SSID 分开只是名字分开；隔离的落点是 VLAN 与二层隔离/ACL。判据就是现象本身：访客终端能 ping 通办公地址，说明还在同一广播域里。' },
{ p: 'p-3', m: 'L3', q: '802.11r（FT）能把漫游切到几十毫秒级，它的本质动作是？', o: ['走动之前先把密钥算好，省掉完整的 802.1X 重认证', '加大发射功率扩大重叠区', '压缩关联报文', '漫游时自动换信道避开干扰'], a: 0, e: 'FT 预计算密钥省的是完整重认证；切换耗时厂商标称口径不一（有的只计重关联），验收以自己空口抓包+长 ping 统计为准，别把某个毫秒数当承诺。' },
{ p: 'p-3', m: 'L3', q: 'FT 只在一组 AP 中的部分 AP 上开启，会发生什么？', o: ['未开启的 AP 自动继承配置', '只有访客 SSID 受影响', '终端漫游到未开启的 AP 时退回完整 802.1X 重认证、切回秒级', '全组统一加速'], a: 2, e: 'FT 预计算要求两端 AP 同属一个可共享密钥的域，只在部分 AP 开启等于域不完整。另注意：老终端驱动不识别 FT 的 AKM 会直接关联失败，要为它们单独留不开 11r 的 SSID。' },
{ p: 'p-3', m: 'L3', q: '跨 AC 边界漫游明显变慢、AC 内正常，最可能的原因是？', o: ['终端省电模式', 'AC 负载过高', '空口干扰突然增大', 'FT 预计算要求两端 AP 在同一控制器/密钥共享域内，跨域只能走完整重认证'], a: 3, e: '判据就是「慢漫游集中在 AC 边界」；规划上让高频漫游区域同域部署，跨域场景另选漫游方案，而不是调计时器硬凑。' },
{ p: 'p-3', m: 'D3', q: '现网配置仓库需要回滚一次变更，用 revert 还是 reset + force push？', o: ['reset 更快所以更安全', 'revert——前向追加反向提交，历史完整可审计；reset 改写历史，现网仓库禁止', '两者等价，看个人习惯', 'revert 只能撤最近一次提交'], a: 1, e: 'reset + force push 会把同事基于旧历史的提交变成孤儿（reflog 能救本地、救不了远端）；revert 可一次撤多个提交（从新到旧），脚本化时 --no-edit 不能省。' },
{ p: 'p-3', m: 'D3', q: '发现某个口令进了 Git 历史。正确的处置顺序是？', o: ['先立即改密钥使旧泄露作废，再清理历史', '删除该文件再提交一次即可', '只清理远端仓库的历史', '不用处理，历史没人翻'], a: 0, e: '历史提交仍可被 checkout，远端与克隆副本同样留存，「删文件再提交」什么都删不掉；先改密钥让旧口令失效，历史清理才有意义。判据：git log -p / git grep 搜敏感串。' },
{ p: 'p-3', m: 'D3', q: '仓库里已完成 revert，设备上却还是新配置。漏了什么环节？', o: ['回滚闭环的下发与回读', '设备要重启才能生效', 'git push 忘了', '要 reset 到更早的提交'], a: 0, e: '回滚闭环三步：仓库回滚、重新下发、回读比对。判据是设备运行配置与仓库目标版本的 diff 不为空——说明下发环节没跑或只跑了一半。Git 只管仓库，还要重新渲染下发旧配置并回读比对 diff 为空。' },
{ p: 'p-3', m: 'W1', q: 'GitOps 落地网络变更，最核心的原则是？', o: ['Git 作为现网唯一真理源', 'Git 里存一份配置做备份', '每天定时全量备份配置', '用最流行的 CI 工具'], a: 0, e: '真理源唯一是根基，判据是「不登录任何设备，能回答现网应该是什么、谁改的、回到哪一版」。紧急修复也走改仓库+快速 PR+下发，不开直改口子。所有变更路径收敛到「改仓库 → PR → CI → 流水线下发」，其余通道只读。' },
{ p: 'p-3', m: 'W1', q: 'PR 合并、CI 全绿，设备却没变成预期配置。最该补的机制是？', o: ['再加一轮 CI 校验', '把 CI 换成人工执行', '加大重试次数', '下发阶段的失败告警与设备回读验证'], a: 3, e: 'CI 绿灯只证明仓库内容合法，不证明下发成功；判据是流水线日志里下发阶段成败 + 设备回读比对。同理只搭 CI 不设分支保护，门禁形同虚设。' },
{ p: 'p-3', m: 'W1', q: '「Git 沦为第二份真相」的判据与治理是？', o: ['定时拉现网与仓库 diff 出现非本次变更的差异——把所有变更通道收敛到同一条流水线', '提交次数变少', '分支数量变多', 'CI 运行时间变长'], a: 0, e: '两条变更路径（手工改设备+仓库流水线）渐渐分叉，仓库就成了摆设；定期现网↔仓库 diff 是发现手段，治理靠收敛路径而不是靠自觉。' },
{ p: 'p-3', m: 'W3', q: 'Jinja2 渲染后输出里出现「vlan」后面空白的孤立关键字。根因与对策是？', o: ['变量名拼错/没传——Jinja2 缺省把未定义变量渲染为空串不报错，用 StrictUndefined 让缺失变量在渲染期抛错', '设备不支持该命令', '模板语法错误', '模板缩进不一致'], a: 0, e: '静默空串是最危险的失败方式；变量要有口径（统一命名、必填校验、显式缺省），渲染后再跑语法校验双保险。' },
{ p: 'p-3', m: 'W3', q: '改一行模板循环逻辑，怎样控制「乘上台数」的爆炸半径？', o: ['直接全量下发后回滚', '交给 CI 自动全量', '只改注释就不需要灰度', '先只渲染不发送，抽检产物+与现网全量 diff，再灰度小批设备，最后全量'], a: 3, e: '模板逻辑乘上设备数量，一个 bug 就乘上台数；渲染结果不可读等于放弃审查权。改模板的回归范围比改一台设备大得多。' },
{ p: 'p-3', m: 'W3', q: '模板化后配置仍出错，排查发现是台账字段缺失、分页只拉到第一页。这口锅该谁背？', o: ['CI 流水线', '模板写得不好', '数据侧：渲染前先校验数据（必填、格式、关联字段完整性），模板不背数据的锅', '网络设备'], a: 2, e: '数据必须来自可信源头（IPAM/CMDB/台账）且先验数据再渲染；一次性查询只拿第一页、字段缺失这类脏数据要挡在渲染之前。' },
{ p: 'p-4', m: 'H1', q: 'IPv6 去掉了 ARP 和广播，邻居发现与地址解析靠什么？', o: ['DHCPv6', 'NDP（基于 ICMPv6）', 'ARPv2', 'RARP'], a: 1, e: 'NDP 承担邻居发现/地址解析/DAD/路由器发现（RS/RA），全部走 ICMPv6；DHCPv6 只在 RA 的 M/O 位指示时参与地址与其他配置下发。' },
{ p: 'p-4', m: 'H1', q: 'RA 报文里 M=1 时，主机的行为是？', o: ['立即重发 RS 请求', '禁用该接口', '向 DHCPv6 要地址；O=1 则向 DHCPv6 要 DNS 等其他配置', '纯 SLAAC 自配地址'], a: 2, e: 'SLAAC 流程：RS → RA（含前缀/网关=链路本地地址）；M=1 用 DHCPv6 拿地址，O=1 只拿其他配置（如 DNS）——两个标志位别记反。' },
{ p: 'p-4', m: 'H1', q: 'display ipv6 neighbors 里大量表项停在 STALE 状态。判断是？', o: ['遭受 RA 攻击', '正常中间态', '邻居发现故障，需要清表', 'DAD 全部失败'], a: 1, e: 'NDP 状态机 INCOMPLETE→STALE→DELAY→PROBE→REACH，STALE 是被动学习的正常停留态；要防的是 RA 伪造劫持网关——接入交换机口配 RA Guard。被动学习后的表项有流量才触发验证，STALE 多不等于故障。' },
{ p: 'p-4', m: 'H2', q: 'OSPFv3 邻居之间交互报文用的地址是？', o: ['全局单播地址', 'Router-ID 对应的地址', '链路本地地址（fe80::/10）', '静态指定的地址'], a: 2, e: 'OSPFv3 基于链路运行，Hello 与邻居建立都用链路本地地址；前提是接口 ipv6 enable 后生成了链路本地地址——没有它 Hello 发不出，邻居一直 Down。' },
{ p: 'p-4', m: 'H2', q: '华为 VRP 上起 OSPFv3 进程但没配 Router-ID，会发生什么？', o: ['报错但进程能跑', '自动选举最大接口 IP', '自动使用 MAC 地址', '进程无法启动'], a: 3, e: 'OSPFv2 可自动选举，OSPFv3 在华为 VRP 必须手工 router-id；v2/v3 默认各跑各的进程，RFC 5838 之后同一 OSPFv3 进程也能双栈承载。Router-ID 撞号会引起 LSA 频繁刷新与邻居震荡。' },
{ p: 'p-4', m: 'H2', q: '与 OSPFv2 的 network 网段宣告不同，OSPFv3 怎么宣告接口？', o: ['仍然用 network 语句', '全局自动宣告所有链路', '只宣告前缀列表', '没有 network 命令，在接口视图下 ospfv3 <进程号> area <区域> 使能'], a: 3, e: '按接口使能是 v3 的模型差异；多链路时漏配某条接口，邻居仍能经其他链路 Full，但该链路网段的路由学不到——缺哪段路由查哪段接口。' },
{ p: 'p-4', m: 'H3', q: 'NAT64 设备配置正常、纯 v6 客户端用 IP 直连 v4 服务也通，但用域名访问全部失败。缺了什么？', o: ['NAT64 地址池', 'RA Guard', '6to4 中继', 'DNS64'], a: 3, e: '纯 v6 主机对 A 记录无从路由：DNS64 负责把 v4 嵌入 /96 前缀合成 AAAA。判据：对域名解析看是否返回 NAT64 前缀段的地址，有合成记录仍不通才查 NAT64 本身。A 记录没有 v6 地址，需要 DNS64 用 NAT64 前缀（常见 64:ff9b::/96）合成 AAAA。' },
{ p: 'p-4', m: 'H3', q: '6to4 隧道两端接口都 up，v6 孤岛间却不通。四层 ACL 与普通 NAT 管不到它，中间链路的放行要点是？', o: ['放行 GRE（协议 47）', '放行 TCP 443', '放行 UDP 3544', '放行 IPv4 协议号 41'], a: 3, e: '6to4 封装是 IPv4 协议号 41，运营商出口/企业 NAT 对非 TCP/UDP 协议常默认丢弃。判据：两端抓包看有没有协议 41 的 IPv4 包进站，没有就查中间链路而不是隧道参数。UDP 3544 是 Teredo。' },
{ p: 'p-4', m: 'H3', q: '抓包看到大量 2002: 开头的 IPv6 地址，可以反推出什么？', o: ['链路本地地址', '组播地址', '这是 6to4 站点前缀，内嵌隧道端点的公网 IPv4（2002::<v4 十六进制>::/48）', 'ULA 私网地址'], a: 2, e: '6to4 前缀聚合在 2002::/16 下、把端点公网 v4 编进前缀，端点公网地址一变前缀就得跟着变；公共 6to4 中继已因安全弃用（RFC 7526），选型直接排除该组合。' },
{ p: 'p-4', m: 'I1', q: '「设备配的是 SNMPv3，所以报文一定加密了」——这句话错在哪？', o: ['v3 三档里不配 privacy 就是 authNoPriv，payload 仍明文', '加密要靠 cipher 参数实现', 'v2c 反而是加密的', 'v3 完全不支持加密'], a: 0, e: '认证与加密是两个独立配置：authentication-mode 只验身份，privacy-mode 才加密。自查看 display snmp-agent usm-user 的用户级别，或在链路抓包确认 payload 是否可读。' },
{ p: 'p-4', m: 'I1', q: 'SNMPv3 对接后网管抓取超时、USM 认证错误计数增长，最常见的原因是？', o: ['设备 CPU 过高', 'OID 不存在', '网管侧把认证与加密两把口令填反了', 'UDP 162 被拦截'], a: 2, e: 'auth（如 sha）与 priv（如 aes128）的口令是两把，填反是 v3 对接最经典的翻车点；162 是 trap 上行方向，与轮询超时无关。' },
{ p: 'p-4', m: 'I1', q: '接手一台存量设备，怎么快速自查 v2c 团体名是否还是默认值？', o: ['snmpwalk -v 2c -c public 试探', '看设备标签', '重启 SNMP 进程再看', '看 CPU 曲线是否波动'], a: 0, e: 'v1/v2c 的团体名即明文口令且全程明文传输，public 是扫描字典必备默认值；被拖库的表现就是接口表、系统信息被批量读走。通了就必须改名并限源，生产直接上 v3 authPriv。' },
