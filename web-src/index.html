<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<title>NetOps 2.0 · 网络学习辅助手册</title>
<script>
(function() {
  /* Android 降级判定 v3（2026-09-22）：仍然「是 Android 就降」，但降的代价变小了。
     以前降级 = 平涂白板，液态玻璃于是名存实亡；现在模糊交给 .wall 单层背景，
     逐元素 backdrop-filter 在 Android 上既没必要（背后已经是虚的）又是当初
     「滚动白雾闪」的根因，所以继续关掉。非 Android 才按能力探测决定。 */
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/.test(ua);
  var hasBackdrop = false;
  try {
    hasBackdrop = !!(window.CSS && CSS.supports &&
      (CSS.supports('backdrop-filter', 'blur(2px)') ||
       CSS.supports('-webkit-backdrop-filter', 'blur(2px)')));
  } catch (e) { hasBackdrop = false; }
  var cm = ua.match(/Chrome\/(\d+)/);
  var chromeVersion = cm ? (parseInt(cm[1], 10) || 0) : 0;
  if (isAndroid || !hasBackdrop || (chromeVersion && chromeVersion < 90)) {
    document.documentElement.classList.add('android-webview');
    /* 只打降级标记，交给 CSS 把 backdrop-filter 换成实色蒙版。
       这里以前会把用户关掉的玻璃强行写回 on:true 并持久化 ——
       用户每次关掉都会在下次启动被偷偷打开。applyGlass 自有默认值，无需在此落盘。 */
  }
})();
</script>
<style>/*__CSS__*/</style>
</head>
<body>

<!-- 预模糊背景层：液态玻璃的"可透之物"由这一层给出。
     逐元素 backdrop-filter 的成本随卡片数线性增长且滚动时反复重算（当初"白雾闪"的根因），
     这里改成壁纸只铺一次、blur 一次，滚动内容叠在上面不再触发任何 backdrop 读取。 -->
<div class="wall" id="wall" aria-hidden="true"></div>

<!--__SPRITE__-->

<div class="app">

  <!-- ============ 顶部应用栏 ============ -->
  <header class="appbar" id="appbar">
    <div class="appbar__row">
      <button class="ibtn" id="btnNav" type="button" aria-label="导航">
        <svg class="icon" aria-hidden="true"><use href="#i-menu" id="navUse"/></svg>
      </button>
      <div class="appbar__title">
        <div class="appbar__name ellipsis" id="barName">NetOps 2.0</div>
        <div class="appbar__sub ellipsis" id="barSub">网络学习辅助手册</div>
      </div>
      <div class="grow"></div>
      <button class="ibtn" id="btnSearch" type="button" aria-label="搜索">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      </button>
      <button class="ibtn" id="btnTheme" type="button" aria-label="切换主题">
        <svg class="icon" aria-hidden="true"><use href="#i-sun" id="themeUse"/></svg>
      </button>
    </div>

    <div class="searchwrap" id="searchWrap">
      <div class="searchbar">
        <svg class="icon icon--sm t-mute" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="搜模块 / 命令 / 故障 / 面试题…">
        <!-- 清空✕按用户决策整体移除（2026-09-30 三轮反馈定论：叉号一律会被
             误读为「关闭搜索」，图形本身教不会）。清空 = 退格键，清到空 = 退出
             搜索；退出 = 框外「取消」。桌面 Chrome 的 type=search 原生✕由 CSS
             隐藏，别让歧义从后门回来。 -->
        <button class="searchbar__cancel" id="btnCancelQ" type="button">取消</button>
      </div>
    </div>

    <div class="topbar-progress"><div class="topbar-progress__fill" id="barFill"></div></div>
  </header>

  <!-- ============ 主滚动区 ============ -->
  <main class="scroll" id="scroll">
    <div class="view is-active" id="view"></div>
  </main>

  <!-- ============ 底部标签栏 ============ -->
  <!-- SVG 样式由 sprite.svg 内的 presentation attribute 控制（fill/stroke 跨 use 边界不传递，必须 attribute 兜底） -->
  <nav class="tabbar" id="tabbar" role="tablist">
    <!-- 共享选中态药丸：在 5 个 tab 之间平移 + 弹簧，取代"每个 tab 自己的 ::before 原地弹出"。
         绝对定位，所以不占 grid 格子（.tabbar 是 repeat(5,1fr)，多一个子元素会挤出版式）。 -->
    <i class="tab-pill" id="tabPill" aria-hidden="true"></i>
    <button class="tab is-active" type="button" data-tab="learn" role="tab">
      <svg class="icon tab__icon" aria-hidden="true"><use href="#i-layers"/></svg><span>学习</span>
    </button>
    <button class="tab" type="button" data-tab="fault" role="tab">
      <svg class="icon tab__icon" aria-hidden="true"><use href="#i-wrench"/></svg><span>排障</span>
    </button>
    <button class="tab" type="button" data-tab="dict" role="tab">
      <svg class="icon tab__icon" aria-hidden="true"><use href="#i-terminal"/></svg><span>字典</span>
    </button>
    <button class="tab" type="button" data-tab="iv" role="tab">
      <svg class="icon tab__icon" aria-hidden="true"><use href="#i-briefcase"/></svg><span>面试</span>
    </button>
    <button class="tab" type="button" data-tab="me" role="tab">
      <svg class="icon tab__icon" aria-hidden="true"><use href="#i-user"/></svg><span>我的</span>
    </button>
  </nav>

  <button class="fab" id="fab" type="button" aria-label="回到顶部">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg>
  </button>
</div>

<!-- ============ 抽屉导航 ============ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="目录">
  <div class="drawer__head">
    <div class="row gap-3">
      <svg class="icon icon--lg" style="color:var(--accent)" aria-hidden="true"><use href="#i-network"/></svg>
      <div class="grow">
        <div style="font-size:15px;font-weight:800">技能目录</div>
        <div class="t-xs t-mute" id="drawerSub">网络学习辅助手册 · 离线版</div>
      </div>
    </div>
    <div class="row gap-1" style="margin-top:12px">
      <div class="bar grow"><div class="bar__fill" id="drawerBar"></div></div>
      <span class="t-xs t-mute mono" id="drawerPct">0%</span>
    </div>
  </div>
  <div class="drawer__body" id="drawerBody"></div>
  <div class="drawer__foot">
    <div class="row gap-1">
      <button class="btn btn--soft btn--sm grow" type="button" data-go="roadmap">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-map"/></svg>学习路线
      </button>
      <button class="btn btn--soft btn--sm grow" type="button" data-go="cli">
        <svg class="icon icon--sm" aria-hidden="true"><use href="#i-terminal"/></svg>CLI 模拟
      </button>
    </div>
  </div>
</aside>
<div class="edge-catcher" id="edge"></div>

<script>/*__JS__*/</script>
</body>
</html>
